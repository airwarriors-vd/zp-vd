<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ЗП-VD</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#0f172a;--card:#111827;--muted:#94a3b8;--text:#e5e7eb;--line:#263244;--accent:#2563eb;--green:#16a34a;--red:#dc2626;--yellow:#f59e0b}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#0f172a,#111827);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif} input,select,textarea,button{font:inherit} .wrap{max-width:1240px;margin:0 auto;padding:20px}.card{background:rgba(17,24,39,.94);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.login{max-width:460px;margin:8vh auto}.title{margin:0 0 6px;font-size:32px}.muted{color:var(--muted);font-size:14px}label{display:block;margin:8px 0 5px;color:#cbd5e1;font-size:14px}input,select,textarea{width:100%;background:#0b1220;color:var(--text);border:1px solid #334155;border-radius:10px;padding:10px;outline:none}textarea{min-height:90px}button{background:var(--accent);color:white;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}button:hover{filter:brightness(1.08)}button.secondary{background:#334155}button.danger{background:var(--red)}button.small{padding:7px 10px;font-size:13px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}.nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.nav button{background:#1e293b}.nav button.active{background:#2563eb}.row{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-6{grid-column:span 6}.col-4{grid-column:span 4}.col-3{grid-column:span 3}.col-2{grid-column:span 2}.grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#0b1220;border:1px solid #334155;border-radius:14px;padding:14px}.stat b{font-size:22px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border-bottom:1px solid #243244;padding:10px;text-align:left;vertical-align:top}th{color:#cbd5e1;background:#0b1220;position:sticky;top:0}.pill{display:inline-block;border-radius:999px;padding:3px 8px;margin:2px;font-size:12px}.blue{background:#1d4ed8}.green{background:#166534}.red{background:#991b1b}.yellow{background:#92400e}.checkrow{display:flex;flex-wrap:wrap;gap:8px}.checkrow label{background:#0b1220;border:1px solid #334155;border-radius:10px;padding:8px 10px;margin:0}.checkrow input{width:auto}.receipt-links a{display:inline-block;margin:2px 6px 2px 0;color:#93c5fd}.msg{position:fixed;right:18px;bottom:18px;background:#111827;border:1px solid #475569;color:white;border-radius:14px;padding:13px 16px;box-shadow:0 18px 55px rgba(0,0,0,.35);z-index:99}.audit-details{white-space:pre-wrap;margin:0;font-family:inherit;color:#dbeafe}.install{display:none}.no-print{display:block}hr{border:0;border-top:1px solid #334155;margin:18px 0}.hint{background:#0b1220;border:1px dashed #475569;border-radius:14px;padding:12px;margin:10px 0;color:#cbd5e1}
    @media(max-width:760px){.wrap{padding:12px}.row,.grid-cards{grid-template-columns:1fr}.col-2,.col-3,.col-4,.col-6,.col-8,.col-12{grid-column:span 1}.top{display:block}.nav button{flex:1 1 auto}.stat b{font-size:18px}}
    @media print{body{background:#fff;color:#000}.wrap{max-width:none}.card{box-shadow:none;border:0;background:#fff;color:#000}.no-print,.nav,.top button{display:none!important}table th,table td{border-color:#999;color:#000}.stat{border-color:#999;background:#fff;color:#000}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL='https://gahbfqpkgnbezkfqkziy.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_xRk6B66TkytVRztLnOq6cQ_Zzn4awMW';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const directions=['Софт','FPV','Класика','БЗВП','Online'];
let me=null,profile=null,tab='dashboard',deferredInstallPrompt=null,employeeCache=[];
const app=document.getElementById('app');
const $=id=>document.getElementById(id);
const screenEl=()=>document.getElementById('screen');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(n){return (Number(n||0)).toLocaleString('uk-UA')+' грн'}
function ym(d=new Date()){return d.toISOString().slice(0,7)+'-01'}
function selectedMonth(){const el=$('global_month');return (el?.value||localStorage.getItem('zpvd_month')||new Date().toISOString().slice(0,7))+'-01'}
function monthEnd(month){const [y,m]=month.slice(0,7).split('-').map(Number);return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10)}
function roleName(r){return r==='admin'?'Адмін':r==='leader'?'Старший групи':'Працівник'}
function statusName(s){return s==='dismissed'?'Звільнений':'Активний'}
function msg(t){const old=document.querySelector('.msg');if(old)old.remove();const el=document.createElement('div');el.className='msg';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),4200)}
function parseJsonMaybe(v){if(v&&typeof v==='object')return v;if(typeof v==='string'){try{return JSON.parse(v)}catch(e){return v}}return v}
function formatDayDetails(d){d=parseJsonMaybe(d)||{};return `Дата роботи: ${d.work_date||'—'}\nНапрямки: ${(d.directions||[d.direction].filter(Boolean)).join(', ')||'—'}\nПальне: ${Number(d.fuel||0)} грн\nАмортизація: ${Number(d.amortization||0)} грн\nПроживання: ${Number(d.accommodation||0)} грн${d.comment?`\nКоментар: ${d.comment}`:''}`}
function formatAuditDetails(details){const d=parseJsonMaybe(details);if(!d)return '';if(typeof d==='string')return d;if(d.old&&d.new)return `Було:\n${formatDayDetails(d.old)}\n\nСтало:\n${formatDayDetails(d.new)}`;if(d.work_date||d.directions||d.direction)return formatDayDetails(d);return JSON.stringify(d,null,2)}
async function logAction(action,details){try{await sb.from('audit_log').insert({user_id:profile?.id||null,action,details:details??''})}catch(e){}}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;const b=$('installBtn');if(b)b.style.display='inline-block'});
async function installApp(){if(!deferredInstallPrompt)return msg('Встановлення доступне через меню браузера');deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}

async function init(){const {data}=await sb.auth.getSession();if(!data.session)return renderLogin();me=data.session.user;await loadProfile()}
async function loadProfile(){const {data,error}=await sb.from('users').select('*').or(`auth_id.eq.${me.id},auth_user_id.eq.${me.id},email.eq.${me.email}`).maybeSingle();if(error)return renderNoProfile(error.message);if(!data)return renderNoProfile();profile=data;if((profile.status||profile.employee_status)==='dismissed')return renderDismissed();renderApp()}
function renderLogin(){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">ЗП-VD</h1><p class="muted">Вхід через email та пароль. Пристрій запам’ятовується автоматично.</p><label>Email</label><input id="email" type="email" placeholder="name@example.com"><label>Пароль</label><input id="password" type="password" placeholder="Пароль"><div style="height:14px"></div><button onclick="login()">Увійти</button></div></div>`}
async function login(){const email=$('email').value.trim();const password=$('password').value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return msg(error.message);me=data.user;await loadProfile()}
function renderNoProfile(extra=''){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">Профіль не знайдено</h1><p>Ваш email авторизований, але профіль працівника ще не прив’язаний.</p>${extra?`<p class="muted">${esc(extra)}</p>`:''}<p class="muted">ID Auth:</p><input readonly value="${esc(me?.id||'')}"><p class="muted">Email:</p><input readonly value="${esc(me?.email||'')}"><button onclick="logout()" class="secondary" style="margin-top:12px">Вийти</button></div></div>`}
function renderDismissed(){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">Доступ закрито</h1><p>Ваш профіль має статус “Звільнений”.</p><button onclick="logout()" class="secondary">Вийти</button></div></div>`}
async function logout(){await sb.auth.signOut();location.reload()}
function nav(){const items=[['dashboard','Головна'],['days','Робочі дні'],['salary','Мій розрахунок'],['profile','Мій профіль']];if(profile.role==='leader')items.push(['leader','Мій напрямок']);if(profile.role==='admin')items.push(['employees','Працівники'],['reports','Звіти'],['adjustments','Коригування'],['locks','Закриття місяця'],['leader','Напрямки'],['audit','Журнал']);return `<div class="nav">${items.map(i=>`<button class="${tab===i[0]?'active':''}" onclick="tab='${i[0]}';renderApp()">${i[1]}</button>`).join('')}<button onclick="logout()" class="secondary">Вийти</button></div>`}
async function renderApp(){const month=localStorage.getItem('zpvd_month')||new Date().toISOString().slice(0,7);app.innerHTML=`<div class="wrap"><div class="top"><div><h1 class="title">ЗП-VD</h1><div class="muted">${esc(profile.full_name)} ${profile.callsign?'('+esc(profile.callsign)+')':''} · ${roleName(profile.role)}</div></div><div class="no-print"><button id="installBtn" class="secondary install" onclick="installApp()">Встановити застосунок</button><label>Місяць</label><input id="global_month" type="month" value="${month}" onchange="localStorage.setItem('zpvd_month',this.value);renderApp()"></div></div>${nav()}<div id="screen" class="card">Завантаження...</div></div>`;const b=$('installBtn');if(b&&deferredInstallPrompt)b.style.display='inline-block';try{if(tab==='dashboard')return await screenDashboard();if(tab==='days')return await screenDays();if(tab==='salary')return await screenSalary();if(tab==='profile')return screenProfile();if(tab==='employees')return await screenEmployees();if(tab==='reports')return await screenReports();if(tab==='adjustments')return await screenAdjustments();if(tab==='locks')return await screenLocks();if(tab==='leader')return await screenLeader();if(tab==='audit')return await screenAudit()}catch(e){screenEl().innerHTML=`<h2>Помилка</h2><p>${esc(e.message||e)}</p>`}}

async function fetchComputedSalary(month,userFilter=null){
  const from=month,to=monthEnd(month);
  let uq=sb.from('users').select('*').order('full_name'); if(userFilter)uq=uq.eq('id',userFilter); const {data:users,error:uErr}=await uq; if(uErr)throw uErr;
  let wq=sb.from('work_days').select('*').gte('work_date',from).lte('work_date',to); if(userFilter)wq=wq.eq('user_id',userFilter); const {data:days,error:wErr}=await wq; if(wErr)throw wErr;
  let aq=sb.from('adjustments').select('*').eq('adjustment_month',month); if(userFilter)aq=aq.eq('user_id',userFilter); const {data:adj,error:aErr}=await aq; if(aErr)throw aErr;
  const ids=(users||[]).map(u=>u.id); let rates=[]; if(ids.length){const {data:r}=await sb.from('salary_rates_history').select('*').in('user_id',ids).lte('effective_from',to).order('effective_from',{ascending:true});rates=r||[]}
  function rateAt(u,date){const rs=rates.filter(r=>r.user_id===u.id&&r.effective_from<=date);const last=rs[rs.length-1];return {daily_rate:Number(last?.daily_rate??u.daily_rate??2500),employee_deduction:Number(last?.employee_deduction??u.employee_deduction??48000)}}
  return (users||[]).map(u=>{const ds=(days||[]).filter(d=>d.user_id===u.id);let base=0,fuel=0,am=0,acc=0;ds.forEach(d=>{base+=rateAt(u,d.work_date).daily_rate;fuel+=Number(d.fuel||0);am+=Number(d.amortization||0);acc+=Number(d.accommodation||0)});const ads=(adj||[]).filter(a=>a.user_id===u.id);let adjustments_total=0,bonus=0,fine=0;ads.forEach(a=>{const val=Number(a.amount||0);if(a.type==='bonus'){adjustments_total+=val;bonus+=val}else{adjustments_total-=val;fine+=val}});const deduction=(u.employment_type==='employee')?rateAt(u,to).employee_deduction:0;return {user_id:u.id,full_name:u.full_name,callsign:u.callsign,email:u.email,employment_type:u.employment_type,status:u.status||u.employee_status,daily_rate:rateAt(u,to).daily_rate,employee_deduction:deduction,salary_month:month,work_days_count:ds.length,base_salary:base,fuel_total:fuel,amortization_total:am,accommodation_total:acc,adjustments_total,bonus_total:bonus,fine_total:fine,total_to_pay:base+fuel+am+acc+adjustments_total-deduction}})
}
async function screenDashboard(){const m=selectedMonth();const rows=await fetchComputedSalary(m,profile.role==='admin'?null:profile.id);const totalDays=rows.reduce((s,r)=>s+r.work_days_count,0);const totalPay=rows.reduce((s,r)=>s+r.total_to_pay,0);const expenses=rows.reduce((s,r)=>s+r.fuel_total+r.amortization_total+r.accommodation_total,0);screenEl().innerHTML=`<h2>Головна</h2><div class="grid-cards"><div class="stat"><span class="muted">Місяць</span><br><b>${m.slice(0,7)}</b></div><div class="stat"><span class="muted">Робочих днів / записів</span><br><b>${totalDays}</b></div><div class="stat"><span class="muted">Витрати</span><br><b>${fmt(expenses)}</b></div><div class="stat"><span class="muted">До виплати</span><br><b>${fmt(totalPay)}</b></div></div>`}

async function isMonthLocked(userId,dateStr){const month=dateStr.slice(0,7)+'-01';const {data,error}=await sb.from('month_locks').select('id').eq('user_id',userId).or(`lock_month.eq.${month},salary_month.eq.${month}`).maybeSingle();if(error){msg(error.message);return true}return !!data}
async function uploadReceipt(inputId,kind,date){const input=$(inputId);if(!input||!input.files||!input.files[0])return null;const file=input.files[0];const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${profile.id}/${date}/${kind}-${Date.now()}.${ext}`;const {error}=await sb.storage.from('receipts').upload(path,file,{upsert:true,cacheControl:'3600'});if(error){msg('Помилка фото: '+error.message);return null}return sb.storage.from('receipts').getPublicUrl(path).data.publicUrl}
async function screenDays(){screenEl().innerHTML=`<h2>Робочі дні</h2><div class="row"><div class="col-4"><label>Дата</label><input id="wd_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="col-8"><label>Напрямки</label><div class="checkrow">${directions.map(d=>`<label><input type="checkbox" name="dir" value="${d}"> ${d}</label>`).join('')}</div></div><div class="col-4"><label>Пальне</label><input id="fuel" type="number" value="0"></div><div class="col-4"><label>Амортизація</label><input id="amort" type="number" value="0"></div><div class="col-4"><label>Проживання</label><input id="acc" type="number" value="0"></div><div class="col-4"><label>Фото чека пальне</label><input id="fuel_receipt" type="file" accept="image/*,application/pdf"></div><div class="col-4"><label>Фото чека проживання</label><input id="acc_receipt" type="file" accept="image/*,application/pdf"></div><div class="col-4"><label>Інший чек / підтвердження</label><input id="other_receipt" type="file" accept="image/*,application/pdf"></div><div class="col-12"><label>Коментар</label><textarea id="comment"></textarea></div><div class="col-12"><button onclick="saveDay()">Зберегти день</button></div></div><hr><div id="mydays">Завантаження...</div>`;loadDays()}
async function saveDay(){const date=$('wd_date').value;const locked=await isMonthLocked(profile.id,date);if(locked)return msg('Цей місяць закрито. Редагування недоступне.');const ds=[...document.querySelectorAll('input[name=dir]:checked')].map(x=>x.value);if(!ds.length)return msg('Оберіть хоча б один напрямок');const old=await sb.from('work_days').select('*').eq('user_id',profile.id).eq('work_date',date).maybeSingle();const rec={user_id:profile.id,work_date:date,directions:ds,fuel:+$('fuel').value||0,amortization:+$('amort').value||0,accommodation:+$('acc').value||0,comment:$('comment').value||'',submitted_at:new Date().toISOString(),updated_at:new Date().toISOString()};const fu=await uploadReceipt('fuel_receipt','fuel',date);const au=await uploadReceipt('acc_receipt','accommodation',date);const ou=await uploadReceipt('other_receipt','other',date);if(fu)rec.fuel_receipt_url=fu;if(au)rec.accommodation_receipt_url=au;if(ou)rec.other_receipt_url=ou;const {error}=await sb.from('work_days').upsert(rec,{onConflict:'user_id,work_date'});if(error)return msg(error.message);await logAction(old.data?'updated':'created',old.data?{old:old.data,new:rec}:rec);msg('Збережено');screenDays()}
async function loadDays(){const {data,error}=await sb.from('work_days').select('*').eq('user_id',profile.id).order('work_date',{ascending:false}).limit(80);if(error)return $('mydays').innerHTML=esc(error.message);$('mydays').innerHTML=tableDays(data||[],false)}
function receiptLinks(r){let html='';if(r.fuel_receipt_url)html+=`<a target="_blank" href="${esc(r.fuel_receipt_url)}">Пальне</a>`;if(r.accommodation_receipt_url)html+=`<a target="_blank" href="${esc(r.accommodation_receipt_url)}">Проживання</a>`;if(r.other_receipt_url)html+=`<a target="_blank" href="${esc(r.other_receipt_url)}">Інше</a>`;return html||'<span class="muted">—</span>'}
function tableDays(rows,showUser){if(!rows.length)return '<p class="muted">Записів немає</p>';return `<div class="table-wrap"><table><thead><tr>${showUser?'<th>Працівник</th>':''}<th>Дата</th><th>Напрямки</th><th>Витрати</th><th>Чеки</th><th>Подано</th></tr></thead><tbody>${rows.map(r=>`<tr>${showUser?`<td>${esc(r.users?.full_name||'')}</td>`:''}<td>${esc(r.work_date)}</td><td>${(r.directions||[r.direction].filter(Boolean)).map(d=>`<span class="pill blue">${esc(d)}</span>`).join('')}</td><td>${fmt((+r.fuel||0)+(+r.amortization||0)+(+r.accommodation||0))}</td><td class="receipt-links">${receiptLinks(r)}</td><td>${r.created_at?new Date(r.created_at).toLocaleString('uk-UA'):''}</td></tr>`).join('')}</tbody></table></div>`}

async function screenSalary(){const rows=await fetchComputedSalary(selectedMonth(),profile.id);const r=rows[0]||{};screenEl().innerHTML=`<h2>Мій розрахунок</h2><button class="secondary no-print" onclick="window.print()">Друк / PDF</button><hr><div class="grid-cards"><div class="stat"><span class="muted">Робочих днів</span><br><b>${r.work_days_count||0}</b></div><div class="stat"><span class="muted">Основна зарплата</span><br><b>${fmt(r.base_salary)}</b></div><div class="stat"><span class="muted">Витрати</span><br><b>${fmt((r.fuel_total||0)+(r.amortization_total||0)+(r.accommodation_total||0))}</b></div><div class="stat"><span class="muted">До виплати</span><br><b>${fmt(r.total_to_pay)}</b></div></div><table><tbody><tr><td>Ставка</td><td>${fmt(r.daily_rate)}</td></tr><tr><td>Премії</td><td>${fmt(r.bonus_total)}</td></tr><tr><td>Штрафи</td><td>${fmt(r.fine_total)}</td></tr><tr><td>Утримання</td><td>${fmt(r.employee_deduction)}</td></tr></tbody></table>`}

function screenProfile(){screenEl().innerHTML=`<h2>Мій профіль</h2><div class="row"><div class="col-6"><label>ПІБ</label><input value="${esc(profile.full_name)}" disabled></div><div class="col-6"><label>Позивний</label><input value="${esc(profile.callsign)}" disabled></div><div class="col-4"><label>Телефон</label><input id="p_phone" value="${esc(profile.phone)}"></div><div class="col-4"><label>Email</label><input id="p_email" type="email" value="${esc(profile.email||me.email)}"></div><div class="col-4"><label>Дата народження</label><input id="p_birth" type="date" value="${profile.birth_date||''}"></div><div class="col-3"><label>Нагадування</label><select id="p_reminder_enabled"><option value="true" ${profile.reminder_enabled!==false?'selected':''}>Увімкнено</option><option value="false" ${profile.reminder_enabled===false?'selected':''}>Вимкнено</option></select></div><div class="col-3"><label>Частота</label><select id="p_reminder_frequency"><option value="daily" ${profile.reminder_frequency==='daily'?'selected':''}>Щодня</option><option value="weekly" ${(!profile.reminder_frequency||profile.reminder_frequency==='weekly')?'selected':''}>Раз на тиждень</option><option value="monthly" ${profile.reminder_frequency==='monthly'?'selected':''}>Раз на місяць</option></select></div><div class="col-3"><label>День</label><select id="p_reminder_day"><option value="monday">Понеділок</option><option value="friday" ${(!profile.reminder_day||profile.reminder_day==='friday')?'selected':''}>П’ятниця</option><option value="month_start" ${profile.reminder_day==='month_start'?'selected':''}>Початок місяця</option><option value="month_end" ${profile.reminder_day==='month_end'?'selected':''}>Кінець місяця</option></select></div><div class="col-3"><label>Час</label><input id="p_reminder_time" type="time" value="${profile.reminder_time||'18:00'}"></div><div class="col-12"><button onclick="saveProfile()">Зберегти профіль</button></div></div><hr><h3>Зміна пароля</h3><div class="row"><div class="col-6"><label>Новий пароль</label><input id="new_pass" type="password"></div><div class="col-6"><label>Повторіть пароль</label><input id="new_pass2" type="password"></div><div class="col-12"><button onclick="changePassword()">Змінити пароль</button></div></div>`; if($('p_reminder_day'))$('p_reminder_day').value=profile.reminder_day||'friday'}
async function saveProfile(){const updates={phone:$('p_phone').value||null,email:$('p_email').value||null,birth_date:$('p_birth').value||null,reminder_enabled:$('p_reminder_enabled').value==='true',reminder_frequency:$('p_reminder_frequency').value,reminder_day:$('p_reminder_day').value,reminder_time:$('p_reminder_time').value||'18:00'};const {error}=await sb.from('users').update(updates).eq('id',profile.id);if(error)return msg(error.message);Object.assign(profile,updates);msg('Профіль оновлено')}
async function changePassword(){const p1=$('new_pass').value,p2=$('new_pass2').value;if(!p1||p1!==p2)return msg('Паролі не співпадають');if(p1.length<6)return msg('Пароль мінімум 6 символів');const {error}=await sb.auth.updateUser({password:p1});if(error)return msg(error.message);msg('Пароль змінено');$('new_pass').value='';$('new_pass2').value=''}

async function screenEmployees(){screenEl().innerHTML=`<h2>Працівники</h2><div class="hint">Для зміни ставки або утримання вкажіть дату <b>Діє з</b>. Старі дні та місяці не будуть перераховані новою ставкою.</div><div class="row"><input type="hidden" id="e_id"><div class="col-3"><label>ПІБ</label><input id="e_full"></div><div class="col-3"><label>Позивний</label><input id="e_call"></div><div class="col-3"><label>Email</label><input id="e_email" type="email"></div><div class="col-3"><label>Пароль для нового</label><input id="e_password" type="text" placeholder="Для нового працівника"></div><div class="col-3"><label>Телефон</label><input id="e_phone"></div><div class="col-3"><label>Дата народження</label><input id="e_birth" type="date"></div><div class="col-3"><label>Ставка за день</label><input id="e_daily" type="number" value="2500"></div><div class="col-3"><label>Утримання</label><input id="e_deduct" type="number" value="48000"></div><div class="col-3"><label>Діє з</label><input id="e_effective" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="col-3"><label>Статус</label><select id="e_emp"><option value="employee">Працевлаштований</option><option value="freelancer">Фрілансер</option></select></div><div class="col-3"><label>Стан</label><select id="e_status"><option value="active">Активний</option><option value="dismissed">Звільнений</option></select></div><div class="col-3"><label>Роль</label><select id="e_role"><option value="user">Працівник</option><option value="leader">Старший групи</option><option value="admin">Адмін</option></select></div><div class="col-3"><label>Напрямок старшого</label><select id="e_leader"><option value="">—</option>${directions.map(d=>`<option>${d}</option>`).join('')}</select></div><div class="col-12"><button onclick="saveEmployee()">Зберегти</button> <button class="secondary" onclick="clearEmployeeForm()">Очистити</button></div></div><hr><div id="emps">Завантаження...</div>`;loadEmployees()}
function clearEmployeeForm(){['e_id','e_full','e_call','e_email','e_password','e_phone','e_birth'].forEach(id=>$(id).value='');$('e_daily').value=2500;$('e_deduct').value=48000;$('e_effective').value=new Date().toISOString().slice(0,10);$('e_emp').value='freelancer';$('e_status').value='active';$('e_role').value='user';$('e_leader').value=''}
async function saveEmployee(){const id=$('e_id').value;const old=id?employeeCache.find(u=>u.id===id):null;const effective=$('e_effective').value||new Date().toISOString().slice(0,10);const rec={full_name:$('e_full').value.trim(),callsign:$('e_call').value.trim(),email:$('e_email').value.trim(),phone:$('e_phone').value||null,birth_date:$('e_birth').value||null,employment_type:$('e_emp').value,status:$('e_status').value,employee_status:$('e_status').value,role:$('e_role').value,leader_direction:$('e_leader').value||null,daily_rate:+$('e_daily').value||2500,employee_deduction:+$('e_deduct').value||0};if(!rec.full_name||!rec.email)return msg('Заповніть ПІБ та email');let userId=id;if(!id){const pass=$('e_password').value.trim();if(!pass)return msg('Для нового працівника вкажіть пароль');const resp=await fetch('/api/create-employee',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...rec,password:pass})});const data=await resp.json().catch(()=>({error:'Невідома помилка'}));if(!resp.ok)return msg(data.error||'Помилка створення');const found=await sb.from('users').select('id').eq('email',rec.email).maybeSingle();userId=found.data?.id}else{if(old){await sb.from('salary_rates_history').upsert({user_id:id,effective_from:'1900-01-01',daily_rate:Number(old.daily_rate||2500),employee_deduction:Number(old.employee_deduction||48000),created_by:profile.id},{onConflict:'user_id,effective_from'})}const {error}=await sb.from('users').update(rec).eq('id',id);if(error)return msg(error.message);await logAction('Змінено працівника',`${rec.full_name} (${rec.callsign||''})`)}if(userId){await sb.from('salary_rates_history').upsert({user_id:userId,effective_from:effective,daily_rate:rec.daily_rate,employee_deduction:rec.employee_deduction,created_by:profile.id},{onConflict:'user_id,effective_from'})}msg('Працівника збережено');clearEmployeeForm();loadEmployees()}
async function loadEmployees(){const {data,error}=await sb.from('users').select('*').order('full_name');const box=$('emps');if(error)return box.innerHTML=esc(error.message);employeeCache=data||[];box.innerHTML=`<div class="table-wrap"><table><thead><tr><th>ПІБ</th><th>Позивний</th><th>Email</th><th>Роль</th><th>Тип</th><th>Ставка</th><th>Утримання</th><th>Стан</th><th></th></tr></thead><tbody>${employeeCache.map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.callsign)}</td><td>${esc(u.email)}</td><td>${roleName(u.role)}</td><td>${u.employment_type==='employee'?'Працевлаштований':'Фрілансер'}</td><td>${fmt(u.daily_rate)}</td><td>${fmt(u.employee_deduction)}</td><td>${statusName(u.status||u.employee_status)}</td><td><button class="secondary small" onclick="editEmployeeById('${u.id}')">Редагувати</button></td></tr>`).join('')}</tbody></table></div>`}
function editEmployeeById(id){const u=employeeCache.find(x=>x.id===id);if(!u)return msg('Працівника не знайдено');$('e_id').value=u.id;$('e_full').value=u.full_name||'';$('e_call').value=u.callsign||'';$('e_email').value=u.email||'';$('e_password').value='';$('e_phone').value=u.phone||'';$('e_birth').value=u.birth_date||'';$('e_daily').value=u.daily_rate||2500;$('e_deduct').value=u.employee_deduction||48000;$('e_effective').value=new Date().toISOString().slice(0,10);$('e_emp').value=u.employment_type||'freelancer';$('e_status').value=u.status||u.employee_status||'active';$('e_role').value=u.role||'user';$('e_leader').value=u.leader_direction||'';window.scrollTo({top:0,behavior:'smooth'});msg('Працівника завантажено у форму')}

async function screenReports(){const rows=await fetchComputedSalary(selectedMonth(),null);screenEl().innerHTML=`<h2>Звіти</h2><button onclick="exportSalaryExcel()">Експорт Excel</button><hr><div class="table-wrap"><table><thead><tr><th>Місяць</th><th>ПІБ</th><th>Днів</th><th>Ставка</th><th>Зарплата</th><th>Витрати</th><th>Коригування</th><th>Утримання</th><th>До виплати</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.salary_month}</td><td>${esc(r.full_name)} ${r.callsign?'('+esc(r.callsign)+')':''}</td><td>${r.work_days_count}</td><td>${fmt(r.daily_rate)}</td><td>${fmt(r.base_salary)}</td><td>${fmt(r.fuel_total+r.amortization_total+r.accommodation_total)}</td><td>${fmt(r.adjustments_total)}</td><td>${fmt(r.employee_deduction)}</td><td><b>${fmt(r.total_to_pay)}</b></td></tr>`).join('')}</tbody></table></div>`}
async function exportSalaryExcel(){const data=await fetchComputedSalary(selectedMonth(),null);if(!data.length)return msg('Немає даних');const rows=[['Місяць','ПІБ','Позивний','Днів','Ставка','Зарплата','Пальне','Амортизація','Проживання','Коригування','Утримання','До виплати'],...data.map(r=>[r.salary_month,r.full_name,r.callsign||'',r.work_days_count,r.daily_rate,r.base_salary,r.fuel_total,r.amortization_total,r.accommodation_total,r.adjustments_total,r.employee_deduction,r.total_to_pay])];const csv=rows.map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zp-vd-zvit.csv';a.click()}

function adjustmentMonth(){return ($('adj_month')?.value||selectedMonth().slice(0,7))+'-01'}
async function screenAdjustments(){const {data:users,error}=await sb.from('users').select('id,full_name,callsign').order('full_name');if(error)return screenEl().innerHTML=esc(error.message);screenEl().innerHTML=`<h2>Коригування</h2><div class="row"><div class="col-3"><label>Місяць</label><input id="adj_month" type="month" value="${selectedMonth().slice(0,7)}" onchange="loadAdjustments()"></div><div class="col-3"><label>Працівник</label><select id="adj_user">${(users||[]).map(u=>`<option value="${u.id}">${esc(u.full_name)} ${u.callsign?'('+esc(u.callsign)+')':''}</option>`).join('')}</select></div><div class="col-2"><label>Тип</label><select id="adj_type"><option value="bonus">Премія</option><option value="fine">Штраф</option></select></div><div class="col-2"><label>Сума</label><input id="adj_amount" type="number" value="0"></div><div class="col-12"><label>Коментар</label><textarea id="adj_comment"></textarea></div><div class="col-12"><button onclick="addAdjustment()">Додати коригування</button></div></div><hr><h3>Коригування за місяць</h3><div id="adj_list">Завантаження...</div>`;loadAdjustments()}
async function addAdjustment(){const rec={user_id:$('adj_user').value,adjustment_month:adjustmentMonth(),type:$('adj_type').value,amount:+$('adj_amount').value||0,comment:$('adj_comment').value||'',title:$('adj_comment').value||'',created_by:profile.id};const {error}=await sb.from('adjustments').insert(rec);if(error)return msg(error.message);await logAction(rec.type==='bonus'?'Додано премію':'Додано штраф',`${fmt(rec.amount)} · ${rec.comment||''}`);msg('Додано');loadAdjustments()}
async function loadAdjustments(){const adjList=$('adj_list');if(!adjList)return;const month=adjustmentMonth();const {data,error}=await sb.from('adjustments').select('*').eq('adjustment_month',month).order('created_at',{ascending:false});if(error)return adjList.innerHTML=esc(error.message);if(!data||!data.length)return adjList.innerHTML='<p class="muted">Коригувань за цей місяць немає.</p>';const ids=[...new Set(data.map(a=>a.user_id).filter(Boolean))];let users=[];if(ids.length){const res=await sb.from('users').select('id,full_name,callsign').in('id',ids);users=res.data||[]}const map=Object.fromEntries(users.map(u=>[u.id,u]));adjList.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Працівник</th><th>Тип</th><th>Сума</th><th>Коментар</th><th>Дата</th><th></th></tr></thead><tbody>${data.map(a=>{const u=map[a.user_id]||{};return `<tr><td>${esc(u.full_name||'')} ${u.callsign?'('+esc(u.callsign)+')':''}</td><td>${a.type==='bonus'?'<span class="pill green">Премія</span>':'<span class="pill red">Штраф</span>'}</td><td>${fmt(a.amount)}</td><td>${esc(a.comment||a.title||'')}</td><td>${a.created_at?new Date(a.created_at).toLocaleString('uk-UA'):''}</td><td><button class="danger small" onclick="deleteAdjustment('${a.id}')">Видалити</button></td></tr>`}).join('')}</tbody></table></div>`}
async function deleteAdjustment(id){if(!confirm('Видалити коригування?'))return;const {error}=await sb.from('adjustments').delete().eq('id',id);if(error)return msg(error.message);msg('Видалено');loadAdjustments()}

async function screenLocks(){screenEl().innerHTML=`<h2>Закриття місяця</h2><label>Оберіть місяць</label><input id="lock_month" type="month" value="${selectedMonth().slice(0,7)}" onchange="screenLocksLoad()"><div id="locks_area" style="margin-top:16px">Завантаження...</div>`;screenLocksLoad()}
function selectedLockMonth(){return $('lock_month').value+'-01'}
async function screenLocksLoad(){const month=selectedLockMonth();const {data:users}=await sb.from('users').select('id,full_name,callsign,status').order('full_name');const {data:locks}=await sb.from('month_locks').select('*').or(`lock_month.eq.${month},salary_month.eq.${month}`);const locked=new Set((locks||[]).map(l=>l.user_id));$('locks_area').innerHTML=`<button onclick="closeMonthAll()">Закрити цей місяць всім активним</button><hr><h3>Закрити вибраним</h3><div class="checkrow">${(users||[]).map(u=>`<label><input type="checkbox" name="lock_user" value="${u.id}"> ${esc(u.full_name)} ${u.callsign?'('+esc(u.callsign)+')':''} ${locked.has(u.id)?'🔒':''}</label>`).join('')}</div><div style="height:14px"></div><button onclick="closeMonthSelected()">Закрити вибраним</button>`}
async function closeMonthAll(){if(!confirm('Закрити місяць всім активним?'))return;const month=selectedLockMonth();const {data:users,error}=await sb.from('users').select('id').eq('status','active');if(error)return msg(error.message);await upsertLocks((users||[]).map(u=>u.id),month)}
async function closeMonthSelected(){const ids=[...document.querySelectorAll('input[name=lock_user]:checked')].map(x=>x.value);if(!ids.length)return msg('Оберіть працівників');await upsertLocks(ids,selectedLockMonth())}
async function upsertLocks(ids,month){const rows=ids.map(id=>({salary_month:month,lock_month:month,user_id:id,locked_by:profile.id}));const {error}=await sb.from('month_locks').upsert(rows,{onConflict:'lock_month,user_id'});if(error)return msg(error.message);await logAction('Закрито місяць',month);msg('Місяць закрито');screenLocksLoad()}

async function screenLeader(){const dir=profile.role==='leader'?profile.leader_direction:null;const chosen=dir||directions[0];let header=`<h2>Звіти по напрямку</h2>`;if(profile.role==='admin')header+=`<label>Напрямок</label><select id="leader_dir" onchange="screenLeader()">${directions.map(d=>`<option ${d===chosen?'selected':''}>${d}</option>`).join('')}</select>`;const dval=$('leader_dir')?.value||chosen;if(!dval)return screenEl().innerHTML='<h2>Мій напрямок</h2><p>Вам не призначено напрямок.</p>';const {data,error}=await sb.from('work_days').select('*, users(full_name,callsign)').contains('directions',[dval]).order('work_date',{ascending:false}).limit(250);screenEl().innerHTML=header+(error?esc(error.message):tableDays(data||[],true))}
async function screenAudit(){const {data,error}=await sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(200);if(error)return screenEl().innerHTML=esc(error.message);const ids=[...new Set((data||[]).map(a=>a.user_id).filter(Boolean))];let users=[];if(ids.length){const res=await sb.from('users').select('id,full_name,callsign').in('id',ids);users=res.data||[]}const map=Object.fromEntries(users.map(u=>[u.id,u]));screenEl().innerHTML=`<h2>Журнал</h2><div class="table-wrap"><table><thead><tr><th>Дата</th><th>Користувач</th><th>Дія</th><th>Деталі</th></tr></thead><tbody>${(data||[]).map(a=>{const u=map[a.user_id]||{};return `<tr><td>${new Date(a.created_at).toLocaleString('uk-UA')}</td><td>${esc(u.full_name||'')} ${u.callsign?'('+esc(u.callsign)+')':''}</td><td>${esc(a.action)}</td><td><pre class="audit-details">${esc(formatAuditDetails(a.details))}</pre></td></tr>`}).join('')}</tbody></table></div>`}
init();
</script>
</body>
</html>
