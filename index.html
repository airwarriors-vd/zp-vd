    @media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.col-2,.col-3,.col-4,.col-6,.col-8,.col-12{grid-column:span 1}.top{display:block}.wrap{padding:10px}th,td{font-size:12px}.nav button{flex:1 1 auto}}

function parseYmdLocal(s){const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1);}
function safeReceiptUrls(v){
  if(!v)return [];
  if(Array.isArray(v))return v.filter(Boolean);
  const str=String(v).trim();
  if(!str)return [];
  try{const j=JSON.parse(str); if(Array.isArray(j))return j.filter(Boolean)}catch(e){}
  return str.split(/\n|,\s*/).map(x=>x.trim()).filter(Boolean);
}
function storeReceiptUrls(arr){return (arr||[]).filter(Boolean).join('\n')||null}
function formatMonthUa(m){
  const [y,mo]=String(m).slice(0,7).split('-');
  const names=['січень','лютий','березень','квітень','травень','червень','липень','серпень','вересень','жовтень','листопад','грудень'];
  return (names[(+mo||1)-1]||mo)+' '+y;
}

function directionChecks(name,selected=[]){const set=new Set(selected||[]);return `<div class="checkrow">${directions.map(d=>`<label><input type="checkbox" name="${name}" value="${d}" ${set.has(d)?'checked':''}> ${d}</label>`).join('')}</div>`}

async function authHeaders(){const {data:{session}}=await sb.auth.getSession();return session?.access_token?{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token}:{'Content-Type':'application/json'}}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData=window.atob(base64);
  const outputArray=new Uint8Array(rawData.length);
  for(let i=0;i<rawData.length;i++) outputArray[i]=rawData.charCodeAt(i);
  return outputArray;
}
async function enablePushNotifications(){
  try{
    if(!('serviceWorker' in navigator)) return msg('Service Worker не підтримується на цьому пристрої');
    if(!('PushManager' in window)) return msg('Push-сповіщення не підтримуються цим браузером');
    if(!VAPID_PUBLIC_KEY || VAPID_PUBLIC_KEY.includes('PASTE_')) return msg('Спочатку вставте VAPID_PUBLIC_KEY в index.html');
    const perm=await Notification.requestPermission();
    if(perm!=='granted') return msg('Сповіщення не дозволені');
    const reg=await navigator.serviceWorker.register('/sw.js');
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
    const {error}=await sb.from('push_subscriptions').upsert({user_id:profile.id,endpoint:sub.endpoint,subscription:sub.toJSON()},{onConflict:'endpoint'});
    if(error) return msg(error.message);
    msg('Push-сповіщення увімкнено для цього пристрою');
  }catch(e){ msg('Push не увімкнувся: '+(e.message||e)); }
}
async function init(){if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})} const {data:{session}}=await sb.auth.getSession(); if(!session) return renderLogin(); me=session.user; await loadProfile(); if(!profile) return renderNoProfile(); if(profile.status==='dismissed'||profile.employee_status==='dismissed') return renderBlocked(); renderApp()}
function renderLogin(){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">ЗП-VD</h1><p class="muted">Вхід через email та пароль.</p><label>Email</label><input id="email" type="email"><label>Пароль</label><input id="password" type="password"><br><br><button class="btn primary" onclick="login()">Увійти</button></div></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value}); if(error)return msg(error.message); init()}
async function logout(){await sb.auth.signOut(); location.reload()}
async function loadProfile(){const uid=me.id; let {data}=await sb.from('users').select('*').or(`auth_id.eq.${uid},auth_user_id.eq.${uid},id.eq.${uid},email.eq.${me.email}`).maybeSingle(); profile=data||null}

function renderBlocked(){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">Доступ заблоковано</h1><p>Ваш профіль має статус звільнений/неактивний.</p><button class="btn" onclick="logout()">Вийти</button></div></div>`}
function nav(){let items=[['dashboard','Головна'],['days','Робочі дні'],['payslip','Мій розрахунок'],['profile','Мій профіль']]; if(profile.role==='leader')items.push(['leader','Мій напрямок']); if(profile.role==='admin')items.push(['employees','Працівники'],['reports','Звіти'],['missing','Невнесені звіти'],['backup','Архів'],['adjustments','Коригування'],['locks','Закриття місяця'],['audit','Журнал']); return `<div class="nav">${items.map(i=>`<button class="${tab===i[0]?'active':''}" onclick="tab='${i[0]}';renderApp()">${i[1]}</button>`).join('')}<button onclick="logout()">Вийти</button></div>`}
function renderApp(){app.innerHTML=`<div class="wrap"><div class="top"><div><h1 class="title">ЗП-VD</h1><div class="muted">${esc(profile.full_name)} ${profile.callsign?'('+esc(profile.callsign)+')':''} · ${roleName(profile.role)}</div></div><button class="btn blue" onclick="installApp()">Встановити застосунок</button><button class="btn green" onclick="enablePushNotifications()">Увімкнути push</button><button class="btn" onclick="location.reload()">Оновити</button></div>${nav()}<div id="screen" class="card">Завантаження...</div></div>`; const map={dashboard:screenDashboard,days:screenDays,payslip:screenPayslip,profile:screenProfile,leader:screenLeader,employees:screenEmployees,reports:screenReports,missing:screenMissingReports,backup:screenBackup,adjustments:screenAdjustments,locks:screenLocks,audit:screenAudit}; (map[tab]||screenDashboard)()}
async function logAction(action,details){try{await sb.from('audit_log').insert({user_id:profile.id,action,details})}catch(e){}}
async function monthWorkRows(userId,month){const from=month, to=monthEnd(month); let q=sb.from('work_days').select('*').gte('work_date',from).lte('work_date',to); if(userId)q=q.eq('user_id',userId); const {data,error}=await q; if(error)throw error; return data||[]}
async function ratesForUsers(userIds){if(!userIds.length)return []; const {data}=await sb.from('salary_rates_history').select('*').in('user_id',userIds).order('effective_from',{ascending:true}); return data||[]}
function sortedRatesForUser(user,hist){return (hist||[]).filter(r=>r.user_id===user.id).sort((a,b)=>String(a.effective_from).localeCompare(String(b.effective_from)))}
function rateForDate(user,rowDate,hist){
  const rates=sortedRatesForUser(user,hist).filter(r=>r.effective_from<=rowDate);
  const r=rates[rates.length-1];
  return {
    daily_rate:Number(r?.daily_rate??user.daily_rate??2500),
    employee_deduction:Number(r?.employee_deduction??user.employee_deduction??48000)
  };
}
function daysBetweenInclusive(a,b){const d1=new Date(a+'T00:00:00'); const d2=new Date(b+'T00:00:00'); return Math.max(0,Math.round((d2-d1)/86400000)+1)}
function addDaysStr(dateStr,n){const d=parseYmdLocal(dateStr); d.setDate(d.getDate()+n); return localDateStr(d)}
function deductionForMonth(user,month,hist){
  if(user.employment_type!=='employee') return 0;
  // Утримання — це місячна фіксована сума, а не денна ставка.
  // Тому не ділимо її пропорційно по днях місяця.
  // Для вибраного місяця беремо останнє значення, яке діяло на кінець цього місяця.
  return rateForDate(user, monthEnd(month), hist).employee_deduction;
}
async function calculateMonth(userId,month){let users=[]; if(userId){const {data}=await sb.from('users').select('*').eq('id',userId).maybeSingle(); if(data)users=[data]}else{const {data}=await sb.from('users').select('*').order('full_name'); users=data||[]} const rows=await monthWorkRows(userId,month); const hist=await ratesForUsers(users.map(u=>u.id)); const {data:adj}=await sb.from('adjustments').select('*').eq('adjustment_month',month); return users.map(u=>{const w=rows.filter(r=>r.user_id===u.id); let base=0,fuel=0,am=0,acc=0; w.forEach(r=>{base+=rateForDate(u,r.work_date,hist).daily_rate; fuel+=Number(r.fuel||0); am+=Number(r.amortization||0); acc+=Number(r.accommodation||0)}); const adjustments=(adj||[]).filter(a=>a.user_id===u.id).reduce((s,a)=>s+(a.type==='bonus'?Number(a.amount||0):-Number(a.amount||0)),0); const ded=(u.employment_type==='employee')?deductionForMonth(u,month,hist):0; return {...u, salary_month:month, work_days_count:w.length, base_salary:base, fuel_total:fuel, amortization_total:am, accommodation_total:acc, adjustments_total:adjustments, employee_deduction:ded, total_to_pay:base+fuel+am+acc+adjustments-ded}})}
async function screenDashboard(){const month=ym(); const rows=await calculateMonth(profile.role==='admin'?null:profile.id,month); const work=profile.role==='admin'?await monthWorkRows(null,month):await monthWorkRows(profile.id,month); const total=rows.reduce((s,r)=>s+r.total_to_pay,0); document.getElementById('screen').innerHTML=`<h2>Головна</h2><div class="grid"><div class="card stat"><span class="muted">Місяць</span><br><b>${month.slice(0,7)}</b></div><div class="card stat"><span class="muted">Записів/днів</span><br><b>${work.length}</b></div><div class="card stat"><span class="muted">До виплати</span><br><b>${fmt(total)}</b></div><div class="card stat"><span class="muted">Роль</span><br><b>${roleName(profile.role)}</b></div></div>`}
function receiptLinks(r){
  const fields=[['fuel_receipt_url','Пальне'],['accommodation_receipt_url','Проживання'],['other_receipt_url','Інше']];
  const links=[];
  fields.forEach(([k,label])=>safeReceiptUrls(r[k]).forEach((url,idx)=>links.push(`<a class="receipt-link" target="_blank" href="${esc(url)}">${label}${idx?` ${idx+1}`:''}</a>`)));
  return links.join('')||'<span class="muted">—</span>';
}
async function screenDays(){document.getElementById('screen').innerHTML=`<h2>Робочі дні</h2><div class="row"><div class="col-3"><label>Дата з</label><input id="wd_from" type="date" value="${localDateStr()}"></div><div class="col-3"><label>Дата по</label><input id="wd_to" type="date" value="${localDateStr()}"></div><div class="col-6"><label>Напрямки</label><div class="checkrow">${directions.map(d=>`<label><input type="checkbox" name="dir" value="${d}"> ${d}</label>`).join('')}</div></div><div class="col-4"><label>Пальне</label><input id="fuel" type="number" value="0"><div class="muted">Для періоду записується тільки на першу дату</div></div><div class="col-4"><label>Амортизація</label><input id="amort" type="number" value="0"><div class="muted">Для періоду записується тільки на першу дату</div></div><div class="col-4"><label>Проживання</label><input id="acc" type="number" value="0"><div class="muted">Для періоду записується тільки на першу дату</div></div><div class="col-4"><label>Фото чеків пальне</label><input id="fuel_file" type="file" accept="image/*,.pdf" multiple></div><div class="col-4"><label>Фото чеків проживання</label><input id="acc_file" type="file" accept="image/*,.pdf" multiple></div><div class="col-4"><label>Інші чеки</label><input id="other_file" type="file" accept="image/*,.pdf" multiple></div><div class="col-12"><label>Коментар</label><textarea id="comment"></textarea></div><div class="col-12"><button class="btn green" onclick="saveDay()">Зберегти день / період</button></div></div><hr><div id="mydays">Завантаження...</div>`;loadDays()}
async function isMonthLocked(userId,dateStr){const m=dateStr.slice(0,7)+'-01'; const {data}=await sb.from('month_locks').select('id').eq('user_id',userId).or(`lock_month.eq.${m},salary_month.eq.${m}`).maybeSingle(); return !!data}
async function uploadReceipts(fileInput,kind,dateStr){
  const files=[...(fileInput?.files||[])];
  if(!files.length)return [];
  const urls=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    const rawExt=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    const ext=rawExt||'jpg';
    const path=`${profile.id}/${dateStr}/${kind}-${Date.now()}-${i}.${ext}`;
    const {error}=await sb.storage.from('receipts').upload(path,f,{upsert:true});
    if(error){msg('Чек не завантажився: '+error.message); continue;}
    urls.push(sb.storage.from('receipts').getPublicUrl(path).data.publicUrl);
  }
  return urls;
}
async function uploadReceipt(fileInput,kind,dateStr){const arr=await uploadReceipts(fileInput,kind,dateStr); return arr[0]||null}
function dateRangeList(from,to){
  const out=[];
  let d=parseYmdLocal(from);
  const end=parseYmdLocal(to);
  if(isNaN(d)||isNaN(end)||d>end) return out;
  while(d<=end){out.push(localDateStr(d)); d.setDate(d.getDate()+1)}
  return out;
}
async function saveDay(){
  const from=(document.getElementById('wd_from')?.value)||localDateStr();
  const to=(document.getElementById('wd_to')?.value)||from;
  const dates=dateRangeList(from,to);
  if(!dates.length)return msg('Невірний період дат');
  const ds=[...document.querySelectorAll('input[name=dir]:checked')].map(x=>x.value);
  if(!ds.length)return msg('Оберіть напрямок');
  for(const dt of dates){ if(await isMonthLocked(profile.id,dt)) return msg('У періоді є закритий місяць: '+dt.slice(0,7)); }
  const first=dates[0];
  const fu=await uploadReceipts(fuel_file,'fuel',first);
  const au=await uploadReceipts(acc_file,'accommodation',first);
  const ou=await uploadReceipts(other_file,'other',first);
  let saved=[];
  for(let i=0;i<dates.length;i++){
    const date=dates[i];
    const oldRes=await sb.from('work_days').select('*').eq('user_id',profile.id).eq('work_date',date).maybeSingle();
    const isFirst=i===0;
    const rec={
      user_id:profile.id,
      work_date:date,
      directions:ds,
      direction:ds[0],
      fuel:isFirst?(+fuel.value||0):0,
      amortization:isFirst?(+amort.value||0):0,
      accommodation:isFirst?(+acc.value||0):0,
      comment:comment.value||'',
      fuel_receipt_url:isFirst?(fu.length?storeReceiptUrls(fu):oldRes.data?.fuel_receipt_url||null):null,
      accommodation_receipt_url:isFirst?(au.length?storeReceiptUrls(au):oldRes.data?.accommodation_receipt_url||null):null,
      other_receipt_url:isFirst?(ou.length?storeReceiptUrls(ou):oldRes.data?.other_receipt_url||null):null
    };
    const {data,error}=await sb.from('work_days').upsert(rec,{onConflict:'user_id,work_date'}).select().single();
    if(error)return msg(error.message);
    await logAction(oldRes.data?'updated':'created',oldRes.data?{old:oldRes.data,new:data}:data);
    saved.push(date);
  }
  msg(dates.length>1?`Збережено ${dates.length} днів. Витрати/чеки прикріплено до ${first}`:'Збережено');
  screenDays();
}
async function loadDays(){const {data,error}=await sb.from('work_days').select('*').eq('user_id',profile.id).order('work_date',{ascending:false}).limit(80); if(error)return mydays.innerHTML=error.message; mydays.innerHTML=tableDays(data||[],false)}
function tableDays(rows,showUser,adminActions=false){

  return `<div class="scroll"><table><thead><tr>${showUser?'<th>Працівник</th>':''}<th>Дата</th><th>Напрямки</th><th>Витрати</th><th>Чеки</th><th>Подано</th>${adminActions?'<th>Дії</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${showUser?`<td>${esc(r.users?.full_name||r.full_name||'')} ${r.users?.callsign?'('+esc(r.users.callsign)+')':''}</td>`:''}<td>${r.work_date}</td><td>${(r.directions||[r.direction]).filter(Boolean).map(d=>`<span class="pill bluep">${esc(d)}</span>`).join(' ')}</td><td>${fmt((+r.fuel||0)+(+r.amortization||0)+(+r.accommodation||0))}</td><td>${receiptLinks(r)}</td><td>${(r.submitted_at||r.created_at)?new Date(r.submitted_at||r.created_at).toLocaleString('uk-UA'):''}</td>${adminActions?`<td><button class="btn small" onclick="adminEditWorkDay('${r.id}')">Редагувати</button> <button class="btn small red" onclick="adminDeleteWorkDay('${r.id}')">Видалити</button></td>`:''}</tr>`).join('')}</tbody></table></div>`

function downloadPayslipPdf(r,m){
  const w=window.open('', '_blank');

  w.document.open(); w.document.write(payslipHtml(r,m)); w.document.close();
}

async function saveEmployee(id){
  const {data:oldUser,error:oldErr}=await sb.from('users').select('*').eq('id',id).maybeSingle();
  if(oldErr)return msg(oldErr.message);
  const newRate=+document.getElementById('rate_'+id).value||2500;
  const newDed=+document.getElementById('ded_'+id).value||48000;
  const eff=document.getElementById('eff_'+id).value;
  const oldRate=Number(oldUser?.daily_rate??2500);
  const oldDed=Number(oldUser?.employee_deduction??48000);
  const rateChanged=(oldRate!==newRate)||(oldDed!==newDed);
  if(rateChanged && !eff)return msg('Оберіть дату “Діє з” для нової ставки/утримання');
  const upd={
    full_name:document.getElementById('fn_'+id).value,
    callsign:document.getElementById('call_'+id).value,
    phone:document.getElementById('ph_'+id).value,
    birth_date:document.getElementById('bd_'+id).value||null,
    role:document.getElementById('role_'+id).value,
    employment_type:document.getElementById('emp_'+id).value,
    status:document.getElementById('st_'+id).value,
    employee_status:document.getElementById('st_'+id).value,
    leader_direction:document.getElementById('ld_'+id).value||null,
    user_directions:checkedValues('dirs_'+id),
    daily_rate:newRate,
    employee_deduction:newDed
  };
  let hErr=null;
  if(rateChanged){
    const {data:existingHist}=await sb.from('salary_rates_history').select('*').eq('user_id',id).order('effective_from',{ascending:true});
    const hasBefore=(existingHist||[]).some(r=>r.effective_from<eff);
    if(!hasBefore){
      const baseDate='2000-01-01';
      const {error:baseErr}=await sb.from('salary_rates_history').upsert({
        user_id:id,
        effective_from:baseDate,
        daily_rate:oldRate,
        employee_deduction:oldDed,
        created_by:profile.id
      },{onConflict:'user_id,effective_from'});
      if(baseErr)hErr=baseErr;
    }
    if(!hErr){
      const {error:rateErr}=await sb.from('salary_rates_history').upsert({
        user_id:id,
        effective_from:eff,
        daily_rate:newRate,
        employee_deduction:newDed,
        created_by:profile.id
      },{onConflict:'user_id,effective_from'});
      hErr=rateErr;
    }
  }
  const {error}=await sb.from('users').update(upd).eq('id',id);
  if(error)return msg(error.message);
  if(hErr)msg('Працівника оновлено, але історія ставки не записалась: '+hErr.message); else msg(rateChanged?'Працівника оновлено. Нові ставка/утримання діють з '+eff:'Працівника оновлено');
  await logAction('employee_updated',{user_id:id,effective_from:rateChanged?eff:null,old_rate:oldRate,new_rate:newRate,old_deduction:oldDed,new_deduction:newDed});
  loadEmployees();
}

async function resetEmployeePassword(id){
  const pass=prompt('Введіть новий пароль для працівника');
  if(!pass)return;
  if(pass.length<6)return msg('Пароль має бути мінімум 6 символів');
  try{
    const resp=await fetch('/api/reset-password',{method:'POST',headers:await authHeaders(),body:JSON.stringify({user_id:id,password:pass})});
    const j=await resp.json().catch(()=>({}));
    if(!resp.ok)return msg(j.error||'Не вдалося скинути пароль');
    await logAction('employee_password_reset',{user_id:id});
    msg('Пароль скинуто');
  }catch(e){msg('Помилка: '+(e.message||e));}
}
async function deleteEmployeeFull(id){
  if(id===profile.id)return msg('Не можна видалити власний профіль');
  if(!confirm('Повністю видалити працівника з бази? Будуть видалені його звіти, коригування, підписки та профіль.'))return;
  const txt=prompt('Для підтвердження напишіть DELETE');
  if(txt!=='DELETE')return msg('Видалення скасовано');
  try{
    const resp=await fetch('/api/delete-employee',{method:'POST',headers:await authHeaders(),body:JSON.stringify({user_id:id})});
    const j=await resp.json().catch(()=>({}));
    if(!resp.ok)return msg(j.error||'Не вдалося видалити працівника');
    await logAction('employee_deleted',{user_id:id});
    msg('Працівника видалено');
    loadEmployees();
  }catch(e){msg('Помилка: '+(e.message||e));}
}

async function adminDeleteWorkDay(id){
  if(!confirm('Видалити цей робочий день?'))return;
  const {data:old}=await sb.from('work_days').select('*').eq('id',id).maybeSingle();
  const {error}=await sb.from('work_days').delete().eq('id',id);
  if(error)return msg(error.message);
  await logAction('work_day_deleted',old||{id});
  msg('Робочий день видалено');
  screenReports();
}
async function adminEditWorkDay(id){
  const {data:r,error}=await sb.from('work_days').select('*').eq('id',id).maybeSingle();
  if(error||!r)return msg(error?.message||'Запис не знайдено');
  const dirs=prompt('Напрямки через кому', (r.directions||[r.direction]).filter(Boolean).join(', '));
  if(dirs===null)return;
  const fuelNew=prompt('Пальне', r.fuel||0); if(fuelNew===null)return;
  const amortNew=prompt('Амортизація', r.amortization||0); if(amortNew===null)return;
  const accNew=prompt('Проживання', r.accommodation||0); if(accNew===null)return;
  const commentNew=prompt('Коментар', r.comment||''); if(commentNew===null)return;
  const arr=dirs.split(',').map(x=>x.trim()).filter(Boolean);
  if(!arr.length)return msg('Оберіть хоча б один напрямок');
  const upd={directions:arr,direction:arr[0],fuel:+fuelNew||0,amortization:+amortNew||0,accommodation:+accNew||0,comment:commentNew};
  const {data:newRow,error:upErr}=await sb.from('work_days').update(upd).eq('id',id).select().single();
  if(upErr)return msg(upErr.message);
  await logAction('work_day_admin_updated',{old:r,new:newRow});
  msg('Робочий день оновлено');
  screenReports();
}

function monthRangeFromInput(id){return (document.getElementById(id)?.value||ym().slice(0,7))+'-01'}

async function screenMissingReports(){
  const m=window.missingMonth||ym();
  document.getElementById('screen').innerHTML=`<h2>Невнесені звіти</h2>
    <div class="row">
      <div class="col-3"><label>Місяць</label><input id="missing_month" type="month" value="${m.slice(0,7)}" onchange="window.missingMonth=this.value+'-01';screenMissingReports()"></div>
      <div class="col-3"><label>Поріг давності, днів</label><input id="missing_days" type="number" value="${window.missingDays||7}" onchange="window.missingDays=+this.value||7;screenMissingReports()"></div>
      <div class="col-3"><label>Показ</label><select id="missing_filter" onchange="window.missingFilter=this.value;screenMissingReports()"><option value="problem" ${(window.missingFilter||'problem')==='problem'?'selected':''}>Тільки проблемні</option><option value="all" ${window.missingFilter==='all'?'selected':''}>Усі активні</option></select></div>
      <div class="col-3"><label>&nbsp;</label><button class="btn blue" onclick="testPush()">Нагадати push</button></div>
    </div><hr><div id="missing_area">Завантаження...</div>`;
  await loadMissingReports();
}
async function loadMissingReports(){
  const m=window.missingMonth||ym();
  const threshold=Number(window.missingDays||document.getElementById('missing_days')?.value||7);
  const filter=window.missingFilter||'problem';
  const from=m, to=monthEnd(m);
  const {data:users,error:uErr}=await sb.from('users').select('id,full_name,callsign,status,employee_status,role,leader_direction').order('full_name');
  if(uErr)return missing_area.innerHTML=uErr.message;
  const active=(users||[]).filter(u=>(u.status||u.employee_status)!=='dismissed');
  const {data:days,error:dErr}=await sb.from('work_days').select('user_id,work_date,submitted_at,directions,direction').gte('work_date',from).lte('work_date',to);
  if(dErr)return missing_area.innerHTML=dErr.message;
  const byUser={};
  (days||[]).forEach(r=>{(byUser[r.user_id] ||= []).push(r)});
  const today=new Date();
  const rows=active.map(u=>{
    const arr=(byUser[u.id]||[]).sort((a,b)=>String(b.work_date).localeCompare(String(a.work_date)));
    const last=arr[0];
    const lastDate=last?.work_date||'';
    const diff=lastDate?Math.floor((today-new Date(lastDate+'T00:00:00'))/86400000):9999;
    const problem=arr.length===0 || diff>=threshold;
    return {u,arr,lastDate,diff,problem};
  }).filter(x=>filter==='all'||x.problem);
  if(!rows.length)return missing_area.innerHTML='<p class="ok">Проблемних працівників за вибраними умовами немає.</p>';
  missing_area.innerHTML=`<div class="scroll"><table><thead><tr><th>Працівник</th><th>Записів за місяць</th><th>Останній робочий день</th><th>Днів від останнього</th><th>Статус</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.u.full_name||'')} ${x.u.callsign?'('+esc(x.u.callsign)+')':''}</td><td>${x.arr.length}</td><td>${x.lastDate||'—'}</td><td>${x.lastDate?x.diff:'—'}</td><td>${x.arr.length===0?'<span class="pill red">Не подавав</span>':(x.problem?'<span class="pill yellow">Давно не подавав</span>':'<span class="pill green">ОК</span>')}</td></tr>`).join('')}</tbody></table></div>`;
}

async function screenBackup(){
  const m=window.backupMonth||ym();
  document.getElementById('screen').innerHTML=`<h2>Архів / резервний експорт</h2>
    <div class="row"><div class="col-3"><label>Місяць</label><input id="backup_month" type="month" value="${m.slice(0,7)}" onchange="window.backupMonth=this.value+'-01';screenBackup()"></div>
    <div class="col-9"><label>&nbsp;</label><button class="btn green" onclick="exportMonthBackup()">Завантажити JSON-архів місяця</button> <button class="btn" onclick="exportSalaryExcel()">Експорт зарплати CSV</button></div></div>
    <p class="muted">Архів містить працівників, робочі дні з чеками, коригування, закриття місяця та розрахунок зарплати за вибраний місяць.</p>
    <div id="backup_info"></div>`;
}
async function exportMonthBackup(){
  const m=window.backupMonth||monthRangeFromInput('backup_month');
  const from=m, to=monthEnd(m);
  try{
    const [usersRes, workRes, adjRes, locksRes, ratesRes]=await Promise.all([
      sb.from('users').select('*').order('full_name'),
      sb.from('work_days').select('*').gte('work_date',from).lte('work_date',to).order('work_date',{ascending:true}),
      sb.from('adjustments').select('*').eq('adjustment_month',m),
      sb.from('month_locks').select('*').or(`lock_month.eq.${m},salary_month.eq.${m}`),
      sb.from('salary_rates_history').select('*').lte('effective_from',to).order('effective_from',{ascending:true})
    ]);
    const err=usersRes.error||workRes.error||adjRes.error||locksRes.error||ratesRes.error;
    if(err)return msg(err.message);
    const salary=await calculateMonth(null,m);
    const payload={exported_at:new Date().toISOString(),month:m,users:usersRes.data||[],work_days:workRes.data||[],adjustments:adjRes.data||[],month_locks:locksRes.data||[],salary_rates_history:ratesRes.data||[],salary_summary_calculated:salary};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`zp-vd-backup-${m.slice(0,7)}.json`;
    a.click();
    if(document.getElementById('backup_info')) backup_info.innerHTML=`<p class="ok">Архів сформовано: ${m.slice(0,7)}</p>`;
  }catch(e){msg('Помилка архіву: '+(e.message||e));}
}

function adjustmentMonth(){return (document.getElementById('adj_month')?.value||ym().slice(0,7))+'-01'}
async function screenAdjustments(){const {data:users}=await sb.from('users').select('id,full_name,callsign').order('full_name'); document.getElementById('screen').innerHTML=`<h2>Коригування</h2><div class="row"><div class="col-3"><label>Місяць</label><input id="adj_month" type="month" value="${ym().slice(0,7)}" onchange="loadAdjustments()"></div><div class="col-3"><label>Працівник</label><select id="adj_user">${(users||[]).map(u=>`<option value="${u.id}">${esc(u.full_name)} ${u.callsign?'('+esc(u.callsign)+')':''}</option>`).join('')}</select></div><div class="col-2"><label>Тип</label><select id="adj_type"><option value="bonus">Премія</option><option value="fine">Штраф</option></select></div><div class="col-2"><label>Сума</label><input id="adj_amount" type="number"></div><div class="col-12"><textarea id="adj_comment" placeholder="Коментар"></textarea></div><div class="col-12"><button class="btn green" onclick="addAdjustment()">Додати</button></div></div><hr><div id="adj_list">Завантаження...</div>`;loadAdjustments()}
async function addAdjustment(){const rec={user_id:adj_user.value,adjustment_month:adjustmentMonth(),type:adj_type.value,amount:+adj_amount.value||0,comment:adj_comment.value,title:adj_comment.value,created_by:profile.id}; const {error}=await sb.from('adjustments').insert(rec); if(error)return msg(error.message); await logAction('adjustment_added',rec); loadAdjustments()}
async function deleteAdjustment(id){if(!confirm('Видалити?'))return; const {error}=await sb.from('adjustments').delete().eq('id',id); if(error)return msg(error.message); loadAdjustments()}
async function loadAdjustments(){const adjList=document.getElementById('adj_list'); const {data,error}=await sb.from('adjustments').select('*').eq('adjustment_month',adjustmentMonth()).order('created_at',{ascending:false}); if(error)return adjList.innerHTML=error.message; const ids=[...new Set((data||[]).map(a=>a.user_id).filter(Boolean))]; let users=[]; if(ids.length){users=(await sb.from('users').select('id,full_name,callsign').in('id',ids)).data||[]} const map=Object.fromEntries(users.map(u=>[u.id,u])); if(!data?.length)return adjList.innerHTML='<p class="muted">Коригувань немає</p>'; adjList.innerHTML=`<table><tr><th>Працівник</th><th>Тип</th><th>Сума</th><th>Коментар</th><th></th></tr>${data.map(a=>{const u=map[a.user_id]||{};return `<tr><td>${esc(u.full_name||'')}</td><td>${a.type==='bonus'?'Премія':'Штраф'}</td><td>${fmt(a.amount)}</td><td>${esc(a.comment||a.title||'')}</td><td><button class="btn small red" onclick="deleteAdjustment('${a.id}')">Видалити</button></td></tr>`}).join('')}</table>`}
async function screenLocks(){
  const m=window.lockMonth||ym();
  document.getElementById('screen').innerHTML=`<h2>Закриття місяця</h2><div class="monthLine"><input id="lock_month" type="month" value="${m.slice(0,7)}" onchange="window.lockMonth=this.value+'-01';screenLocks()"> <button class="btn green" onclick="closeMonthAll()">Закрити всім</button> <button class="btn red" onclick="openMonthAll()">Відкрити всім</button></div><div id="locks_area">Завантаження...</div>`;
  loadLocks();
}
async function loadLocks(){
  const month=window.lockMonth||ym();
  const {data:users}=await sb.from('users').select('id,full_name,callsign,status').order('full_name');
  const {data:locks}=await sb.from('month_locks').select('*').or(`lock_month.eq.${month},salary_month.eq.${month}`);
  const set=new Set((locks||[]).map(l=>l.user_id));
  locks_area.innerHTML=`<h3>Працівники</h3><div class="checkrow">${(users||[]).map(u=>`<label><input type="checkbox" name="lock_user" value="${u.id}" ${set.has(u.id)?'checked':''}> ${esc(u.full_name)} ${u.callsign?'('+esc(u.callsign)+')':''} ${set.has(u.id)?'🔒':'🔓'}</label>`).join('')}</div><br><button class="btn" onclick="closeMonthSelected()">Закрити вибраним</button> <button class="btn red" onclick="openMonthSelected()">Відкрити вибраним</button>`
}
async function closeMonthAll(){const month=window.lockMonth||ym(); const {data:users}=await sb.from('users').select('id').eq('status','active'); await upsertLocks((users||[]).map(u=>u.id),month)}
async function closeMonthSelected(){const ids=[...document.querySelectorAll('input[name=lock_user]:checked')].map(x=>x.value); await upsertLocks(ids,window.lockMonth||ym())}
async function openMonthAll(){const month=window.lockMonth||ym(); if(!confirm('Відкрити місяць всім?'))return; const {error}=await sb.from('month_locks').delete().or(`lock_month.eq.${month},salary_month.eq.${month}`); if(error)return msg(error.message); await logAction('month_opened_all',{month}); msg('Місяць відкрито всім'); screenLocks()}
async function openMonthSelected(){const ids=[...document.querySelectorAll('input[name=lock_user]:checked')].map(x=>x.value); const month=window.lockMonth||ym(); if(!ids.length)return msg('Оберіть працівників'); if(!confirm('Відкрити місяць вибраним?'))return; const {error}=await sb.from('month_locks').delete().in('user_id',ids).or(`lock_month.eq.${month},salary_month.eq.${month}`); if(error)return msg(error.message); await logAction('month_opened_selected',{month,ids}); msg('Місяць відкрито вибраним'); screenLocks()}
async function upsertLocks(ids,month){const rows=ids.map(id=>({user_id:id,lock_month:month,salary_month:month,locked_by:profile.id})); const {error}=await sb.from('month_locks').upsert(rows,{onConflict:'lock_month,user_id'}); if(error)return msg(error.message); await logAction('month_locked',{month,ids}); msg('Місяць закрито'); screenLocks()}

function actionName(a){
  const map={
    created:'Створено звіт',updated:'Змінено звіт',work_day_deleted:'Видалено робочий день',work_day_admin_updated:'Адмін змінив робочий день',
    employee_updated:'Змінено працівника',employee_password_reset:'Скинуто пароль працівника',employee_deleted:'Видалено працівника',birthday_push:'День народження',adjustment_added:'Додано коригування',month_locked:'Закрито місяць',month_opened_all:'Відкрито місяць всім',month_opened_selected:'Відкрито місяць вибраним'
  };
  return map[a]||a;
}
function auditDetails(d){if(!d)return ''; if(typeof d==='string')return esc(d); if(d.month&&d.ids)return `Місяць: ${String(d.month).slice(0,7)}\nПрацівників: ${(d.ids||[]).length}`; if(d.old_rate!==undefined||d.new_rate!==undefined)return `Ставка: ${d.old_rate??'—'} грн → ${d.new_rate??'—'} грн\nУтримання: ${d.old_deduction??'—'} грн → ${d.new_deduction??'—'} грн\nДіє з: ${d.effective_from||'—'}`; if(d.old&&d.new){return `Було:\nДата: ${d.old.work_date||''}\nНапрямки: ${(d.old.directions||[]).join(', ')}\nАмортизація: ${d.old.amortization||0} грн\nПроживання: ${d.old.accommodation||0} грн\n\nСтало:\nДата: ${d.new.work_date||''}\nНапрямки: ${(d.new.directions||[]).join(', ')}\nАмортизація: ${d.new.amortization||0} грн\nПроживання: ${d.new.accommodation||0} грн`} if(d.adjustment_month||d.amount!==undefined&&d.type)return `Місяць: ${String(d.adjustment_month||'').slice(0,7)}
Тип: ${d.type==='bonus'?'Премія':'Штраф'}
Сума: ${d.amount||0} грн
Коментар: ${d.comment||d.title||'—'}`; if(d.user_id&&Object.keys(d).length<=1)return `Працівник ID: ${d.user_id}`; if(d.work_date)return `Дата роботи: ${d.work_date}\nНапрямки: ${(d.directions||[d.direction]).filter(Boolean).join(', ')}\nПальне: ${d.fuel||0} грн\nАмортизація: ${d.amortization||0} грн\nПроживання: ${d.accommodation||0} грн`; return esc(JSON.stringify(d,null,2))}
async function screenAudit(){const {data,error}=await sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(200); if(error)return document.getElementById('screen').innerHTML=error.message; const ids=[...new Set((data||[]).map(x=>x.user_id).filter(Boolean))]; let users=[]; if(ids.length)users=(await sb.from('users').select('id,full_name,callsign').in('id',ids)).data||[]; const map=Object.fromEntries(users.map(u=>[u.id,u])); document.getElementById('screen').innerHTML=`<h2>Журнал</h2><div class="scroll"><table><thead><tr><th>Дата</th><th>Користувач</th><th>Дія</th><th>Деталі</th></tr></thead><tbody>${(data||[]).map(r=>{const u=map[r.user_id]||{};return `<tr><td>${new Date(r.created_at).toLocaleString('uk-UA')}</td><td>${esc(u.full_name||'')} ${u.callsign?'('+esc(u.callsign)+')':''}</td><td>${esc(actionName(r.action))}</td><td><pre>${auditDetails(r.details)}</pre></td></tr>`}).join('')}</tbody></table></div>`}
init();
