<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ЗП-VD</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#eef2f7;--card:#fff;--text:#071225;--muted:#64748b;--line:#d8e0eb;--green:#16a34a;--blue:#2563eb;--red:#dc2626;--amber:#d97706;--dark:#0f172a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
    .wrap{max-width:1180px;margin:0 auto;padding:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 50px rgba(15,23,42,.08)}
    .login{max-width:520px;margin:7vh auto}.title{font-size:34px;margin:0 0 14px;font-weight:900}.muted{color:var(--muted);font-size:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
    label{display:block;font-size:14px;margin:10px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15px;background:white;color:var(--text)}textarea{min-height:84px;resize:vertical}
    input:disabled{background:#f3f6fa;color:#64748b}.row{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-6{grid-column:span 6}.col-4{grid-column:span 4}.col-3{grid-column:span 3}.col-2{grid-column:span 2}
    button{border:0;border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--green);color:#fff}button.secondary{background:#e2e8f0;color:#0f172a}button.danger{background:var(--red)}button.blue{background:var(--blue)}button.amber{background:var(--amber)}button:disabled{opacity:.6;cursor:not-allowed}
    .nav{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}.nav button{background:#e8edf5;color:#0f172a}.nav button.active{background:var(--dark);color:white}
    .grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:16px;border:1px solid var(--line);border-radius:18px;background:#f8fafc}.stat b{font-size:22px}
    .checkrow{display:flex;flex-wrap:wrap;gap:10px}.checkrow label{border:1px solid var(--line);border-radius:999px;padding:9px 12px;margin:0;background:#f8fafc}.checkrow input{width:auto;margin-right:6px}
    table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{font-size:13px;color:#475569;background:#f8fafc}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;margin:2px;background:#dbeafe;color:#1d4ed8}.pill.green{background:#dcfce7;color:#166534}.pill.red{background:#fee2e2;color:#991b1b}.pill.amber{background:#fef3c7;color:#92400e}
    .notice{position:fixed;right:18px;bottom:18px;background:#0f172a;color:white;padding:13px 16px;border-radius:14px;box-shadow:0 15px 40px rgba(0,0,0,.25);z-index:10;max-width:420px}.notice.ok{background:#166534}.notice.err{background:#991b1b}
    hr{border:0;border-top:1px solid var(--line);margin:20px 0}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}
    @media(max-width:860px){.wrap{padding:12px}.row,.grid-cards{grid-template-columns:1fr}.col-12,.col-8,.col-6,.col-4,.col-3,.col-2{grid-column:span 1}.top{align-items:flex-start;flex-direction:column}.card{padding:16px;border-radius:18px}table{font-size:13px}th,td{padding:8px}.title{font-size:30px}}
  </style>
</head>
<body><div id="app"></div>
<script>
const SUPABASE_URL = 'https://gahbfqpkgnbezkfqkziy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_xRk6B66TkytVRztLnOq6cQ_Zzn4awMW';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const directions = ['Софт','FPV','Класика','БЗВП','Online'];
let me=null, profile=null, tab='dashboard';
const app=document.getElementById('app');
const fmt=n=>Number(n||0).toLocaleString('uk-UA')+' грн';
const ym=(d=new Date())=>new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);
function msg(t,type='ok'){let el=document.createElement('div');el.className='notice '+(type==='err'?'err':'ok');el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),4200)}
function roleName(r){return r==='admin'?'Адмін':r==='leader'?'Старший групи':'Працівник'}
function empName(t){return t==='employee'?'Працевлаштований':'Фрілансер'}
function statusName(s){return s==='dismissed'?'Звільнений':'Активний'}
async function init(){const {data:{session}}=await sb.auth.getSession(); if(!session){renderLogin();return} me=session.user; await loadProfile(); if(!profile){renderNoProfile();return} renderApp()}
function renderLogin(){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">ЗП-VD</h1><p class="muted">Вхід через email та пароль. Пристрій запам’ятовується автоматично.</p><label>Email</label><input id="email" type="email" placeholder="name@example.com"><label>Пароль</label><input id="password" type="password" placeholder="Пароль"><div style="height:14px"></div><button onclick="login()">Увійти</button></div></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value}); if(error)return msg(error.message,'err'); init()}
async function logout(){await sb.auth.signOut(); me=null; profile=null; tab='dashboard'; renderLogin()}
async function loadProfile(){let {data,error}=await sb.from('users').select('*').or(`auth_id.eq.${me.id},auth_user_id.eq.${me.id}`).maybeSingle(); if(error){msg(error.message,'err'); profile=null; return} profile=data}
function renderNoProfile(){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">Профіль не знайдено</h1><p>Ваш email авторизований, але профіль працівника ще не прив’язаний у таблиці <b>users</b>.</p><p class="muted">ID користувача Auth:</p><input readonly value="${me.id}"><p class="muted">Email:</p><input readonly value="${me.email||''}"><button onclick="logout()" class="secondary">Вийти</button></div></div>`}
function nav(){const items=[['dashboard','Головна'],['days','Робочі дні'],['profile','Мій профіль']]; if(profile.role==='admin')items.push(['employees','Працівники'],['reports','Звіти'],['locks','Закриття місяця']); if(profile.role==='leader')items.push(['leader','Мій напрямок']); return `<div class="nav">${items.map(i=>`<button class="${tab===i[0]?'active':''}" onclick="tab='${i[0]}';renderApp()">${i[1]}</button>`).join('')}<button onclick="logout()" class="secondary">Вийти</button></div>`}
async function renderApp(){app.innerHTML=`<div class="wrap"><div class="top"><div><h1 class="title">ЗП-VD</h1><div class="muted">${profile.full_name||''} ${profile.callsign?'('+profile.callsign+')':''} · ${roleName(profile.role)}</div></div></div>${nav()}<div id="screen" class="card">Завантаження...</div></div>`; if(tab==='dashboard')screenDashboard(); if(tab==='days')screenDays(); if(tab==='profile')screenProfile(); if(tab==='employees')screenEmployees(); if(tab==='reports')screenReports(); if(tab==='locks')screenLocks(); if(tab==='leader')screenLeader()}
async function screenDashboard(){const m=ym();let q=sb.from('salary_summary').select('*').eq('salary_month',m); if(profile.role!=='admin')q=q.eq('user_id',profile.id); const {data,error}=await q; if(error)return document.getElementById('screen').innerHTML=error.message; const rows=data||[]; const total=rows.reduce((s,r)=>s+Number(r.total_to_pay||0),0); const days=rows.reduce((s,r)=>s+Number(r.work_days_count||0),0); document.getElementById('screen').innerHTML=`<h2>Головна</h2><div class="grid-cards"><div class="stat"><span class="muted">Місяць</span><br><b>${m.slice(0,7)}</b></div><div class="stat"><span class="muted">Робочих днів</span><br><b>${days}</b></div><div class="stat"><span class="muted">До виплати</span><br><b>${fmt(total)}</b></div><div class="stat"><span class="muted">Роль</span><br><b>${roleName(profile.role)}</b></div></div>`}
async function screenDays(){document.getElementById('screen').innerHTML=`<h2>Робочі дні</h2><div class="row"><div class="col-4"><label>Дата</label><input id="wd_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="col-8"><label>Напрямки</label><div class="checkrow">${directions.map(d=>`<label><input type="checkbox" name="dir" value="${d}"> ${d}</label>`).join('')}</div></div><div class="col-4"><label>Пальне</label><input id="fuel" type="number" value="0"></div><div class="col-4"><label>Амортизація</label><input id="amort" type="number" value="0"></div><div class="col-4"><label>Проживання</label><input id="acc" type="number" value="0"></div><div class="col-12"><label>Коментар</label><textarea id="comment"></textarea></div><div class="col-12"><button onclick="saveDay()">Зберегти день</button></div></div><hr><div id="mydays">Завантаження...</div>`;loadDays()}
async function saveDay(){const locked = await isMonthLocked(profile.id, wd_date.value); if(locked)return msg('Цей місяць закрито. Редагування недоступне.','err'); const ds=[...document.querySelectorAll('input[name=dir]:checked')].map(x=>x.value); if(!ds.length)return msg('Оберіть хоча б один напрямок','err'); const rec={user_id:profile.id,work_date:wd_date.value,directions:ds,direction:ds[0],fuel:+fuel.value||0,amortization:+amort.value||0,accommodation:+acc.value||0,comment:comment.value||'',updated_at:new Date().toISOString(),submitted_at:new Date().toISOString()}; const {error}=await sb.from('work_days').upsert(rec,{onConflict:'user_id,work_date'}); if(error)return msg(error.message,'err'); msg('Збережено'); screenDays()}
async function loadDays(){const {data,error}=await sb.from('work_days').select('*').eq('user_id',profile.id).order('work_date',{ascending:false}).limit(80); if(error)return mydays.innerHTML=error.message; mydays.innerHTML=tableDays(data||[],false)}
function tableDays(rows,showUser){if(!rows.length)return '<p class="muted">Записів немає</p>'; return `<table><thead><tr>${showUser?'<th>Працівник</th>':''}<th>Дата</th><th>Напрямки</th><th>Витрати</th><th>Подано</th><th>Змінено</th></tr></thead><tbody>${rows.map(r=>`<tr>${showUser?`<td>${r.users?.full_name||''}<br><span class="muted">${r.users?.callsign||''}</span></td>`:''}<td>${r.work_date}</td><td>${(r.directions&&r.directions.length?r.directions:[r.direction]).filter(Boolean).map(d=>`<span class="pill">${d}</span>`).join('')}</td><td>${fmt((+r.fuel||0)+(+r.amortization||0)+(+r.accommodation||0))}</td><td>${r.created_at?new Date(r.created_at).toLocaleString('uk-UA'):''}</td><td>${r.updated_at?new Date(r.updated_at).toLocaleString('uk-UA'):''}</td></tr>`).join('')}</tbody></table>`}
function screenProfile(){document.getElementById('screen').innerHTML=`<h2>Мій профіль</h2><div class="row"><div class="col-6"><label>ПІБ</label><input value="${profile.full_name||''}" disabled></div><div class="col-6"><label>Позивний</label><input value="${profile.callsign||''}" disabled></div><div class="col-4"><label>Телефон</label><input id="p_phone" value="${profile.phone||''}"></div><div class="col-4"><label>Email</label><input id="p_email" type="email" value="${profile.email||me.email||''}"></div><div class="col-4"><label>Дата народження</label><input id="p_birth" type="date" value="${profile.birth_date||''}"></div><div class="col-4"><label>Статус</label><input value="${empName(profile.employment_type)}" disabled></div><div class="col-4"><label>Роль</label><input value="${roleName(profile.role)}" disabled></div><div class="col-4"><label>Стан</label><input value="${statusName(profile.status)}" disabled></div><div class="col-12"><button onclick="saveProfile()">Зберегти профіль</button></div></div><hr><h3>Зміна пароля</h3><div class="row"><div class="col-6"><label>Новий пароль</label><input id="new_pass" type="password"></div><div class="col-6"><label>Повторіть пароль</label><input id="new_pass2" type="password"></div><div class="col-12"><button onclick="changePassword()">Змінити пароль</button></div></div>`}
async function saveProfile(){const updates={phone:p_phone.value||null,email:p_email.value||null,birth_date:p_birth.value||null}; const {error}=await sb.from('users').update(updates).eq('id',profile.id); if(error)return msg(error.message,'err'); if(updates.email && updates.email!==me.email){await sb.auth.updateUser({email:updates.email}).catch(()=>{})} Object.assign(profile,updates); msg('Профіль оновлено'); screenProfile()}
async function changePassword(){if(!new_pass.value||!new_pass2.value)return msg('Введіть новий пароль двічі','err'); if(new_pass.value!==new_pass2.value)return msg('Паролі не співпадають','err'); if(new_pass.value.length<6)return msg('Пароль має бути мінімум 6 символів','err'); const {error}=await sb.auth.updateUser({password:new_pass.value}); if(error)return msg(error.message,'err'); msg('Пароль змінено'); new_pass.value=''; new_pass2.value=''}
async function screenEmployees(){document.getElementById('screen').innerHTML=`<h2>Працівники</h2><div class="row"><div class="col-3"><label>ПІБ</label><input id="e_full"></div><div class="col-3"><label>Позивний</label><input id="e_call"></div><div class="col-3"><label>Email</label><input id="e_email" type="email"></div><div class="col-3"><label>Пароль для входу</label><input id="e_password" type="text" placeholder="Напр. vd2026"></div><div class="col-3"><label>Телефон</label><input id="e_phone"></div><div class="col-3"><label>Дата народження</label><input id="e_birth" type="date"></div><div class="col-3"><label>Статус</label><select id="e_emp"><option value="employee">Працевлаштований</option><option value="freelancer">Фрілансер</option></select></div><div class="col-3"><label>Стан</label><select id="e_status"><option value="active">Активний</option><option value="dismissed">Звільнений</option></select></div><div class="col-3"><label>Роль</label><select id="e_role"><option value="user">Працівник</option><option value="leader">Старший групи</option><option value="admin">Адмін</option></select></div><div class="col-3"><label>Напрямок старшого</label><select id="e_leader"><option value="">—</option>${directions.map(d=>`<option>${d}</option>`).join('')}</select></div><div class="col-3"><label>Ставка за день</label><input id="e_rate" type="number" value="2500"></div><div class="col-3"><label>Утримання</label><input id="e_deduct" type="number" value="48000"></div><div class="col-12"><button onclick="addEmployee()">Додати працівника</button></div></div><hr><div id="emps">Завантаження...</div>`;loadEmployees()}
async function addEmployee(){const rec={full_name:e_full.value.trim(),callsign:e_call.value.trim(),email:e_email.value.trim(),password:e_password.value.trim(),phone:e_phone.value||null,birth_date:e_birth.value||null,employment_type:e_emp.value,status:e_status.value,role:e_role.value,leader_direction:e_leader.value||null}; if(!rec.full_name||!rec.email||!rec.password)return msg('Заповніть ПІБ, email і пароль','err'); const resp=await fetch('/api/create-employee',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)}); const data=await resp.json().catch(()=>({error:'Невідома помилка'})); if(!resp.ok)return msg(data.error||'Помилка створення','err'); const id=data.profile?.id; if(id){await sb.from('users').update({daily_rate:+e_rate.value||2500,employee_deduction:+e_deduct.value||48000}).eq('id',id)} msg('Працівника створено автоматично: Auth + профіль users'); screenEmployees()}
async function loadEmployees(){const {data,error}=await sb.from('users').select('*').order('full_name'); if(error)return emps.innerHTML=error.message; emps.innerHTML=`<table><thead><tr><th>ПІБ</th><th>Email</th><th>Роль</th><th>Стан</th><th>Ставка</th><th>Утримання</th><th>Дії</th></tr></thead><tbody>${(data||[]).map(u=>`<tr><td>${u.full_name}<br><span class="muted">${u.callsign||''}</span></td><td>${u.email||''}</td><td>${roleName(u.role)}</td><td>${statusName(u.status)}</td><td><input id="rate_${u.id}" type="number" value="${u.daily_rate||2500}"></td><td><input id="ded_${u.id}" type="number" value="${u.employee_deduction||48000}"></td><td><button class="secondary" onclick="saveEmployeePay('${u.id}')">Зберегти</button></td></tr>`).join('')}</tbody></table>`}
async function saveEmployeePay(id){const {error}=await sb.from('users').update({daily_rate:+document.getElementById('rate_'+id).value||2500,employee_deduction:+document.getElementById('ded_'+id).value||0}).eq('id',id); if(error)return msg(error.message,'err'); msg('Ставку збережено')}
async function screenReports(){const {data,error}=await sb.from('salary_summary').select('*').order('salary_month',{ascending:false}); document.getElementById('screen').innerHTML='<h2>Звіти</h2><button onclick="exportSalaryExcel()">Експорт Excel</button><hr>'+(error?error.message:`<table><thead><tr><th>Місяць</th><th>ПІБ</th><th>Днів</th><th>Ставка</th><th>Зарплата</th><th>Витрати</th><th>Утримання</th><th>До виплати</th></tr></thead><tbody>${(data||[]).map(r=>`<tr><td>${r.salary_month}</td><td>${r.full_name}<br><span class="muted">${r.callsign||''}</span></td><td>${r.work_days_count}</td><td>${fmt(r.daily_rate)}</td><td>${fmt(r.base_salary)}</td><td>${fmt((+r.fuel_total||0)+(+r.amortization_total||0)+(+r.accommodation_total||0))}</td><td>${fmt(r.employee_deduction)}</td><td><b>${fmt(r.total_to_pay)}</b></td></tr>`).join('')}</tbody></table>`)}
async function exportSalaryExcel(){const {data,error}=await sb.from('salary_summary').select('*').order('salary_month',{ascending:false}); if(error)return msg(error.message,'err'); if(!data||!data.length)return msg('Немає даних для експорту','err'); const rows=[['Місяць','ПІБ','Позивний','Днів','Ставка/день','Зарплата','Пальне','Амортизація','Проживання','Утримання','Коригування','До виплати'],...data.map(r=>[r.salary_month,r.full_name,r.callsign||'',r.work_days_count||0,r.daily_rate||0,r.base_salary||0,r.fuel_total||0,r.amortization_total||0,r.accommodation_total||0,r.employee_deduction||0,r.adjustments_total||0,r.total_to_pay||0])]; const csv=rows.map(row=>row.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(';')).join('\n'); const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}); const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download='zp-vd-zvit.csv'; link.click()}
async function screenLeader(){const dir=profile.leader_direction; if(!dir)return document.getElementById('screen').innerHTML='<h2>Мій напрямок</h2><p>Вам не призначено напрямок.</p>'; const {data,error}=await sb.from('work_days').select('*, users(full_name,callsign)').contains('directions',[dir]).order('work_date',{ascending:false}).limit(200); document.getElementById('screen').innerHTML=`<h2>Звіти по напрямку: ${dir}</h2>`+(error?error.message:tableDays(data||[],true))}
async function screenLocks(){const def=ym().slice(0,7); document.getElementById('screen').innerHTML=`<h2>Закриття місяця</h2><label>Оберіть місяць</label><input id="lock_month_input" type="month" value="${def}" onchange="screenLocksLoad(this.value)"><div id="locks_area" style="margin-top:16px">Завантаження...</div>`; screenLocksLoad(def)}
async function screenLocksLoad(selectedMonth){const monthValue=selectedMonth||document.getElementById('lock_month_input').value; const month=monthValue+'-01'; const {data:users,error:uErr}=await sb.from('users').select('id,full_name,callsign,status').order('full_name'); if(uErr)return locks_area.innerHTML=uErr.message; const {data:locks,error:lErr}=await sb.from('month_locks').select('*').eq('lock_month',month); if(lErr)return locks_area.innerHTML=lErr.message; const lockedIds=new Set((locks||[]).map(l=>l.user_id)); locks_area.innerHTML=`<div class="actions"><button onclick="closeMonthAll()">Закрити цей місяць всім</button><button class="secondary" onclick="screenLocksLoad(document.getElementById('lock_month_input').value)">Оновити</button></div><hr><h3>Закрити вибраним</h3><div class="checkrow">${(users||[]).map(u=>`<label><input type="checkbox" name="lock_user" value="${u.id}" ${lockedIds.has(u.id)?'checked':''}> ${u.full_name} ${u.callsign?'('+u.callsign+')':''} ${lockedIds.has(u.id)?'🔒':''}</label>`).join('')}</div><div style="height:14px"></div><button onclick="closeMonthSelected()">Закрити вибраним</button><hr><h3>Закриті за місяць</h3>${(locks||[]).length?`<table><thead><tr><th>Працівник</th><th>Дата закриття</th></tr></thead><tbody>${(locks||[]).map(l=>{const u=(users||[]).find(x=>x.id===l.user_id);return `<tr><td>${u?u.full_name:l.user_id}</td><td>${l.locked_at?new Date(l.locked_at).toLocaleString('uk-UA'):''}</td></tr>`}).join('')}</tbody></table>`:'<p class="muted">За цей місяць ще нікого не закрито.</p>'}`}
function selectedLockMonth(){return document.getElementById('lock_month_input').value+'-01'}
async function closeMonthAll(){if(!confirm('Закрити місяць всім активним працівникам?'))return; const month=selectedLockMonth(); const {data:users,error:uErr}=await sb.from('users').select('id').eq('status','active'); if(uErr)return msg(uErr.message,'err'); const rows=(users||[]).map(u=>({salary_month:month,lock_month:month,user_id:u.id,locked_by:profile.id})); const {error}=await sb.from('month_locks').upsert(rows,{onConflict:'lock_month,user_id'}); if(error)return msg(error.message,'err'); msg('Місяць закрито всім активним працівникам'); screenLocksLoad(document.getElementById('lock_month_input').value)}
async function closeMonthSelected(){const ids=[...document.querySelectorAll('input[name=lock_user]:checked')].map(x=>x.value); if(!ids.length)return msg('Оберіть хоча б одного працівника','err'); const month=selectedLockMonth(); const rows=ids.map(id=>({salary_month:month,lock_month:month,user_id:id,locked_by:profile.id})); const {error}=await sb.from('month_locks').upsert(rows,{onConflict:'lock_month,user_id'}); if(error)return msg(error.message,'err'); msg('Місяць закрито вибраним працівникам'); screenLocksLoad(document.getElementById('lock_month_input').value)}
async function isMonthLocked(userId,dateStr){const month=dateStr.slice(0,7)+'-01'; const {data,error}=await sb.from('month_locks').select('id').eq('user_id',userId).eq('lock_month',month).maybeSingle(); if(error){msg(error.message,'err'); return true} return !!data}
init();
