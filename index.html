  <style>
    :root{--bg:#f4f6fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e5e7eb;--green:#16a34a;--blue:#2563eb;--red:#dc2626;--yellow:#f59e0b;--dark:#0f172a;--shadow:0 12px 30px rgba(16,24,40,.08);--radius:18px}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:1220px;margin:0 auto;padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.login{max-width:460px;margin:10vh auto}.title{font-size:30px;font-weight:900;margin:0 0 6px}.muted{color:var(--muted);font-size:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.nav button,.btn{border:0;border-radius:14px;padding:11px 14px;background:#eef2f7;color:#111827;font-weight:800;cursor:pointer}.nav button.active,.btn.primary{background:var(--dark);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.small{padding:7px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.row{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-6{grid-column:span 6}.col-4{grid-column:span 4}.col-3{grid-column:span 3}.col-2{grid-column:span 2}
    label{display:block;font-weight:800;font-size:13px;color:var(--muted);margin-bottom:5px} input,select,textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:10px 12px;font:inherit;background:#fff} textarea{min-height:70px;resize:vertical}.checkrow{display:flex;gap:10px;flex-wrap:wrap}.checkrow label{color:var(--text);font-weight:700;border:1px solid var(--line);border-radius:999px;padding:8px 11px;background:#fff}.stat{padding:16px}.stat b{font-size:24px}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.bluep{background:#dbeafe;color:#1d4ed8}.yellow{background:#fef3c7;color:#92400e}
    table{width:100%;border-collapse:collapse} th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px} th{font-size:12px;color:var(--muted);text-transform:uppercase}.msg{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 15px;border-radius:14px;box-shadow:var(--shadow);z-index:50}.scroll{overflow:auto}.receipt-link{display:inline-block;margin:2px 4px 2px 0}.notice{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;padding:10px;border-radius:14px}.ok{background:#ecfdf3;color:#027a48;border:1px solid #abefc6;padding:10px;border-radius:14px} pre{white-space:pre-wrap;margin:0;font-family:inherit}
    @media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.col-2,.col-3,.col-4,.col-6,.col-8,.col-12{grid-column:span 1}.top{display:block}.wrap{padding:10px}th,td{font-size:12px}.nav button{flex:1 1 auto}}
  </style>

<script>
const SUPABASE_URL='https://gahbfqpkgnbezkfqkziy.supabase.co';
const SUPABASE_KEY='sb_publishable_xRk6B66TkytVRztLnOq6cQ_Zzn4awMW';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const directions=['FPV','Софт','Класика','БЗВП','Online'];
const VAPID_PUBLIC_KEY='BCBoxKoWAEMMCXhEzI0-osh5LUwBcjXghBaBkyPz9SrE_b4OifyY1fH4v7N2LqD95vcy2JX5f6aXSlcxfbioAwM';
let me=null, profile=null, tab='dashboard';
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredInstallPrompt=e;});
async function installApp(){if(deferredInstallPrompt){deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt=null;}else{msg('Для встановлення: Chrome/Android → меню ⋮ → Встановити застосунок. iPhone → Safari → Поділитися → На головний екран.')}}
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4);const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}
async function enablePushNotifications(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return msg('Push-сповіщення не підтримуються цим браузером');
  if(!VAPID_PUBLIC_KEY||VAPID_PUBLIC_KEY.includes('PASTE_'))return msg('Спочатку вставте VAPID_PUBLIC_KEY в index.html і додайте ключі у Vercel');
  const perm=await Notification.requestPermission(); if(perm!=='granted')return msg('Дозвіл на сповіщення не надано');
  const reg=await navigator.serviceWorker.register('/sw.js');
  const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
  const {error}=await sb.from('push_subscriptions').upsert({user_id:profile.id,endpoint:sub.endpoint,subscription:sub.toJSON()},{onConflict:'endpoint'});
  if(error)return msg(error.message);
  msg('Push-сповіщення увімкнено для цього пристрою');
}

const app=document.getElementById('app');
function fmt(n){return (Number(n)||0).toLocaleString('uk-UA')+' грн'}
function ym(d=new Date()){return d.toISOString().slice(0,7)+'-01'}
function monthEnd(m){const d=new Date(m.slice(0,7)+'-01'); d.setMonth(d.getMonth()+1); d.setDate(0); return d.toISOString().slice(0,10)}
function msg(t){const d=document.createElement('div');d.className='msg';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function roleName(r){return r==='admin'?'Адмін':r==='leader'?'Старший напрямку':'Працівник'}
async function init(){if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})} const {data:{session}}=await sb.auth.getSession(); if(!session) return renderLogin(); me=session.user; await loadProfile(); if(!profile) return renderNoProfile(); if(profile.status==='dismissed'||profile.employee_status==='dismissed') return renderBlocked(); renderApp()}
function renderLogin(){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">ЗП-VD</h1><p class="muted">Вхід через email та пароль.</p><label>Email</label><input id="email" type="email"><label>Пароль</label><input id="password" type="password"><br><br><button class="btn primary" onclick="login()">Увійти</button></div></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value}); if(error)return msg(error.message); init()}
async function logout(){await sb.auth.signOut(); location.reload()}
async function loadProfile(){const uid=me.id; let {data}=await sb.from('users').select('*').or(`auth_id.eq.${uid},auth_user_id.eq.${uid},id.eq.${uid},email.eq.${me.email}`).maybeSingle(); profile=data||null}
function renderNoProfile(){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">Профіль не знайдено</h1><p>Користувач авторизований, але не прив’язаний до таблиці users.</p><input readonly value="${me.id}"><br><br><button class="btn" onclick="logout()">Вийти</button></div></div>`}
function renderBlocked(){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">Доступ заблоковано</h1><p>Ваш профіль має статус звільнений/неактивний.</p><button class="btn" onclick="logout()">Вийти</button></div></div>`}
function nav(){let items=[['dashboard','Головна'],['days','Робочі дні'],['payslip','Мій розрахунок'],['profile','Мій профіль']]; if(profile.role==='leader')items.push(['leader','Мій напрямок']); if(profile.role==='admin')items.push(['employees','Працівники'],['reports','Звіти'],['missing','Невнесені звіти'],['backup','Архів/Експорт'],['adjustments','Коригування'],['locks','Закриття місяця'],['audit','Журнал']); return `<div class="nav">${items.map(i=>`<button class="${tab===i[0]?'active':''}" onclick="tab='${i[0]}';renderApp()">${i[1]}</button>`).join('')}<button onclick="logout()">Вийти</button></div>`}
function renderApp(){app.innerHTML=`<div class="wrap"><div class="top"><div><h1 class="title">ЗП-VD</h1><div class="muted">${esc(profile.full_name)} ${profile.callsign?'('+esc(profile.callsign)+')':''} · ${roleName(profile.role)}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn blue" onclick="installApp()">Встановити застосунок</button><button class="btn green" onclick="enablePushNotifications()">Увімкнути push</button><button class="btn" onclick="location.reload()">Оновити</button></div></div>${nav()}<div id="screen" class="card">Завантаження...</div></div>`; const map={dashboard:screenDashboard,days:screenDays,payslip:screenPayslip,profile:screenProfile,leader:screenLeader,employees:screenEmployees,reports:screenReports,missing:screenMissingReports,backup:screenBackup,adjustments:screenAdjustments,locks:screenLocks,audit:screenAudit}; (map[tab]||screenDashboard)()}
async function logAction(action,details){try{await sb.from('audit_log').insert({user_id:profile.id,action,details})}catch(e){}}
async function monthWorkRows(userId,month){const from=month, to=monthEnd(month); let q=sb.from('work_days').select('*').gte('work_date',from).lte('work_date',to); if(userId)q=q.eq('user_id',userId); const {data,error}=await q; if(error)throw error; return data||[]}
async function ratesForUsers(userIds){if(!userIds.length)return []; const {data}=await sb.from('salary_rates_history').select('*').in('user_id',userIds).order('effective_from',{ascending:true}); return data||[]}
function sortedRatesForUser(user,hist){return (hist||[]).filter(r=>r.user_id===user.id).sort((a,b)=>String(a.effective_from).localeCompare(String(b.effective_from)))}
function rateForDate(user,rowDate,hist){
  const rates=sortedRatesForUser(user,hist).filter(r=>r.effective_from<=rowDate);
  const r=rates[rates.length-1];
  return {
    daily_rate:Number(r?.daily_rate??user.daily_rate??2500),
    employee_deduction:Number(r?.employee_deduction??user.employee_deduction??48000)
  };
}
function daysBetweenInclusive(a,b){const d1=new Date(a+'T00:00:00'); const d2=new Date(b+'T00:00:00'); return Math.max(0,Math.round((d2-d1)/86400000)+1)}
function addDaysStr(dateStr,n){const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10)}
function deductionForMonth(user,month,hist){
  if(user.employment_type!=='employee') return 0;
  // Утримання завжди береться повною місячною сумою, яка діє на початок місяця.
  // Якщо зміна задана посеред місяця, вона вплине на наступні дні для ставки,
  // але місячне утримання в розрахунку показується повною сумою, а не пропорційно.
  return Number(rateForDate(user,month,hist).employee_deduction||user.employee_deduction||48000);
}
async function calculateMonth(userId,month){let users=[]; if(userId){const {data}=await sb.from('users').select('*').eq('id',userId).maybeSingle(); if(data)users=[data]}else{const {data}=await sb.from('users').select('*').order('full_name'); users=data||[]} const rows=await monthWorkRows(userId,month); const hist=await ratesForUsers(users.map(u=>u.id)); const {data:adj}=await sb.from('adjustments').select('*').eq('adjustment_month',month); return users.map(u=>{const w=rows.filter(r=>r.user_id===u.id); let base=0,fuel=0,am=0,acc=0; w.forEach(r=>{base+=rateForDate(u,r.work_date,hist).daily_rate; fuel+=Number(r.fuel||0); am+=Number(r.amortization||0); acc+=Number(r.accommodation||0)}); const adjustments=(adj||[]).filter(a=>a.user_id===u.id).reduce((s,a)=>s+(a.type==='bonus'?Number(a.amount||0):-Number(a.amount||0)),0); const ded=(u.employment_type==='employee')?deductionForMonth(u,month,hist):0; return {...u, salary_month:month, work_days_count:w.length, base_salary:base, fuel_total:fuel, amortization_total:am, accommodation_total:acc, adjustments_total:adjustments, employee_deduction:ded, total_to_pay:base+fuel+am+acc+adjustments-ded}})}
async function screenDashboard(){const month=ym(); const rows=await calculateMonth(profile.role==='admin'?null:profile.id,month); const work=profile.role==='admin'?await monthWorkRows(null,month):await monthWorkRows(profile.id,month); const total=rows.reduce((s,r)=>s+r.total_to_pay,0); document.getElementById('screen').innerHTML=`<h2>Головна</h2><div class="grid"><div class="card stat"><span class="muted">Місяць</span><br><b>${month.slice(0,7)}</b></div><div class="card stat"><span class="muted">Записів/днів</span><br><b>${work.length}</b></div><div class="card stat"><span class="muted">До виплати</span><br><b>${fmt(total)}</b></div><div class="card stat"><span class="muted">Роль</span><br><b>${roleName(profile.role)}</b></div></div>`}
function receiptLinks(r){return ['fuel_receipt_url','accommodation_receipt_url','other_receipt_url'].map((k,i)=>r[k]?`<a class="receipt-link" target="_blank" href="${r[k]}">${['Пальне','Проживання','Інше'][i]}</a>`:'').join('')||'<span class="muted">—</span>'}
async function screenDays(){document.getElementById('screen').innerHTML=`<h2>Робочі дні</h2><div class="row"><div class="col-3"><label>Дата з</label><input id="wd_date_from" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="col-3"><label>Дата по</label><input id="wd_date_to" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="col-6"><label>Напрямки</label><div class="checkrow">${directions.map(d=>`<label><input type="checkbox" name="dir" value="${d}"> ${d}</label>`).join('')}</div></div><div class="col-4"><label>Пальне</label><input id="fuel" type="number" value="0"></div><div class="col-4"><label>Амортизація</label><input id="amort" type="number" value="0"></div><div class="col-4"><label>Проживання</label><input id="acc" type="number" value="0"></div><div class="col-4"><label>Фото чека пальне</label><input id="fuel_file" type="file" accept="image/*,.pdf"></div><div class="col-4"><label>Фото чека проживання</label><input id="acc_file" type="file" accept="image/*,.pdf"></div><div class="col-4"><label>Інший чек</label><input id="other_file" type="file" accept="image/*,.pdf"></div><div class="col-12"><label>Коментар</label><textarea id="comment"></textarea></div><div class="col-12"><button class="btn green" onclick="saveDay()">Зберегти день / період</button><p class="muted">Якщо вибрано період, напрямки створяться на кожен день. Витрати й чеки прикріпляться тільки до першої дати періоду, наступні дні будуть без дублювання витрат.</p></div></div><hr><div id="mydays">Завантаження...</div>`;loadDays()}
function parseDateLocal(v){const [y,m,d]=String(v).split('-').map(Number);return new Date(y,m-1,d)}
function fmtDateLocal(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function datesRange(from,to){let a=parseDateLocal(from),b=parseDateLocal(to),out=[]; if(!from||!to)return out; if(a>b)return out; for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))out.push(fmtDateLocal(d)); return out}
async function isMonthLocked(userId,dateStr){const m=dateStr.slice(0,7)+'-01'; const {data}=await sb.from('month_locks').select('id').eq('user_id',userId).or(`lock_month.eq.${m},salary_month.eq.${m}`).maybeSingle(); return !!data}
async function uploadReceipt(fileInput,kind,dateStr){const f=fileInput?.files?.[0]; if(!f)return null; const ext=(f.name.split('.').pop()||'jpg').toLowerCase(); const path=`${profile.id}/${dateStr}/${kind}-${Date.now()}.${ext}`; const {error}=await sb.storage.from('receipts').upload(path,f,{upsert:true}); if(error){msg('Чек не завантажився: '+error.message);return null} return sb.storage.from('receipts').getPublicUrl(path).data.publicUrl}
async function saveDay(){
  const dates=datesRange(wd_date_from.value,wd_date_to.value||wd_date_from.value);
  if(!dates.length)return msg('Невірний період');
  const ds=[...document.querySelectorAll('input[name=dir]:checked')].map(x=>x.value); if(!ds.length)return msg('Оберіть напрямок');
  for(const d of dates){ if(await isMonthLocked(profile.id,d)) return msg('У діапазоні є закритий місяць: '+d.slice(0,7)); }
  const first=dates[0];
  const fu=await uploadReceipt(fuel_file,'fuel',first); const au=await uploadReceipt(acc_file,'accommodation',first); const ou=await uploadReceipt(other_file,'other',first);
  const rows=dates.map((d,i)=>{
    const isFirst=i===0;
    const rec={user_id:profile.id,work_date:d,directions:ds,direction:ds[0],fuel:isFirst?(+fuel.value||0):0,amortization:isFirst?(+amort.value||0):0,accommodation:isFirst?(+acc.value||0):0,comment:comment.value||''};
    if(isFirst){ if(fu)rec.fuel_receipt_url=fu; if(au)rec.accommodation_receipt_url=au; if(ou)rec.other_receipt_url=ou; }
    else{ rec.fuel_receipt_url=null; rec.accommodation_receipt_url=null; rec.other_receipt_url=null; }
    return rec;
  });
  const {data,error}=await sb.from('work_days').upsert(rows,{onConflict:'user_id,work_date'}).select(); if(error)return msg(error.message);
  await logAction('work_period_saved',{from:first,to:dates[dates.length-1],days:dates.length,directions:ds,expenses_on:first,fuel:+fuel.value||0,amortization:+amort.value||0,accommodation:+acc.value||0});
  msg(dates.length===1?'Збережено':'Збережено '+dates.length+' днів. Витрати й чеки прикріплено до '+first); screenDays();
}
async function loadDays(){const {data,error}=await sb.from('work_days').select('*').eq('user_id',profile.id).order('work_date',{ascending:false}).limit(80); if(error)return mydays.innerHTML=error.message; mydays.innerHTML=tableDays(data||[],false)}
async function loadDays(){const {data,error}=await sb.from('work_days').select('*').eq('user_id',profile.id).order('work_date',{ascending:false}).limit(80); if(error)return mydays.innerHTML=error.message; mydays.innerHTML=tableDays(data||[],false,false)}
function tableDays(rows,showUser,adminActions=false){if(!rows.length)return '<p class="muted">Записів немає</p>';return `<div class="scroll"><table><thead><tr>${showUser?'<th>Працівник</th>':''}<th>Дата</th><th>Напрямки</th><th>Витрати</th><th>Чеки</th><th>Подано</th>${adminActions?'<th>Дії</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${showUser?`<td>${esc(r.users?.full_name||r.full_name||'')}</td>`:''}<td>${r.work_date}</td><td>${(r.directions||[r.direction]).filter(Boolean).map(d=>`<span class="pill bluep">${esc(d)}</span>`).join(' ')}</td><td>${fmt((+r.fuel||0)+(+r.amortization||0)+(+r.accommodation||0))}</td><td>${receiptLinks(r)}</td><td>${(r.submitted_at||r.created_at)?new Date(r.submitted_at||r.created_at).toLocaleString('uk-UA'):''}</td>${adminActions?`<td><button class="btn small" onclick="adminEditWorkDay('${r.id}')">Редагувати</button> <button class="btn small red" onclick="adminDeleteWorkDay('${r.id}')">Видалити</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
async function adminEditWorkDay(id){
  const {data:r,error}=await sb.from('work_days').select('*').eq('id',id).maybeSingle(); if(error||!r)return msg(error?.message||'Запис не знайдено');
  const dirs=prompt('Напрямки через кому', (r.directions||[r.direction]).filter(Boolean).join(', ')); if(dirs===null)return;
  const fuelV=prompt('Пальне', r.fuel||0); if(fuelV===null)return;
  const amortV=prompt('Амортизація', r.amortization||0); if(amortV===null)return;
  const accV=prompt('Проживання', r.accommodation||0); if(accV===null)return;
  const comm=prompt('Коментар', r.comment||''); if(comm===null)return;
  const ds=dirs.split(',').map(x=>x.trim()).filter(Boolean);
  const upd={directions:ds,direction:ds[0]||null,fuel:+fuelV||0,amortization:+amortV||0,accommodation:+accV||0,comment:comm};
  const {error:e}=await sb.from('work_days').update(upd).eq('id',id); if(e)return msg(e.message);
  await logAction('admin_work_day_updated',{id,old:r,new:upd}); msg('Запис оновлено'); screenReports();

async function saveEmployee(id){
  const {data:oldUser,error:oldErr}=await sb.from('users').select('*').eq('id',id).maybeSingle();
  if(oldErr)return msg(oldErr.message);
  const newRate=+document.getElementById('rate_'+id).value||2500;
  const newDed=+document.getElementById('ded_'+id).value||48000;
  const eff=document.getElementById('eff_'+id).value;
  const oldRate=Number(oldUser?.daily_rate??2500);
  const oldDed=Number(oldUser?.employee_deduction??48000);
  const rateChanged=(oldRate!==newRate)||(oldDed!==newDed);
  if(rateChanged && !eff)return msg('Оберіть дату “Діє з” для нової ставки/утримання');
  const upd={
    full_name:document.getElementById('fn_'+id).value,
    callsign:document.getElementById('call_'+id).value,
    phone:document.getElementById('ph_'+id).value,
    birth_date:document.getElementById('bd_'+id).value||null,
    role:document.getElementById('role_'+id).value,
    employment_type:document.getElementById('emp_'+id).value,
    status:document.getElementById('st_'+id).value,
    employee_status:document.getElementById('st_'+id).value,
    leader_direction:document.getElementById('ld_'+id).value||null,
    daily_rate:newRate,
    employee_deduction:newDed
  };
  let hErr=null;
  if(rateChanged){
    const {data:existingHist}=await sb.from('salary_rates_history').select('*').eq('user_id',id).order('effective_from',{ascending:true});
    const hasBefore=(existingHist||[]).some(r=>r.effective_from<eff);
    if(!hasBefore){
      const baseDate='2000-01-01';
      const {error:baseErr}=await sb.from('salary_rates_history').upsert({
        user_id:id,
        effective_from:baseDate,
        daily_rate:oldRate,
        employee_deduction:oldDed,
        created_by:profile.id
      },{onConflict:'user_id,effective_from'});
      if(baseErr)hErr=baseErr;
    }
    if(!hErr){
      const {error:rateErr}=await sb.from('salary_rates_history').upsert({
        user_id:id,
        effective_from:eff,
        daily_rate:newRate,
        employee_deduction:newDed,
        created_by:profile.id
      },{onConflict:'user_id,effective_from'});
      hErr=rateErr;
    }
  }
  const {error}=await sb.from('users').update(upd).eq('id',id);
  if(error)return msg(error.message);
  if(hErr)msg('Працівника оновлено, але історія ставки не записалась: '+hErr.message); else msg(rateChanged?'Працівника оновлено. Нові ставка/утримання діють з '+eff:'Працівника оновлено');
  await logAction('employee_updated',{user_id:id,effective_from:rateChanged?eff:null,old_rate:oldRate,new_rate:newRate,old_deduction:oldDed,new_deduction:newDed});
  loadEmployees();
}

async function closeMonthAll(){const month=window.lockMonth||ym(); const {data:users}=await sb.from('users').select('id').eq('status','active'); await upsertLocks((users||[]).map(u=>u.id),month)}
async function closeMonthSelected(){const ids=[...document.querySelectorAll('input[name=lock_user]:checked')].map(x=>x.value); await upsertLocks(ids,window.lockMonth||ym())}
async function upsertLocks(ids,month){if(!ids.length)return msg('Оберіть працівників'); const rows=ids.map(id=>({user_id:id,lock_month:month,salary_month:month,locked_by:profile.id})); const {error}=await sb.from('month_locks').upsert(rows,{onConflict:'lock_month,user_id'}); if(error)return msg(error.message); await logAction('month_locked',{month,ids}); msg('Місяць закрито'); screenLocks()}
async function openMonthForUser(userId){const month=window.lockMonth||ym(); const {error}=await sb.from('month_locks').delete().eq('user_id',userId).or(`lock_month.eq.${month},salary_month.eq.${month}`); if(error)return msg(error.message); await logAction('month_opened',{month,ids:[userId]}); msg('Місяць відкрито'); screenLocks()}
async function openMonthSelected(){const ids=[...document.querySelectorAll('input[name=lock_user]:checked')].map(x=>x.value); if(!ids.length)return msg('Оберіть працівників'); const month=window.lockMonth||ym(); const {error}=await sb.from('month_locks').delete().in('user_id',ids).or(`lock_month.eq.${month},salary_month.eq.${month}`); if(error)return msg(error.message); await logAction('month_opened',{month,ids}); msg('Місяць відкрито вибраним'); screenLocks()}
async function openMonthAll(){if(!confirm('Відкрити місяць всім працівникам?'))return; const month=window.lockMonth||ym(); const {error}=await sb.from('month_locks').delete().or(`lock_month.eq.${month},salary_month.eq.${month}`); if(error)return msg(error.message); await logAction('month_opened_all',{month}); msg('Місяць відкрито всім'); screenLocks()}
function auditDetails(d){if(!d)return ''; if(typeof d==='string')return esc(d); if(d.old&&d.new){return `Було:\nДата: ${d.old.work_date||''}\nНапрямки: ${(d.old.directions||[]).join(', ')}\nАмортизація: ${d.old.amortization||0} грн\nПроживання: ${d.old.accommodation||0} грн\n\nСтало:\nДата: ${d.new.work_date||''}\nНапрямки: ${(d.new.directions||[]).join(', ')}\nАмортизація: ${d.new.amortization||0} грн\nПроживання: ${d.new.accommodation||0} грн`} if(d.work_date)return `Дата роботи: ${d.work_date}\nНапрямки: ${(d.directions||[d.direction]).filter(Boolean).join(', ')}\nПальне: ${d.fuel||0} грн\nАмортизація: ${d.amortization||0} грн\nПроживання: ${d.accommodation||0} грн`; return esc(JSON.stringify(d,null,2))}
async function screenAudit(){const {data,error}=await sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(200); if(error)return document.getElementById('screen').innerHTML=error.message; const ids=[...new Set((data||[]).map(x=>x.user_id).filter(Boolean))]; let users=[]; if(ids.length)users=(await sb.from('users').select('id,full_name,callsign').in('id',ids)).data||[]; const map=Object.fromEntries(users.map(u=>[u.id,u])); document.getElementById('screen').innerHTML=`<h2>Журнал</h2><div class="scroll"><table><thead><tr><th>Дата</th><th>Користувач</th><th>Дія</th><th>Деталі</th></tr></thead><tbody>${(data||[]).map(r=>{const u=map[r.user_id]||{};return `<tr><td>${new Date(r.created_at).toLocaleString('uk-UA')}</td><td>${esc(u.full_name||'')} ${u.callsign?'('+esc(u.callsign)+')':''}</td><td>${esc(r.action)}</td><td><pre>${auditDetails(r.details)}</pre></td></tr>`}).join('')}</tbody></table></div>`}
init();
</script>
</body>
</html>
