<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ЗП-VD</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#0f172a;--card:#111827;--muted:#94a3b8;--text:#e5e7eb;--line:#263244;--accent:#2563eb;--green:#16a34a;--red:#dc2626;--yellow:#f59e0b}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#0f172a,#111827);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif} input,select,textarea,button{font:inherit} .wrap{max-width:1240px;margin:0 auto;padding:20px}.card{background:rgba(17,24,39,.94);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.login{max-width:460px;margin:8vh auto}.title{margin:0 0 6px;font-size:32px}.muted{color:var(--muted);font-size:14px}label{display:block;margin:8px 0 5px;color:#cbd5e1;font-size:14px}input,select,textarea{width:100%;background:#0b1220;color:var(--text);border:1px solid #334155;border-radius:10px;padding:10px;outline:none}textarea{min-height:90px}button{background:var(--accent);color:white;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}button:hover{filter:brightness(1.08)}button.secondary{background:#334155}button.danger{background:var(--red)}button.small{padding:7px 10px;font-size:13px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}.nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.nav button{background:#1e293b}.nav button.active{background:#2563eb}.row{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-6{grid-column:span 6}.col-4{grid-column:span 4}.col-3{grid-column:span 3}.col-2{grid-column:span 2}.grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#0b1220;border:1px solid #334155;border-radius:14px;padding:14px}.stat b{font-size:22px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border-bottom:1px solid #243244;padding:10px;text-align:left;vertical-align:top}th{color:#cbd5e1;background:#0b1220;position:sticky;top:0}.pill{display:inline-block;border-radius:999px;padding:3px 8px;margin:2px;font-size:12px}.blue{background:#1d4ed8}.green{background:#166534}.red{background:#991b1b}.yellow{background:#92400e}.checkrow{display:flex;flex-wrap:wrap;gap:8px}.checkrow label{background:#0b1220;border:1px solid #334155;border-radius:10px;padding:8px 10px;margin:0}.checkrow input{width:auto}.receipt-links a{display:inline-block;margin:2px 6px 2px 0;color:#93c5fd}.msg{position:fixed;right:18px;bottom:18px;background:#111827;border:1px solid #475569;color:white;border-radius:14px;padding:13px 16px;box-shadow:0 18px 55px rgba(0,0,0,.35);z-index:99}.audit-details{white-space:pre-wrap;margin:0;font-family:inherit;color:#dbeafe}.install{display:none}.no-print{display:block}hr{border:0;border-top:1px solid #334155;margin:18px 0}.hint{background:#0b1220;border:1px dashed #475569;border-radius:14px;padding:12px;margin:10px 0;color:#cbd5e1}
    @media(max-width:760px){.wrap{padding:12px}.row,.grid-cards{grid-template-columns:1fr}.col-2,.col-3,.col-4,.col-6,.col-8,.col-12{grid-column:span 1}.top{display:block}.nav button{flex:1 1 auto}.stat b{font-size:18px}}
    @media print{body{background:#fff;color:#000}.wrap{max-width:none}.card{box-shadow:none;border:0;background:#fff;color:#000}.no-print,.nav,.top button{display:none!important}table th,table td{border-color:#999;color:#000}.stat{border-color:#999;background:#fff;color:#000}}
  </style>

<body>
<div id="app"></div>
<script>
const SUPABASE_URL='https://gahbfqpkgnbezkfqkziy.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_xRk6B66TkytVRztLnOq6cQ_Zzn4awMW';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const directions=['Софт','FPV','Класика','БЗВП','Online'];
let me=null,profile=null,tab='dashboard',deferredInstallPrompt=null;
const app=document.getElementById('app');
const $=id=>document.getElementById(id); const screenEl=()=>document.getElementById('screen');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(n){return (Number(n||0)).toLocaleString('uk-UA')+' грн'}
function ym(d=new Date()){return d.toISOString().slice(0,7)+'-01'}
function selectedMonth(){const el=$('global_month');return (el?.value||localStorage.getItem('zpvd_month')||new Date().toISOString().slice(0,7))+'-01'}
function monthEnd(month){const [y,m]=month.slice(0,7).split('-').map(Number);return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10)}
function roleName(r){return r==='admin'?'Адмін':r==='leader'?'Старший групи':'Працівник'}
function statusName(s){return s==='dismissed'?'Звільнений':'Активний'}
function msg(t){const old=document.querySelector('.msg');if(old)old.remove();const el=document.createElement('div');el.className='msg';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),4200)}
function parseJsonMaybe(v){if(v&&typeof v==='object')return v;if(typeof v==='string'){try{return JSON.parse(v)}catch(e){return v}}return v}
function formatDayDetails(d){d=parseJsonMaybe(d)||{};return `Дата роботи: ${d.work_date||'—'}\nНапрямки: ${(d.directions||[d.direction].filter(Boolean)).join(', ')||'—'}\nПальне: ${Number(d.fuel||0)} грн\nАмортизація: ${Number(d.amortization||0)} грн\nПроживання: ${Number(d.accommodation||0)} грн${d.comment?`\nКоментар: ${d.comment}`:''}`}
function formatAuditDetails(details){const d=parseJsonMaybe(details);if(!d)return '';if(typeof d==='string')return d;if(d.old&&d.new)return `Було:\n${formatDayDetails(d.old)}\n\nСтало:\n${formatDayDetails(d.new)}`;if(d.work_date||d.directions||d.direction)return formatDayDetails(d);return JSON.stringify(d,null,2)}
async function logAction(action,details){try{await sb.from('audit_log').insert({user_id:profile?.id||null,action,details:details??''})}catch(e){}}

async function init(){
  if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});navigator.serviceWorker.ready.then(r=>r.update()).catch(()=>{})}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;const b=$('installBtn');if(b)b.style.display='inline-block'});
  const {data}=await sb.auth.getSession();me=data.session?.user||null;if(!me)return renderLogin();await loadProfile();
}
async function loadProfile(){const {data,error}=await sb.from('users').select('*').or(`auth_id.eq.${me.id},auth_user_id.eq.${me.id},email.eq.${me.email}`).maybeSingle();if(error){msg(error.message);return renderNoProfile(error.message)}if(!data)return renderNoProfile();if((data.status||data.employee_status)==='dismissed'){await sb.auth.signOut();app.innerHTML='<div class="wrap"><div class="card login"><h1 class="title">Доступ закрито</h1><p>Ваш профіль має статус “Звільнений”. Зверніться до адміністратора.</p></div></div>';return}profile=data;renderApp()}
function renderLogin(){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">ЗП-VD</h1><p class="muted">Вхід через email та пароль. Пристрій запам’ятовується автоматично.</p><label>Email</label><input id="email" type="email" placeholder="name@example.com"><label>Пароль</label><input id="password" type="password" placeholder="Пароль"><div style="height:14px"></div><button onclick="login()">Увійти</button></div></div>`}
async function login(){const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message);me=data.user;await loadProfile()}
async function logout(){await sb.auth.signOut();me=null;profile=null;tab='dashboard';renderLogin()}
function renderNoProfile(extra=''){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">Профіль не знайдено</h1><p>Ваш email авторизований, але профіль працівника ще не прив’язаний у таблиці <b>users</b>.</p>${extra?`<p class="muted">${esc(extra)}</p>`:''}<p class="muted">ID користувача Auth:</p><input readonly value="${esc(me?.id||'')}"><p class="muted">Email:</p><input readonly value="${esc(me?.email||'')}"><button onclick="logout()" class="secondary" style="margin-top:12px">Вийти</button></div></div>`}
function nav(){const items=[['dashboard','Головна'],['days','Робочі дні'],['salary','Мій розрахунок'],['profile','Мій профіль']];if(profile.role==='leader')items.push(['leader','Мій напрямок']);if(profile.role==='admin')items.push(['employees','Працівники'],['reports','Звіти'],['adjustments','Коригування'],['locks','Закриття місяця'],['leader','Напрямки'],['audit','Журнал']);return `<div class="nav">${items.map(i=>`<button class="${tab===i[0]?'active':''}" onclick="tab='${i[0]}';renderApp()">${i[1]}</button>`).join('')}<button onclick="logout()" class="secondary">Вийти</button></div>`}
async function installApp(){if(!deferredInstallPrompt)return msg('На iPhone: Поділитися → На головний екран. На Android: меню браузера → Встановити застосунок.');deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;const b=$('installBtn');if(b)b.style.display='none'}
async function renderApp(){const month=localStorage.getItem('zpvd_month')||new Date().toISOString().slice(0,7);app.innerHTML=`<div class="wrap"><div class="top"><div><h1 class="title">ЗП-VD</h1><div class="muted">${esc(profile.full_name)} ${profile.callsign?'('+esc(profile.callsign)+')':''} · ${roleName(profile.role)}</div></div><div class="no-print"><button id="installBtn" class="secondary install" onclick="installApp()">Встановити застосунок</button><label>Місяць</label><input id="global_month" type="month" value="${month}" onchange="localStorage.setItem('zpvd_month',this.value);renderApp()"></div></div>${nav()}<div id="screen" class="card">Завантаження...</div></div>`;const b=$('installBtn');if(b&&deferredInstallPrompt)b.style.display='inline-block';try{if(tab==='dashboard')return await screenDashboard();if(tab==='days')return await screenDays();if(tab==='salary')return await screenSalary();if(tab==='profile')return screenProfile();if(tab==='employees')return await screenEmployees();if(tab==='reports')return await screenReports();if(tab==='adjustments')return await screenAdjustments();if(tab==='locks')return await screenLocks();if(tab==='leader')return await screenLeader();if(tab==='audit')return await screenAudit()}catch(e){screenEl().innerHTML=`<h2>Помилка</h2><p>${esc(e.message||e)}</p>`}}

async function getRatesForUsers(userIds,endDate){if(!userIds.length)return {};const {data,error}=await sb.from('salary_rates_history').select('*').in('user_id',userIds).lte('effective_from',endDate).order('effective_from',{ascending:true});if(error)return {};const map={};(data||[]).forEach(r=>{(map[r.user_id]||(map[r.user_id]=[])).push(r)});return map}
function rateForDate(user,ratesMap,date){const arr=ratesMap[user.id]||[];let r=null;for(const x of arr){if(x.effective_from<=date)r=x;else break}return {daily_rate:Number(r?.daily_rate ?? user.daily_rate ?? 2500),employee_deduction:Number(r?.employee_deduction ?? user.employee_deduction ?? 48000)}}
async function computeMonthlySummaries(month){const start=month,end=monthEnd(month);const {data:users,error:uErr}=await sb.from('users').select('*');if(uErr)throw uErr;const {data:days,error:dErr}=await sb.from('work_days').select('*').gte('work_date',start).lte('work_date',end);if(dErr)throw dErr;const {data:adj,error:aErr}=await sb.from('adjustments').select('*').eq('adjustment_month',month);if(aErr)throw aErr;const userIds=[...new Set([...(users||[]).map(u=>u.id),...(days||[]).map(d=>d.user_id)])].filter(Boolean);const rates=await getRatesForUsers(userIds,end);const uMap=Object.fromEntries((users||[]).map(u=>[u.id,u]));const rows={};for(const u of users||[]){rows[u.id]={user_id:u.id,full_name:u.full_name,callsign:u.callsign,phone:u.phone,email:u.email,role:u.role,employment_type:u.employment_type,status:u.status||u.employee_status,salary_month:month,work_days_count:0,daily_rate:Number(u.daily_rate||2500),base_salary:0,fuel_total:0,amortization_total:0,accommodation_total:0,adjustments_total:0,employee_deduction:0,total_to_pay:0}}
  for(const d of days||[]){const u=uMap[d.user_id]||{};const row=rows[d.user_id]||(rows[d.user_id]={user_id:d.user_id,full_name:'',salary_month:month,work_days_count:0,base_salary:0,fuel_total:0,amortization_total:0,accommodation_total:0,adjustments_total:0,employee_deduction:0,total_to_pay:0,employment_type:u.employment_type});const r=rateForDate(u,rates,d.work_date);row.daily_rate=r.daily_rate;row.work_days_count++;row.base_salary+=r.daily_rate;row.fuel_total+=Number(d.fuel||0);row.amortization_total+=Number(d.amortization||0);row.accommodation_total+=Number(d.accommodation||0)}
  for(const a of adj||[]){const row=rows[a.user_id];if(row)row.adjustments_total+=a.type==='bonus'?Number(a.amount||0):-Number(a.amount||0)}
  Object.values(rows).forEach(row=>{const u=uMap[row.user_id]||{};const r=rateForDate(u,rates,end);row.daily_rate=r.daily_rate;row.employee_deduction=(u.employment_type==='employee')?r.employee_deduction:0;row.total_to_pay=row.base_salary+row.fuel_total+row.amortization_total+row.accommodation_total+row.adjustments_total-row.employee_deduction});return Object.values(rows).filter(r=>r.work_days_count||r.adjustments_total)}

async function screenDashboard(){const m=selectedMonth();let rows=[];try{rows=await computeMonthlySummaries(m)}catch(e){return screenEl().innerHTML=`<h2>Головна</h2><p>${esc(e.message)}</p>`}if(profile.role!=='admin')rows=rows.filter(r=>r.user_id===profile.id);const total=rows.reduce((s,r)=>s+Number(r.total_to_pay||0),0);const records=rows.reduce((s,r)=>s+Number(r.work_days_count||0),0);const expenses=rows.reduce((s,r)=>s+Number(r.fuel_total||0)+Number(r.amortization_total||0)+Number(r.accommodation_total||0),0);screenEl().innerHTML=`<h2>Головна</h2><div class="grid-cards"><div class="stat"><span class="muted">Місяць</span><br><b>${m.slice(0,7)}</b></div><div class="stat"><span class="muted">Робочих днів / записів</span><br><b>${records}</b></div><div class="stat"><span class="muted">Витрати</span><br><b>${fmt(expenses)}</b></div><div class="stat"><span class="muted">До виплати</span><br><b>${fmt(total)}</b></div></div>`}

async function screenDays(){screenEl().innerHTML=`<h2>Робочі дні</h2><div class="row"><div class="col-4"><label>Дата</label><input id="wd_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="col-8"><label>Напрямки</label><div class="checkrow">${directions.map(d=>`<label><input type="checkbox" name="dir" value="${d}"> ${d}</label>`).join('')}</div></div><div class="col-4"><label>Пальне</label><input id="fuel" type="number" value="0"></div><div class="col-4"><label>Амортизація</label><input id="amort" type="number" value="0"></div><div class="col-4"><label>Проживання</label><input id="acc" type="number" value="0"></div><div class="col-4"><label>Фото чека пальне</label><input id="fuel_receipt" type="file" accept="image/*,application/pdf"></div><div class="col-4"><label>Фото чека проживання</label><input id="acc_receipt" type="file" accept="image/*,application/pdf"></div><div class="col-4"><label>Інший чек</label><input id="other_receipt" type="file" accept="image/*,application/pdf"></div><div class="col-12"><label>Коментар</label><textarea id="comment"></textarea></div><div class="col-12"><button onclick="saveDay()">Зберегти день</button></div></div><hr><div id="mydays">Завантаження...</div>`;loadDays()}
async function isMonthLocked(userId,dateStr){const month=dateStr.slice(0,7)+'-01';const {data,error}=await sb.from('month_locks').select('id').eq('user_id',userId).eq('lock_month',month).maybeSingle();if(error){msg(error.message);return true}return !!data}
async function uploadReceipt(inputId,prefix,date){const input=$(inputId);const file=input?.files?.[0];if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${profile.id}/${date}/${prefix}-${Date.now()}.${ext}`;const {error}=await sb.storage.from('receipts').upload(path,file,{upsert:true});if(error){msg(error.message);return null}const {data}=sb.storage.from('receipts').getPublicUrl(path);return data.publicUrl}
async function saveDay(){const date=$('wd_date').value;const locked=await isMonthLocked(profile.id,date);if(locked)return msg('Цей місяць закрито. Редагування недоступне.');const ds=[...document.querySelectorAll('input[name=dir]:checked')].map(x=>x.value);if(!ds.length)return msg('Оберіть хоча б один напрямок');const oldRes=await sb.from('work_days').select('*').eq('user_id',profile.id).eq('work_date',date).maybeSingle();const old=oldRes.data||null;const rec={user_id:profile.id,work_date:date,directions:ds,direction:ds[0],fuel:+$('fuel').value||0,amortization:+$('amort').value||0,accommodation:+$('acc').value||0,comment:$('comment').value||'',updated_at:new Date().toISOString(),submitted_at:old?.submitted_at||new Date().toISOString()};const fr=await uploadReceipt('fuel_receipt','fuel',date);if(fr)rec.fuel_receipt_url=fr;const ar=await uploadReceipt('acc_receipt','accommodation',date);if(ar)rec.accommodation_receipt_url=ar;const or=await uploadReceipt('other_receipt','other',date);if(or)rec.other_receipt_url=or;const {data,error}=await sb.from('work_days').upsert(rec,{onConflict:'user_id,work_date'}).select('*').maybeSingle();if(error)return msg(error.message);await logAction(old?'updated':'created',old?{old,new:data||rec}:data||rec);msg('Збережено');screenDays()}
async function loadDays(){const {data,error}=await sb.from('work_days').select('*').eq('user_id',profile.id).order('work_date',{ascending:false}).limit(80);if(error)return $('mydays').innerHTML=esc(error.message);$('mydays').innerHTML=tableDays(data||[],false)}
function receiptLinks(r){const links=[];if(r.fuel_receipt_url)links.push(`<a target="_blank" href="${esc(r.fuel_receipt_url)}">Пальне</a>`);if(r.accommodation_receipt_url)links.push(`<a target="_blank" href="${esc(r.accommodation_receipt_url)}">Проживання</a>`);if(r.other_receipt_url)links.push(`<a target="_blank" href="${esc(r.other_receipt_url)}">Інший</a>`);return links.length?`<div class="receipt-links">${links.join('')}</div>`:'—'}
function tableDays(rows,showUser){if(!rows.length)return '<p class="muted">Записів немає</p>';return `<div class="table-wrap"><table><thead><tr>${showUser?'<th>Працівник</th>':''}<th>Дата</th><th>Напрямки</th><th>Витрати</th><th>Чеки</th><th>Подано</th></tr></thead><tbody>${rows.map(r=>`<tr>${showUser?`<td>${esc(r.users?.full_name||r.full_name||'')}</td>`:''}<td>${esc(r.work_date)}</td><td>${(r.directions&&r.directions.length?r.directions:(r.direction?[r.direction]:[])).map(d=>`<span class="pill blue">${esc(d)}</span>`).join('')}</td><td>${fmt((+r.fuel||0)+(+r.amortization||0)+(+r.accommodation||0))}</td><td>${receiptLinks(r)}</td><td>${r.created_at?new Date(r.created_at).toLocaleString('uk-UA'):''}</td></tr>`).join('')}</tbody></table></div>`}

async function screenSalary(){const m=selectedMonth();let rows=[];try{rows=await computeMonthlySummaries(m)}catch(e){return screenEl().innerHTML=`<h2>Мій розрахунок</h2><p>${esc(e.message)}</p>`}const data=rows.find(r=>r.user_id===profile.id);if(!data)return screenEl().innerHTML=`<h2>Мій розрахунок</h2><p class="muted">За ${m.slice(0,7)} ще немає даних для розрахунку.</p>`;const expenses=Number(data.fuel_total||0)+Number(data.amortization_total||0)+Number(data.accommodation_total||0);screenEl().innerHTML=`<div id="salary_print"><h2>Мій розрахунок</h2><p class="muted">${esc(profile.full_name)} ${profile.callsign?'('+esc(profile.callsign)+')':''} · ${m.slice(0,7)}</p><div class="grid-cards"><div class="stat"><span class="muted">Робочих днів</span><br><b>${data.work_days_count||0}</b></div><div class="stat"><span class="muted">Поточна ставка</span><br><b>${fmt(data.daily_rate||0)}</b></div><div class="stat"><span class="muted">Основна зарплата</span><br><b>${fmt(data.base_salary||0)}</b></div><div class="stat"><span class="muted">До виплати</span><br><b>${fmt(data.total_to_pay||0)}</b></div></div><hr><table><tbody><tr><th>Пальне</th><td>${fmt(data.fuel_total||0)}</td></tr><tr><th>Амортизація</th><td>${fmt(data.amortization_total||0)}</td></tr><tr><th>Проживання</th><td>${fmt(data.accommodation_total||0)}</td></tr><tr><th>Витрати разом</th><td>${fmt(expenses)}</td></tr><tr><th>Коригування</th><td>${fmt(data.adjustments_total||0)}</td></tr><tr><th>Утримання</th><td>${fmt(data.employee_deduction||0)}</td></tr><tr><th><b>До виплати</b></th><td><b>${fmt(data.total_to_pay||0)}</b></td></tr></tbody></table></div><div class="no-print" style="margin-top:14px"><button onclick="window.print()">Друк / PDF</button></div>`}

function screenProfile(){screenEl().innerHTML=`<h2>Мій профіль</h2><div class="row"><div class="col-6"><label>ПІБ</label><input value="${esc(profile.full_name)}" disabled></div><div class="col-6"><label>Позивний</label><input value="${esc(profile.callsign)}" disabled></div><div class="col-4"><label>Телефон</label><input id="p_phone" value="${esc(profile.phone)}"></div><div class="col-4"><label>Email</label><input id="p_email" type="email" value="${esc(profile.email||me.email)}"></div><div class="col-4"><label>Дата народження</label><input id="p_birth" type="date" value="${profile.birth_date||''}"></div><div class="col-4"><label>Нагадування</label><select id="p_rem_enabled"><option value="true">Увімкнено</option><option value="false">Вимкнено</option></select></div><div class="col-4"><label>Частота</label><select id="p_rem_freq"><option value="daily">Щодня</option><option value="weekly">Щотижня</option><option value="monthly">Щомісяця</option></select></div><div class="col-4"><label>Час</label><input id="p_rem_time" type="time" value="${esc(profile.reminder_time||'18:00')}"></div><div class="col-4"><label>День тижня</label><select id="p_rem_day"><option value="monday">Понеділок</option><option value="tuesday">Вівторок</option><option value="wednesday">Середа</option><option value="thursday">Четвер</option><option value="friday">П’ятниця</option><option value="saturday">Субота</option><option value="sunday">Неділя</option></select></div><div class="col-4"><label>Статус</label><input value="${profile.employment_type==='employee'?'Працевлаштований':'Фрілансер'}" disabled></div><div class="col-4"><label>Роль</label><input value="${roleName(profile.role)}" disabled></div><div class="col-12"><button onclick="saveProfile()">Зберегти профіль</button></div></div><hr><h3>Зміна пароля</h3><div class="row"><div class="col-6"><label>Новий пароль</label><input id="new_pass" type="password"></div><div class="col-6"><label>Повторіть пароль</label><input id="new_pass2" type="password"></div><div class="col-12"><button onclick="changePassword()">Змінити пароль</button></div></div>`;$('p_rem_enabled').value=String(profile.reminder_enabled!==false);$('p_rem_freq').value=profile.reminder_frequency||'weekly';$('p_rem_day').value=profile.reminder_day||'friday'}
async function saveProfile(){const updates={phone:$('p_phone').value||null,email:$('p_email').value||null,birth_date:$('p_birth').value||null,reminder_enabled:$('p_rem_enabled').value==='true',reminder_frequency:$('p_rem_freq').value,reminder_time:$('p_rem_time').value||'18:00',reminder_day:$('p_rem_day').value};const {error}=await sb.from('users').update(updates).eq('id',profile.id);if(error)return msg(error.message);Object.assign(profile,updates);msg('Профіль оновлено');screenProfile()}
async function changePassword(){const p1=$('new_pass').value,p2=$('new_pass2').value;if(!p1||!p2)return msg('Введіть новий пароль двічі');if(p1!==p2)return msg('Паролі не співпадають');if(p1.length<6)return msg('Пароль має бути мінімум 6 символів');const {error}=await sb.auth.updateUser({password:p1});if(error)return msg(error.message);$('new_pass').value='';$('new_pass2').value='';msg('Пароль змінено')}

async function screenEmployees(){screenEl().innerHTML=`<h2>Працівники</h2><div class="hint">Для зміни ставки або утримання вкажіть дату <b>Діє з</b>. Старі дні та місяці не будуть перераховані новою ставкою.</div><div class="row"><input type="hidden" id="e_id"><div class="col-3"><label>ПІБ</label><input id="e_full"></div><div class="col-3"><label>Позивний</label><input id="e_call"></div><div class="col-3"><label>Email</label><input id="e_email" type="email"></div><div class="col-3"><label>Пароль для нового</label><input id="e_password" type="text" placeholder="Для нового працівника"></div><div class="col-3"><label>Телефон</label><input id="e_phone"></div><div class="col-3"><label>Дата народження</label><input id="e_birth" type="date"></div><div class="col-3"><label>Ставка за день</label><input id="e_daily" type="number" value="2500"></div><div class="col-3"><label>Утримання</label><input id="e_deduct" type="number" value="48000"></div><div class="col-3"><label>Діє з</label><input id="e_effective" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="col-3"><label>Статус</label><select id="e_emp"><option value="employee">Працевлаштований</option><option value="freelancer">Фрілансер</option></select></div><div class="col-3"><label>Стан</label><select id="e_status"><option value="active">Активний</option><option value="dismissed">Звільнений</option></select></div><div class="col-3"><label>Роль</label><select id="e_role"><option value="user">Працівник</option><option value="leader">Старший групи</option><option value="admin">Адмін</option></select></div><div class="col-3"><label>Напрямок старшого</label><select id="e_leader"><option value="">—</option>${directions.map(d=>`<option>${d}</option>`).join('')}</select></div><div class="col-12"><button onclick="saveEmployee()">Зберегти</button> <button class="secondary" onclick="clearEmployeeForm()">Очистити</button></div></div><hr><div id="emps">Завантаження...</div>`;loadEmployees()}
function clearEmployeeForm(){['e_id','e_full','e_call','e_email','e_password','e_phone','e_birth'].forEach(id=>$(id).value='');$('e_daily').value=2500;$('e_deduct').value=48000;$('e_effective').value=new Date().toISOString().slice(0,10);$('e_emp').value='employee';$('e_status').value='active';$('e_role').value='user';$('e_leader').value=''}
async function saveEmployee(){const id=$('e_id').value;const effective=$('e_effective').value||new Date().toISOString().slice(0,10);const rec={full_name:$('e_full').value.trim(),callsign:$('e_call').value.trim(),email:$('e_email').value.trim(),password:$('e_password').value.trim(),phone:$('e_phone').value||null,birth_date:$('e_birth').value||null,employment_type:$('e_emp').value,status:$('e_status').value,employee_status:$('e_status').value,role:$('e_role').value,leader_direction:$('e_leader').value||null,daily_rate:+$('e_daily').value||2500,employee_deduction:+$('e_deduct').value||0};if(!rec.full_name||!rec.email)return msg('Заповніть ПІБ та email');let userId=id;if(!id){if(!rec.password)return msg('Для нового працівника вкажіть пароль');const resp=await fetch('/api/create-employee',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});const data=await resp.json().catch(()=>({error:'Невідома помилка'}));if(!resp.ok)return msg(data.error||'Помилка створення');const found=await sb.from('users').select('id').eq('email',rec.email).maybeSingle();userId=found.data?.id;if(userId)await sb.from('users').update({daily_rate:rec.daily_rate,employee_deduction:rec.employee_deduction,status:rec.status,employee_status:rec.status}).eq('id',userId)}else{delete rec.password;const {error}=await sb.from('users').update(rec).eq('id',id);if(error)return msg(error.message);await logAction('Змінено працівника',`${rec.full_name} (${rec.callsign||''})`)}if(userId){await sb.from('salary_rates_history').upsert({user_id:userId,effective_from:effective,daily_rate:rec.daily_rate,employee_deduction:rec.employee_deduction,created_by:profile.id},{onConflict:'user_id,effective_from'})}msg('Працівника збережено');clearEmployeeForm();loadEmployees()}
async function loadEmployees(){const {data,error}=await sb.from('users').select('*').order('full_name');const box=$('emps');if(error)return box.innerHTML=esc(error.message);box.innerHTML=`<div class="table-wrap"><table><thead><tr><th>ПІБ</th><th>Позивний</th><th>Email</th><th>Роль</th><th>Тип</th><th>Ставка</th><th>Утримання</th><th>Стан</th><th></th></tr></thead><tbody>${(data||[]).map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.callsign)}</td><td>${esc(u.email)}</td><td>${roleName(u.role)}</td><td>${u.employment_type==='employee'?'Працевлаштований':'Фрілансер'}</td><td>${fmt(u.daily_rate)}</td><td>${fmt(u.employee_deduction)}</td><td>${statusName(u.status||u.employee_status)}</td><td><button class="secondary small" onclick='editEmployee(${JSON.stringify(u).replace(/'/g,"&#39;")})'>Редагувати</button></td></tr>`).join('')}</tbody></table></div>`}
function editEmployee(u){$('e_id').value=u.id;$('e_full').value=u.full_name||'';$('e_call').value=u.callsign||'';$('e_email').value=u.email||'';$('e_password').value='';$('e_phone').value=u.phone||'';$('e_birth').value=u.birth_date||'';$('e_daily').value=u.daily_rate||2500;$('e_deduct').value=u.employee_deduction||48000;$('e_effective').value=new Date().toISOString().slice(0,10);$('e_emp').value=u.employment_type||'freelancer';$('e_status').value=u.status||u.employee_status||'active';$('e_role').value=u.role||'user';$('e_leader').value=u.leader_direction||'';window.scrollTo({top:0,behavior:'smooth'})}

async function screenReports(){const m=selectedMonth();let data=[];try{data=await computeMonthlySummaries(m)}catch(e){return screenEl().innerHTML=`<h2>Звіти</h2><p>${esc(e.message)}</p>`}screenEl().innerHTML='<h2>Звіти</h2><button onclick="exportSalaryExcel()">Експорт Excel</button><hr>'+`<div class="table-wrap"><table><thead><tr><th>Місяць</th><th>ПІБ</th><th>Днів</th><th>Ставка</th><th>Зарплата</th><th>Витрати</th><th>Коригування</th><th>Утримання</th><th>До виплати</th></tr></thead><tbody>${data.map(r=>`<tr><td>${r.salary_month}</td><td>${esc(r.full_name)}</td><td>${r.work_days_count}</td><td>${fmt(r.daily_rate)}</td><td>${fmt(r.base_salary)}</td><td>${fmt((+r.fuel_total||0)+(+r.amortization_total||0)+(+r.accommodation_total||0))}</td><td>${fmt(r.adjustments_total||0)}</td><td>${fmt(r.employee_deduction)}</td><td><b>${fmt(r.total_to_pay)}</b></td></tr>`).join('')}</tbody></table></div>`}
async function exportSalaryExcel(){const data=await computeMonthlySummaries(selectedMonth());if(!data.length)return msg('Немає даних');const rows=[['Місяць','ПІБ','Позивний','Днів','Поточна ставка','Зарплата','Пальне','Амортизація','Проживання','Утримання','Коригування','До виплати'],...data.map(r=>[r.salary_month,r.full_name,r.callsign||'',r.work_days_count||0,r.daily_rate||0,r.base_salary||0,r.fuel_total||0,r.amortization_total||0,r.accommodation_total||0,r.employee_deduction||0,r.adjustments_total||0,r.total_to_pay||0])];const csv=rows.map(row=>row.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(';')).join('\n');const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='zp-vd-zvit.csv';link.click()}

async function screenAdjustments(){const month=(window.currentAdjustmentMonth||selectedMonth().slice(0,7));screenEl().innerHTML=`<h2>Коригування зарплати</h2><div class="row"><div class="col-3"><label>Місяць</label><input id="a_month" type="month" value="${month}" onchange="window.currentAdjustmentMonth=this.value;loadAdjustments()"></div><div class="col-3"><label>Працівник</label><select id="a_user"></select></div><div class="col-2"><label>Тип</label><select id="a_type"><option value="bonus">Премія</option><option value="fine">Штраф</option></select></div><div class="col-2"><label>Сума</label><input id="a_amount" type="number" value="0"></div><div class="col-12"><label>Коментар</label><input id="a_comment" placeholder="Причина коригування"></div><div class="col-12"><button onclick="addAdjustment()">Додати коригування</button></div></div><hr><div id="adj_list">Завантаження...</div>`;await fillAdjustmentUsers();loadAdjustments()}
async function fillAdjustmentUsers(){const {data,error}=await sb.from('users').select('id,full_name,callsign,status').order('full_name');if(error)return msg(error.message);$('a_user').innerHTML=(data||[]).filter(u=>(u.status||'active')==='active').map(u=>`<option value="${u.id}">${esc(u.full_name)} ${u.callsign?'('+esc(u.callsign)+')':''}</option>`).join('')}
function adjustmentMonth(){return ($('a_month')?.value||window.currentAdjustmentMonth||selectedMonth().slice(0,7))+'-01'}
async function addAdjustment(){const rec={user_id:$('a_user').value,adjustment_month:adjustmentMonth(),type:$('a_type').value,amount:+$('a_amount').value||0,comment:$('a_comment').value||'',title:$('a_comment').value||'',created_by:profile.id};if(!rec.user_id||!rec.amount)return msg('Оберіть працівника і суму');const {error}=await sb.from('adjustments').insert(rec);if(error)return msg(error.message);await logAction(rec.type==='bonus'?'Додано премію':'Додано штраф',{amount:rec.amount,month:rec.adjustment_month,comment:rec.comment});msg('Коригування додано');$('a_amount').value=0;$('a_comment').value='';loadAdjustments()}
async function loadAdjustments(){const adjList=$('adj_list');if(!adjList)return;const month=adjustmentMonth();const {data,error}=await sb.from('adjustments').select('*').eq('adjustment_month',month).order('created_at',{ascending:false});if(error)return adjList.innerHTML=esc(error.message);if(!data?.length)return adjList.innerHTML='<p class="muted">Коригувань за цей місяць немає.</p>';const ids=[...new Set(data.map(a=>a.user_id).filter(Boolean))];let users=[];if(ids.length){const r=await sb.from('users').select('id,full_name,callsign').in('id',ids);users=r.data||[]}const map=Object.fromEntries(users.map(u=>[u.id,u]));adjList.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Працівник</th><th>Тип</th><th>Сума</th><th>Коментар</th><th>Дата</th><th></th></tr></thead><tbody>${data.map(a=>{const u=map[a.user_id]||{};return `<tr><td>${esc(u.full_name||'')} ${u.callsign?'('+esc(u.callsign)+')':''}</td><td>${a.type==='bonus'?'<span class="pill green">Премія</span>':'<span class="pill red">Штраф</span>'}</td><td>${fmt(a.amount)}</td><td>${esc(a.comment||a.title||'')}</td><td>${a.created_at?new Date(a.created_at).toLocaleString('uk-UA'):''}</td><td><button class="danger small" onclick="deleteAdjustment('${a.id}')">Видалити</button></td></tr>`}).join('')}</tbody></table></div>`}
async function deleteAdjustment(id){if(!confirm('Видалити коригування?'))return;const {error}=await sb.from('adjustments').delete().eq('id',id);if(error)return msg(error.message);await logAction('Видалено коригування',id);msg('Видалено');loadAdjustments()}

async function screenLocks(){const month=window.currentLockMonth||selectedMonth().slice(0,7);screenEl().innerHTML=`<h2>Закриття місяця</h2><label>Оберіть місяць</label><input id="lock_month" type="month" value="${month}" onchange="screenLocksLoad(this.value)"><div id="locks_area" style="margin-top:16px">Завантаження...</div>`;screenLocksLoad(month)}
async function screenLocksLoad(selected){window.currentLockMonth=selected||$('lock_month').value;const month=window.currentLockMonth+'-01';const {data:users,error:uErr}=await sb.from('users').select('id,full_name,callsign,status').order('full_name');const box=$('locks_area');if(uErr)return box.innerHTML=esc(uErr.message);const {data:locks,error:lErr}=await sb.from('month_locks').select('*').eq('lock_month',month);if(lErr)return box.innerHTML=esc(lErr.message);const lockedIds=new Set((locks||[]).map(l=>l.user_id));box.innerHTML=`<button onclick="closeMonthAll()">Закрити цей місяць всім</button><hr><h3>Закрити вибраним</h3><div class="checkrow">${(users||[]).map(u=>`<label><input type="checkbox" name="lock_user" value="${u.id}" ${lockedIds.has(u.id)?'checked':''}> ${esc(u.full_name)} ${u.callsign?'('+esc(u.callsign)+')':''} ${lockedIds.has(u.id)?'🔒':''}</label>`).join('')}</div><div style="height:14px"></div><button onclick="closeMonthSelected()">Закрити вибраним</button><hr><h3>Закриті за місяць</h3>${(locks||[]).length?`<div class="table-wrap"><table><thead><tr><th>Працівник</th><th>Дата закриття</th></tr></thead><tbody>${(locks||[]).map(l=>{const u=(users||[]).find(x=>x.id===l.user_id);return `<tr><td>${u?esc(u.full_name):esc(l.user_id)}</td><td>${l.locked_at?new Date(l.locked_at).toLocaleString('uk-UA'):''}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">За цей місяць ще нікого не закрито.</p>'}`}
function selectedLockMonth(){return (window.currentLockMonth||$('lock_month').value)+'-01'}
async function closeMonthAll(){if(!confirm('Закрити вибраний місяць всім активним працівникам?'))return;const month=selectedLockMonth();const {data:users,error:uErr}=await sb.from('users').select('id').eq('status','active');if(uErr)return msg(uErr.message);const rows=(users||[]).map(u=>({salary_month:month,lock_month:month,user_id:u.id,locked_by:profile.id}));const {error}=await sb.from('month_locks').upsert(rows,{onConflict:'lock_month,user_id'});if(error)return msg(error.message);await logAction('Закрито місяць всім',month);msg('Місяць закрито');screenLocksLoad(window.currentLockMonth)}
async function closeMonthSelected(){const ids=[...document.querySelectorAll('input[name=lock_user]:checked')].map(x=>x.value);if(!ids.length)return msg('Оберіть хоча б одного працівника');const month=selectedLockMonth();const rows=ids.map(id=>({salary_month:month,lock_month:month,user_id:id,locked_by:profile.id}));const {error}=await sb.from('month_locks').upsert(rows,{onConflict:'lock_month,user_id'});if(error)return msg(error.message);await logAction('Закрито місяць вибраним',{month,count:ids.length});msg('Місяць закрито вибраним');screenLocksLoad(window.currentLockMonth)}

async function screenLeader(){const dir=profile.role==='admin'?null:profile.leader_direction;if(profile.role!=='admin'&&!dir)return screenEl().innerHTML='<h2>Мій напрямок</h2><p>Вам не призначено напрямок.</p>';let q=sb.from('work_days').select('*, users(full_name,callsign)').order('work_date',{ascending:false}).limit(250);if(dir)q=q.contains('directions',[dir]);const {data,error}=await q;screenEl().innerHTML=`<h2>${dir?'Звіти по напрямку: '+esc(dir):'Напрямки / всі записи'}</h2>`+(error?esc(error.message):tableDays(data||[],true))}
async function screenAudit(){screenEl().innerHTML='<h2>Журнал дій</h2><div id="audit_list">Завантаження...</div>';const {data,error}=await sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(250);const list=$('audit_list');if(error)return list.innerHTML=esc(error.message);if(!data?.length)return list.innerHTML='<p class="muted">Записів у журналі ще немає.</p>';const ids=[...new Set(data.map(x=>x.user_id).filter(Boolean))];let users=[];if(ids.length){const r=await sb.from('users').select('id,full_name,callsign').in('id',ids);users=r.data||[]}const map=Object.fromEntries(users.map(u=>[u.id,u]));list.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Дата</th><th>Користувач</th><th>Дія</th><th>Деталі</th></tr></thead><tbody>${data.map(a=>{const u=map[a.user_id]||{};return `<tr><td>${a.created_at?new Date(a.created_at).toLocaleString('uk-UA'):''}</td><td>${esc(u.full_name||'')} ${u.callsign?'('+esc(u.callsign)+')':''}</td><td>${esc(a.action||'')}</td><td><pre class="audit-details">${esc(formatAuditDetails(a.details))}</pre></td></tr>`}).join('')}</tbody></table></div>`}

init();
</script>
