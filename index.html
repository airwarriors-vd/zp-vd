en{background:#166534}.red{background:#991b1b}.yellow{background:#92400e}.checkrow{display:flex;flex-wrap:wrap;gap:8px}.checkrow label{background:#0b1220;border:1px solid #334155;border-radius:10px;padding:8px 10px;margin:0}.checkrow input{width:auto}.receipt-links a{display:inline-block;margin:2px 6px 2px 0;color:#93c5fd}.msg{position:fixed;right:18px;bottom:18px;background:#111827;border:1px solid #475569;color:white;border-radius:14px;padding:13px 16px;box-shadow:0 18px 55px rgba(0,0,0,.35);z-index:99}.audit-details{white-space:pre-wrap;margin:0;font-family:inherit;color:#dbeafe}.install{display:none}.no-print{display:block}hr{border:0;border-top:1px solid #334155;margin:18px 0}.hint{background:#0b1220;border:1px dashed #475569;border-radius:14px;padding:12px;margin:10px 0;color:#cbd5e1}.editrow input,.editrow select{min-width:120px}.nowrap{white-space:nowrap}

<script>
const SUPABASE_URL='https://gahbfqpkgnbezkfqkziy.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_xRk6B66TkytVRztLnOq6cQ_Zzn4awMW';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const directions=['Софт','FPV','Класика','БЗВП','Online'];
let me=null,profile=null,tab='dashboard',deferredInstallPrompt=null,employeeCache=[];
const app=document.getElementById('app');
const $=id=>document.getElementById(id);
const screenEl=()=>document.getElementById('screen');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(n){return (Number(n||0)).toLocaleString('uk-UA')+' грн'}
function ym(d=new Date()){return d.toISOString().slice(0,7)+'-01'}
function monthKey(d=new Date()){return (typeof d==='string'?d:new Date(d).toISOString()).slice(0,7)}
function selectedMonth(){const el=$('global_month');return (el?.value||localStorage.getItem('zpvd_month')||new Date().toISOString().slice(0,7))+'-01'}
function monthEnd(month){const [y,m]=month.slice(0,7).split('-').map(Number);return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10)}
function roleName(r){return r==='admin'?'Адмін':r==='leader'?'Старший групи':'Працівник'}
function statusName(s){return s==='dismissed'?'Звільнений':'Активний'}
function msg(t){const old=document.querySelector('.msg');if(old)old.remove();const el=document.createElement('div');el.className='msg';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),4200)}
function parseJsonMaybe(v){if(v&&typeof v==='object')return v;if(typeof v==='string'){try{return JSON.parse(v)}catch(e){return v}}return v}
function formatDayDetails(d){d=parseJsonMaybe(d)||{};return `Дата роботи: ${d.work_date||'—'}\nНапрямки: ${(d.directions||[d.direction].filter(Boolean)).join(', ')||'—'}\nПальне: ${Number(d.fuel||0)} грн\nАмортизація: ${Number(d.amortization||0)} грн\nПроживання: ${Number(d.accommodation||0)} грн${d.comment?`\nКоментар: ${d.comment}`:''}`}
function formatAuditDetails(details){const d=parseJsonMaybe(details);if(!d)return '';if(typeof d==='string')return d;if(d.old&&d.new)return `Було:\n${formatDayDetails(d.old)}\n\nСтало:\n${formatDayDetails(d.new)}`;if(d.work_date||d.directions||d.direction)return formatDayDetails(d);return JSON.stringify(d,null,2)}
async function logAction(action,details){try{await sb.from('audit_log').insert({user_id:profile?.id||null,action,details:details??''})}catch(e){}}

async function init(){
  if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;const b=$('installBtn');if(b)b.style.display='inline-block'});
  const {data:{session}}=await sb.auth.getSession();
  if(!session){renderLogin();return}
  me=session.user; await loadProfile();
  if(!profile){renderNoProfile();return}
  if(profile.status==='dismissed'||profile.employee_status==='dismissed'){app.innerHTML=`<div class="wrap"><div class="card login"><h1>Доступ закрито</h1><p>Ваш профіль має статус «Звільнений».</p><button onclick="logout()">Вийти</button></div></div>`;return}
  renderApp();
}
async function loadProfile(){
  const {data,error}=await sb.from('users').select('*').or(`auth_id.eq.${me.id},auth_user_id.eq.${me.id},email.eq.${me.email}`).limit(1).maybeSingle();
  profile=error?null:data;
}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}); if(error)return msg(error.message); init()}
async function logout(){await sb.auth.signOut(); me=null; profile=null; tab='dashboard'; renderLogin()}
function renderLogin(){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">ЗП-VD</h1><p class="muted">Вхід через email та пароль. Пристрій запам’ятовується автоматично.</p><label>Email</label><input id="email" type="email" placeholder="name@example.com"><label>Пароль</label><input id="password" type="password" placeholder="Пароль"><div style="height:14px"></div><button onclick="login()">Увійти</button></div></div>`}
function renderNoProfile(){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">Профіль не знайдено</h1><p>Ваш email авторизований, але профіль працівника ще не прив’язаний у таблиці <b>users</b>.</p><p class="muted">ID користувача Auth:</p><input readonly value="${esc(me.id)}"><p class="muted">Email:</p><input readonly value="${esc(me.email||'')}"><button onclick="logout()" class="secondary">Вийти</button></div></div>`}
function nav(){
  const items=[['dashboard','Головна'],['days','Робочі дні'],['payslip','Мій розрахунок'],['profile','Мій профіль']];
  if(profile.role==='admin')items.push(['employees','Працівники'],['adjustments','Коригування'],['reports','Звіти'],['locks','Закриття місяця'],['audit','Журнал']);
  if(profile.role==='leader')items.push(['leader','Мій напрямок']);
  return `<div class="nav no-print">${items.map(i=>`<button class="${tab===i[0]?'active':''}" onclick="tab='${i[0]}';renderApp()">${i[1]}</button>`).join('')}<button id="installBtn" class="install secondary" onclick="installApp()">Встановити</button><button onclick="logout()" class="secondary">Вийти</button></div>`
}
async function installApp(){if(!deferredInstallPrompt)return msg('Встановлення доступне через меню браузера');deferredInstallPrompt.prompt();deferredInstallPrompt=null}
async function renderApp(){
  app.innerHTML=`<div class="wrap"><div class="top no-print"><div><h1 class="title">ЗП-VD</h1><div class="muted">${esc(profile.full_name||'')} ${profile.callsign?'('+esc(profile.callsign)+')':''} · ${roleName(profile.role)}</div></div></div>${nav()}<div id="screen" class="card">Завантаження...</div></div>`;
  try{
    if(tab==='dashboard')await screenDashboard();
    if(tab==='days')await screenDays();
    if(tab==='payslip')await screenPayslip();
    if(tab==='profile')await screenProfile();
    if(tab==='employees')await screenEmployees();
    if(tab==='adjustments')await screenAdjustments();
    if(tab==='reports')await screenReports();
    if(tab==='locks')await screenLocks();
    if(tab==='leader')await screenLeader();
    if(tab==='audit')await screenAudit();
  }catch(e){screenEl().innerHTML=`<h2>Помилка</h2><p>${esc(e.message||e)}</p>`}
}

async function fetchUsers(){const {data,error}=await sb.from('users').select('*').order('full_name'); if(error)throw error; return data||[]}
async function fetchRates(userIds){
  if(!userIds.length)return [];
  const {data,error}=await sb.from('salary_rates_history').select('*').in('user_id',userIds).order('effective_from',{ascending:true});
  if(error){console.warn(error.message);return []}
  return data||[];
}
function rateForDate(user,date,rates){
  const list=(rates||[]).filter(r=>r.user_id===user.id && r.effective_from<=date).sort((a,b)=>String(a.effective_from).localeCompare(String(b.effective_from)));
  const r=list[list.length-1];
  return {daily_rate:Number(r?.daily_rate ?? user.daily_rate ?? 2500),employee_deduction:Number(r?.employee_deduction ?? user.employee_deduction ?? 48000)};
}
async function calcSummary(month,userFilter=null){
  const start=month.slice(0,7)+'-01', end=monthEnd(start);
  let users=await fetchUsers(); if(userFilter)users=users.filter(u=>u.id===userFilter);
  const ids=users.map(u=>u.id);
  let workQ=sb.from('work_days').select('*').gte('work_date',start).lte('work_date',end);
  if(userFilter)workQ=workQ.eq('user_id',userFilter);
  const {data:days,error:dayErr}=await workQ; if(dayErr)throw dayErr;
  let adjQ=sb.from('adjustments').select('*').eq('adjustment_month',start);
  if(userFilter)adjQ=adjQ.eq('user_id',userFilter);
  const {data:adjs,error:adjErr}=await adjQ; if(adjErr)throw adjErr;
  const rates=await fetchRates(ids);
  return users.map(u=>{
    const d=(days||[]).filter(x=>x.user_id===u.id);
    const a=(adjs||[]).filter(x=>x.user_id===u.id);
    let base=0,fuel=0,amort=0,acc=0;
    d.forEach(x=>{base+=rateForDate(u,x.work_date,rates).daily_rate; fuel+=Number(x.fuel||0); amort+=Number(x.amortization||0); acc+=Number(x.accommodation||0)});
    const eff=rateForDate(u,end,rates);
    const deduction=(u.employment_type==='employee')?eff.employee_deduction:0;
    const bonus=a.filter(x=>x.type==='bonus').reduce((s,x)=>s+Number(x.amount||0),0);
    const fine=a.filter(x=>x.type==='fine'||x.type==='penalty').reduce((s,x)=>s+Number(x.amount||0),0);
    return {user_id:u.id,full_name:u.full_name,callsign:u.callsign,email:u.email,employment_type:u.employment_type,status:u.status,work_days_count:d.length,daily_rate:eff.daily_rate,employee_deduction:deduction,base_salary:base,fuel_total:fuel,amortization_total:amort,accommodation_total:acc,adjustments_total:bonus-fine,bonus_total:bonus,fine_total:fine,total_to_pay:base+fuel+amort+acc+bonus-fine-deduction,salary_month:start};
  }).filter(r=>r.work_days_count||r.adjustments_total||!userFilter);
}

async function screenDashboard(){
  const m=ym();
  const summary=await calcSummary(m,profile.role==='admin'?null:profile.id);
  let q=sb.from('work_days').select('id',{count:'exact',head:true}).gte('work_date',m).lte('work_date',monthEnd(m));
  if(profile.role!=='admin')q=q.eq('user_id',profile.id);
  const {count}=await q;
  const total=summary.reduce((s,r)=>s+Number(r.total_to_pay||0),0);
  const active=(profile.role==='admin')?(await fetchUsers()).filter(u=>u.status!=='dismissed').length:1;
  screenEl().innerHTML=`<h2>Головна</h2><div class="grid-cards"><div class="stat"><span class="muted">Місяць</span><br><b>${m.slice(0,7)}</b></div><div class="stat"><span class="muted">Працівників</span><br><b>${active}</b></div><div class="stat"><span class="muted">Робочих записів</span><br><b>${count||0}</b></div><div class="stat"><span class="muted">До виплати</span><br><b>${fmt(total)}</b></div></div>`;
}

function receiptInputs(){return `<div class="col-4"><label>Фото чека пальне</label><input id="fuel_receipt" type="file" accept="image/*,application/pdf"></div><div class="col-4"><label>Фото чека проживання</label><input id="acc_receipt" type="file" accept="image/*,application/pdf"></div><div class="col-4"><label>Інше підтвердження</label><input id="other_receipt" type="file" accept="image/*,application/pdf"></div>`}
async function uploadReceipt(inputId,prefix){
  const f=$(inputId)?.files?.[0]; if(!f)return null;
  const ext=(f.name.split('.').pop()||'jpg').toLowerCase();
  const path=`${profile.id}/${Date.now()}-${prefix}.${ext}`;
  const {error}=await sb.storage.from('receipts').upload(path,f,{upsert:true});
  if(error){msg('Помилка завантаження чека: '+error.message);return null}
  const {data}=sb.storage.from('receipts').getPublicUrl(path);
  return data.publicUrl;
}
async function screenDays(){
  screenEl().innerHTML=`<h2>Робочі дні</h2><div class="row"><div class="col-4"><label>Дата</label><input id="wd_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="col-8"><label>Напрямки</label><div class="checkrow">${directions.map(d=>`<label><input type="checkbox" name="dir" value="${d}"> ${d}</label>`).join('')}</div></div><div class="col-4"><label>Пальне</label><input id="fuel" type="number" value="0"></div><div class="col-4"><label>Амортизація</label><input id="amort" type="number" value="0"></div><div class="col-4"><label>Проживання</label><input id="acc" type="number" value="0"></div>${receiptInputs()}<div class="col-12"><label>Коментар</label><textarea id="comment"></textarea></div><div class="col-12"><button onclick="saveDay()">Зберегти день</button></div></div><hr><div id="mydays">Завантаження...</div>`;
  await loadDays();
}
async function isMonthLocked(userId,dateStr){
  const month=dateStr.slice(0,7)+'-01';
  const {data,error}=await sb.from('month_locks').select('id').eq('user_id',userId).eq('lock_month',month).maybeSingle();
  if(error){msg(error.message);return true} return !!data;
}
async function saveDay(){
  const ds=[...document.querySelectorAll('input[name=dir]:checked')].map(x=>x.value); if(!ds.length)return msg('Оберіть хоча б один напрямок');
  const locked=await isMonthLocked(profile.id,$('wd_date').value); if(locked)return msg('Цей місяць закрито. Редагування недоступне.');
  const old=(await sb.from('work_days').select('*').eq('user_id',profile.id).eq('work_date',$('wd_date').value).maybeSingle()).data;
  const fuelUrl=await uploadReceipt('fuel_receipt','fuel'), accUrl=await uploadReceipt('acc_receipt','acc'), otherUrl=await uploadReceipt('other_receipt','other');
  const rec={user_id:profile.id,work_date:$('wd_date').value,directions:ds,direction:ds[0],fuel:+$('fuel').value||0,amortization:+$('amort').value||0,accommodation:+$('acc').value||0,comment:$('comment').value||''};
  if(fuelUrl)rec.fuel_receipt_url=fuelUrl; if(accUrl)rec.accommodation_receipt_url=accUrl; if(otherUrl)rec.other_receipt_url=otherUrl;
  const {data,error}=await sb.from('work_days').upsert(rec,{onConflict:'user_id,work_date'}).select('*').single();
  if(error)return msg(error.message);
  await logAction(old?'updated':'created',old?{old,new:data}:data);
  msg('Збережено'); await screenDays();
}
function receiptLinks(r){const links=[]; if(r.fuel_receipt_url)links.push(`<a href="${esc(r.fuel_receipt_url)}" target="_blank">Пальне</a>`); if(r.accommodation_receipt_url)links.push(`<a href="${esc(r.accommodation_receipt_url)}" target="_blank">Проживання</a>`); if(r.other_receipt_url)links.push(`<a href="${esc(r.other_receipt_url)}" target="_blank">Інше</a>`); return links.length?`<div class="receipt-links">${links.join('')}</div>`:'—'}
async function loadDays(){const {data,error}=await sb.from('work_days').select('*').eq('user_id',profile.id).order('work_date',{ascending:false}).limit(90); if(error)return $('mydays').innerHTML=error.message; $('mydays').innerHTML=tableDays(data||[],false)}
function tableDays(rows,showUser){if(!rows.length)return '<p class="muted">Записів немає</p>'; return `<div class="table-wrap"><table><thead><tr>${showUser?'<th>Працівник</th>':''}<th>Дата</th><th>Напрямки</th><th>Витрати</th><th>Чеки</th><th>Подано</th></tr></thead><tbody>${rows.map(r=>`<tr>${showUser?`<td>${esc(r.users?.full_name||r.full_name||'')}</td>`:''}<td>${r.work_date}</td><td>${(r.directions||[r.direction]).filter(Boolean).map(d=>`<span class="pill blue">${esc(d)}</span>`).join('')}</td><td>${fmt((+r.fuel||0)+(+r.amortization||0)+(+r.accommodation||0))}</td><td>${receiptLinks(r)}</td><td>${r.created_at?new Date(r.created_at).toLocaleString('uk-UA'):''}</td></tr>`).join('')}</tbody></table></div>`}

async function screenProfile(){
  screenEl().innerHTML=`<h2>Мій профіль</h2><div class="row"><div class="col-6"><label>ПІБ</label><input value="${esc(profile.full_name||'')}" disabled></div><div class="col-6"><label>Позивний</label><input value="${esc(profile.callsign||'')}" disabled></div><div class="col-4"><label>Телефон</label><input id="p_phone" value="${esc(profile.phone||'')}"></div><div class="col-4"><label>Email</label><input id="p_email" type="email" value="${esc(profile.email||me.email||'')}"></div><div class="col-4"><label>Дата народження</label><input id="p_birth" type="date" value="${profile.birth_date||''}"></div><div class="col-4"><label>Нагадування</label><select id="p_rem_enabled"><option value="true" ${profile.reminder_enabled!==false?'selected':''}>Увімкнено</option><option value="false" ${profile.reminder_enabled===false?'selected':''}>Вимкнено</option></select></div><div class="col-4"><label>Частота</label><select id="p_rem_freq"><option value="daily" ${profile.reminder_frequency==='daily'?'selected':''}>Щодня</option><option value="weekly" ${profile.reminder_frequency!=='daily'&&profile.reminder_frequency!=='monthly'?'selected':''}>Щотижня</option><option value="monthly" ${profile.reminder_frequency==='monthly'?'selected':''}>Щомісяця</option></select></div><div class="col-4"><label>Час</label><input id="p_rem_time" type="time" value="${profile.reminder_time||'18:00'}"></div><div class="col-12"><button onclick="saveProfile()">Зберегти профіль</button></div></div><hr><h3>Зміна пароля</h3><div class="row"><div class="col-6"><label>Новий пароль</label><input id="new_pass" type="password"></div><div class="col-6"><label>Повторіть пароль</label><input id="new_pass2" type="password"></div><div class="col-12"><button onclick="changePassword()">Змінити пароль</button></div></div>`
}
async function saveProfile(){const updates={phone:$('p_phone').value||null,email:$('p_email').value||null,birth_date:$('p_birth').value||null,reminder_enabled:$('p_rem_enabled').value==='true',reminder_frequency:$('p_rem_freq').value,reminder_time:$('p_rem_time').value}; const {error}=await sb.from('users').update(updates).eq('id',profile.id); if(error)return msg(error.message); Object.assign(profile,updates); msg('Профіль оновлено')}
async function changePassword(){const p1=$('new_pass').value,p2=$('new_pass2').value;if(!p1||!p2)return msg('Введіть пароль двічі'); if(p1!==p2)return msg('Паролі не співпадають'); const {error}=await sb.auth.updateUser({password:p1}); if(error)return msg(error.message); msg('Пароль змінено');$('new_pass').value='';$('new_pass2').value=''}

async function screenEmployees(){
  if(profile.role!=='admin')return screenEl().innerHTML='Немає доступу';
  screenEl().innerHTML=`<h2>Працівники</h2><div class="hint">Для зміни ставки або утримання вкажіть дату <b>«Діє з»</b>. Старі місяці не будуть перераховані новою ставкою.</div><div class="row"><div class="col-3"><label>ПІБ</label><input id="e_full"></div><div class="col-3"><label>Позивний</label><input id="e_call"></div><div class="col-3"><label>Email</label><input id="e_email" type="email"></div><div class="col-3"><label>Пароль для входу</label><input id="e_password" type="text" placeholder="Напр. vd2026"></div><div class="col-3"><label>Телефон</label><input id="e_phone"></div><div class="col-3"><label>Дата народження</label><input id="e_birth" type="date"></div><div class="col-3"><label>Статус</label><select id="e_emp"><option value="employee">Працевлаштований</option><option value="freelancer">Фрілансер</option></select></div><div class="col-3"><label>Стан</label><select id="e_status"><option value="active">Активний</option><option value="dismissed">Звільнений</option></select></div><div class="col-3"><label>Роль</label><select id="e_role"><option value="user">Працівник</option><option value="leader">Старший групи</option><option value="admin">Адмін</option></select></div><div class="col-3"><label>Напрямок старшого</label><select id="e_leader"><option value="">—</option>${directions.map(d=>`<option>${d}</option>`).join('')}</select></div><div class="col-12"><button onclick="addEmployee()">Додати профіль</button></div></div><hr><div id="emps">Завантаження...</div>`;
  await loadEmployees();
}
async function addEmployee(){const rec={full_name:$('e_full').value.trim(),callsign:$('e_call').value.trim(),email:$('e_email').value.trim(),password:$('e_password').value.trim(),phone:$('e_phone').value||null,birth_date:$('e_birth').value||null,employment_type:$('e_emp').value,status:$('e_status').value,role:$('e_role').value,leader_direction:$('e_leader').value||null}; if(!rec.full_name||!rec.email||!rec.password)return msg('Заповніть ПІБ, email і пароль'); const resp=await fetch('/api/create-employee',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)}); const data=await resp.json().catch(()=>({error:'Невідома помилка'})); if(!resp.ok)return msg(data.error||'Помилка створення'); await logAction('Створив працівника',rec.full_name); msg('Працівника створено автоматично: Auth + профіль users'); await screenEmployees()}
async function loadEmployees(){
  const users=await fetchUsers(); employeeCache=users;
  $('emps').innerHTML=`<div class="table-wrap"><table><thead><tr><th>ПІБ</th><th>Позивний</th><th>Email</th><th>Телефон</th><th>Роль</th><th>Статус</th><th>Стан</th><th>Ставка</th><th>Утримання</th><th>Діє з</th><th></th></tr></thead><tbody>${users.map(u=>`<tr class="editrow"><td><input id="u_full_${u.id}" value="${esc(u.full_name||'')}"></td><td><input id="u_call_${u.id}" value="${esc(u.callsign||'')}"></td><td><input id="u_email_${u.id}" value="${esc(u.email||'')}"></td><td><input id="u_phone_${u.id}" value="${esc(u.phone||'')}"></td><td><select id="u_role_${u.id}"><option value="user" ${u.role==='user'?'selected':''}>Працівник</option><option value="leader" ${u.role==='leader'?'selected':''}>Старший</option><option value="admin" ${u.role==='admin'?'selected':''}>Адмін</option></select><label class="muted">Напрямок</label><select id="u_leader_${u.id}"><option value="">—</option>${directions.map(d=>`<option value="${d}" ${u.leader_direction===d?'selected':''}>${d}</option>`).join('')}</select></td><td><select id="u_emp_${u.id}"><option value="employee" ${u.employment_type==='employee'?'selected':''}>Працевлаштований</option><option value="freelancer" ${u.employment_type!=='employee'?'selected':''}>Фрілансер</option></select></td><td><select id="u_status_${u.id}"><option value="active" ${u.status!=='dismissed'?'selected':''}>Активний</option><option value="dismissed" ${u.status==='dismissed'?'selected':''}>Звільнений</option></select></td><td><input id="u_rate_${u.id}" type="number" value="${Number(u.daily_rate||2500)}"></td><td><input id="u_ded_${u.id}" type="number" value="${Number(u.employee_deduction||48000)}"></td><td><input id="u_eff_${u.id}" type="date" value="${new Date().toISOString().slice(0,10)}"><span class="muted">для ставки/утримання</span></td><td><button class="small" onclick="saveEmployeeEdit('${u.id}')">Зберегти</button></td></tr>`).join('')}</tbody></table></div>`;
}
async function saveEmployeeEdit(id){
  const old=employeeCache.find(u=>u.id===id)||{};
  const newRate=Number($(`u_rate_${id}`).value||2500), newDed=Number($(`u_ded_${id}`).value||48000), eff=$(`u_eff_${id}`).value;
  const updates={full_name:$(`u_full_${id}`).value.trim(),callsign:$(`u_call_${id}`).value.trim(),email:$(`u_email_${id}`).value.trim(),phone:$(`u_phone_${id}`).value||null,role:$(`u_role_${id}`).value,leader_direction:$(`u_role_${id}`).value==='leader'?($(`u_leader_${id}`).value||null):null,employment_type:$(`u_emp_${id}`).value,status:$(`u_status_${id}`).value,employee_status:$(`u_status_${id}`).value,daily_rate:newRate,employee_deduction:newDed};
  if(!updates.full_name)return msg('ПІБ не може бути порожнім');
  const rateChanged=Number(old.daily_rate||2500)!==newRate || Number(old.employee_deduction||48000)!==newDed;
  if(rateChanged && !eff)return msg('Вкажіть дату «Діє з» для ставки/утримання');
  const {error}=await sb.from('users').update(updates).eq('id',id); if(error)return msg(error.message);
  if(rateChanged){
    const {error:rhErr}=await sb.from('salary_rates_history').upsert({user_id:id,effective_from:eff,daily_rate:newRate,employee_deduction:newDed,created_by:profile.id},{onConflict:'user_id,effective_from'});
    if(rhErr)return msg('Працівника оновлено, але історія ставки не записалась: '+rhErr.message);
    await logAction('Змінив ставку/утримання',`Працівник: ${updates.full_name}\nДіє з: ${eff}\nСтавка: ${Number(old.daily_rate||2500)} → ${newRate}\nУтримання: ${Number(old.employee_deduction||48000)} → ${newDed}`);
  }else await logAction('Оновив працівника',updates.full_name);
  msg('Працівника оновлено'); await loadEmployees();
}

async function screenAdjustments(){
  const users=(await fetchUsers()).filter(u=>u.status!=='dismissed'); const m=ym();
  screenEl().innerHTML=`<h2>Коригування</h2><div class="row"><div class="col-3"><label>Місяць</label><input id="adj_month" type="month" value="${m.slice(0,7)}" onchange="loadAdjustments()"></div><div class="col-3"><label>Працівник</label><select id="adj_user">${users.map(u=>`<option value="${u.id}">${esc(u.full_name)} ${u.callsign?'('+esc(u.callsign)+')':''}</option>`).join('')}</select></div><div class="col-2"><label>Тип</label><select id="adj_type"><option value="bonus">Премія</option><option value="fine">Штраф</option></select></div><div class="col-2"><label>Сума</label><input id="adj_amount" type="number" value="0"></div><div class="col-12"><label>Коментар</label><textarea id="adj_comment"></textarea></div><div class="col-12"><button onclick="addAdjustment()">Додати коригування</button></div></div><hr><h3>Коригування за місяць</h3><div id="adj_list">Завантаження...</div>`;
  await loadAdjustments();
}
function adjustmentMonth(){return ($('adj_month')?.value||new Date().toISOString().slice(0,7))+'-01'}
async function addAdjustment(){const rec={user_id:$('adj_user').value,adjustment_month:adjustmentMonth(),type:$('adj_type').value,amount:+$('adj_amount').value||0,comment:$('adj_comment').value||'',title:$('adj_comment').value||'',created_by:profile.id}; if(!rec.amount)return msg('Вкажіть суму'); const {error}=await sb.from('adjustments').insert(rec); if(error)return msg(error.message); await logAction(rec.type==='bonus'?'Додав премію':'Додав штраф',`${rec.amount} грн. ${rec.comment}`); msg('Коригування додано'); await loadAdjustments()}
async function loadAdjustments(){
  const adjList=$('adj_list'); if(!adjList)return; const month=adjustmentMonth();
  const {data,error}=await sb.from('adjustments').select('*').eq('adjustment_month',month).order('created_at',{ascending:false}); if(error)return adjList.innerHTML=error.message;
  if(!data||!data.length)return adjList.innerHTML='<p class="muted">Коригувань за цей місяць немає.</p>';
  const users=await fetchUsers(); const map=Object.fromEntries(users.map(u=>[u.id,u]));
  adjList.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Працівник</th><th>Тип</th><th>Сума</th><th>Коментар</th><th>Дата</th><th></th></tr></thead><tbody>${data.map(a=>{const u=map[a.user_id]||{};return `<tr><td>${esc(u.full_name||'')} ${u.callsign?'('+esc(u.callsign)+')':''}</td><td>${a.type==='bonus'?'<span class="pill green">Премія</span>':'<span class="pill red">Штраф</span>'}</td><td>${fmt(a.amount)}</td><td>${esc(a.comment||a.title||'')}</td><td>${a.created_at?new Date(a.created_at).toLocaleString('uk-UA'):''}</td><td><button class="danger small" onclick="deleteAdjustment('${a.id}')">Видалити</button></td></tr>`}).join('')}</tbody></table></div>`;
}
async function deleteAdjustment(id){if(!confirm('Видалити коригування?'))return; const {error}=await sb.from('adjustments').delete().eq('id',id); if(error)return msg(error.message); await logAction('Видалив коригування',id); await loadAdjustments()}

async function screenReports(){
  const m=selectedMonth();
  screenEl().innerHTML=`<h2>Звіти</h2><div class="row no-print"><div class="col-3"><label>Місяць</label><input id="global_month" type="month" value="${m.slice(0,7)}" onchange="localStorage.setItem('zpvd_month',this.value);screenReports()"></div><div class="col-12"><button onclick="exportSalaryExcel()">Експорт Excel</button></div></div><div id="reports_area">Завантаження...</div>`;
  const rows=await calcSummary(m);
  $('reports_area').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Місяць</th><th>ПІБ</th><th>Днів</th><th>Ставка актуальна</th><th>Зарплата</th><th>Витрати</th><th>Коригування</th><th>Утримання</th><th>До виплати</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.salary_month}</td><td>${esc(r.full_name)} ${r.callsign?'('+esc(r.callsign)+')':''}</td><td>${r.work_days_count}</td><td>${fmt(r.daily_rate)}</td><td>${fmt(r.base_salary)}</td><td>${fmt(r.fuel_total+r.amortization_total+r.accommodation_total)}</td><td>${fmt(r.adjustments_total)}</td><td>${fmt(r.employee_deduction)}</td><td><b>${fmt(r.total_to_pay)}</b></td></tr>`).join('')}</tbody></table></div>`;
}
async function exportSalaryExcel(){const rows=await calcSummary(selectedMonth()); if(!rows.length)return msg('Немає даних для експорту'); const data=[['Місяць','ПІБ','Позивний','Днів','Ставка актуальна','Зарплата','Пальне','Амортизація','Проживання','Премії/штрафи','Утримання','До виплати'],...rows.map(r=>[r.salary_month,r.full_name,r.callsign||'',r.work_days_count,r.daily_rate,r.base_salary,r.fuel_total,r.amortization_total,r.accommodation_total,r.adjustments_total,r.employee_deduction,r.total_to_pay])]; const csv=data.map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n'); const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}); const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download='zp-vd-zvit.csv'; link.click()}

async function screenPayslip(){
  const m=selectedMonth();
  screenEl().innerHTML=`<h2>Мій розрахунок</h2><div class="row no-print"><div class="col-3"><label>Місяць</label><input id="global_month" type="month" value="${m.slice(0,7)}" onchange="localStorage.setItem('zpvd_month',this.value);screenPayslip()"></div><div class="col-12"><button onclick="window.print()">Друк / PDF</button></div></div><div id="payslip_area">Завантаження...</div>`;
  const rows=await calcSummary(m,profile.id); const r=rows[0];
  if(!r)return $('payslip_area').innerHTML='<p class="muted">За цей місяць розрахунку ще немає.</p>';
  $('payslip_area').innerHTML=`<div class="grid-cards"><div class="stat"><span class="muted">Робочих днів</span><br><b>${r.work_days_count}</b></div><div class="stat"><span class="muted">Зарплата</span><br><b>${fmt(r.base_salary)}</b></div><div class="stat"><span class="muted">Витрати</span><br><b>${fmt(r.fuel_total+r.amortization_total+r.accommodation_total)}</b></div><div class="stat"><span class="muted">До виплати</span><br><b>${fmt(r.total_to_pay)}</b></div></div><hr><table><tbody><tr><th>ПІБ</th><td>${esc(r.full_name)}</td></tr><tr><th>Місяць</th><td>${r.salary_month}</td></tr><tr><th>Актуальна ставка</th><td>${fmt(r.daily_rate)}</td></tr><tr><th>Основна зарплата</th><td>${fmt(r.base_salary)}</td></tr><tr><th>Пальне</th><td>${fmt(r.fuel_total)}</td></tr><tr><th>Амортизація</th><td>${fmt(r.amortization_total)}</td></tr><tr><th>Проживання</th><td>${fmt(r.accommodation_total)}</td></tr><tr><th>Премії / штрафи</th><td>${fmt(r.adjustments_total)}</td></tr><tr><th>Утримання</th><td>${fmt(r.employee_deduction)}</td></tr><tr><th>До виплати</th><td><b>${fmt(r.total_to_pay)}</b></td></tr></tbody></table>`;
}

async function screenLocks(){
  const m=selectedMonth();
  screenEl().innerHTML=`<h2>Закриття місяця</h2><div class="row"><div class="col-3"><label>Оберіть місяць</label><input id="global_month" type="month" value="${m.slice(0,7)}" onchange="localStorage.setItem('zpvd_month',this.value);screenLocks()"></div></div><div id="locks_area">Завантаження...</div>`;
  const users=(await fetchUsers()).filter(u=>u.status!=='dismissed');
  const {data:locks,error}=await sb.from('month_locks').select('*').eq('lock_month',m); if(error)return $('locks_area').innerHTML=error.message;
  const locked=new Set((locks||[]).map(l=>l.user_id));
  $('locks_area').innerHTML=`<button onclick="closeMonthAll()">Закрити цей місяць всім</button><hr><h3>Закрити вибраним</h3><div class="checkrow">${users.map(u=>`<label><input type="checkbox" name="lock_user" value="${u.id}"> ${esc(u.full_name)} ${u.callsign?'('+esc(u.callsign)+')':''} ${locked.has(u.id)?'🔒':''}</label>`).join('')}</div><div style="height:14px"></div><button onclick="closeMonthSelected()">Закрити вибраним</button><hr><h3>Закриті за місяць</h3>${locks?.length?`<table><tbody>${locks.map(l=>{const u=users.find(x=>x.id===l.user_id)||{};return `<tr><td>${esc(u.full_name||l.user_id)}</td><td>${l.locked_at?new Date(l.locked_at).toLocaleString('uk-UA'):''}</td></tr>`}).join('')}</tbody></table>`:'<p class="muted">Немає закриттів.</p>'}`;
}
async function closeMonthAll(){if(!confirm('Закрити місяць всім активним працівникам?'))return; const m=selectedMonth(); const users=(await fetchUsers()).filter(u=>u.status!=='dismissed'); const rows=users.map(u=>({lock_month:m,salary_month:m,user_id:u.id,locked_by:profile.id})); const {error}=await sb.from('month_locks').upsert(rows,{onConflict:'lock_month,user_id'}); if(error)return msg(error.message); await logAction('Закрив місяць всім',m); msg('Місяць закрито'); screenLocks()}
async function closeMonthSelected(){const ids=[...document.querySelectorAll('input[name=lock_user]:checked')].map(x=>x.value); if(!ids.length)return msg('Оберіть працівників'); const m=selectedMonth(); const rows=ids.map(id=>({lock_month:m,salary_month:m,user_id:id,locked_by:profile.id})); const {error}=await sb.from('month_locks').upsert(rows,{onConflict:'lock_month,user_id'}); if(error)return msg(error.message); await logAction('Закрив місяць вибраним',`${m}: ${ids.length}`); msg('Місяць закрито вибраним'); screenLocks()}

async function screenLeader(){const dir=profile.leader_direction; if(!dir)return screenEl().innerHTML='<h2>Мій напрямок</h2><p>Вам не призначено напрямок.</p>'; const {data,error}=await sb.from('work_days').select('*, users(full_name,callsign)').contains('directions',[dir]).order('work_date',{ascending:false}).limit(200); screenEl().innerHTML=`<h2>Звіти по напрямку: ${esc(dir)}</h2>`+(error?error.message:tableDays(data||[],true))}
async function screenAudit(){const {data,error}=await sb.from('audit_log').select('*, users(full_name,callsign)').order('created_at',{ascending:false}).limit(200); if(error)return screenEl().innerHTML=error.message; screenEl().innerHTML=`<h2>Журнал</h2><div class="table-wrap"><table><thead><tr><th>Дата</th><th>Користувач</th><th>Дія</th><th>Деталі</th></tr></thead><tbody>${(data||[]).map(r=>`<tr><td class="nowrap">${new Date(r.created_at).toLocaleString('uk-UA')}</td><td>${esc(r.users?.full_name||'')} ${r.users?.callsign?'('+esc(r.users.callsign)+')':''}</td><td>${esc(r.action)}</td><td><pre class="audit-details">${esc(formatAuditDetails(r.details))}</pre></td></tr>`).join('')}</tbody></table></div>`}

init();
</script>
