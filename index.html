<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ЗП-VD</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#16a34a;--brand2:#0f766e;--danger:#dc2626;--blue:#2563eb;--amber:#d97706}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:1180px;margin:0 auto;padding:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
    .login{max-width:430px;margin:9vh auto}.title{margin:0 0 6px;font-size:34px}.muted{color:var(--muted);font-size:14px} label{display:block;font-weight:700;font-size:13px;margin:10px 0 6px}
    input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px} textarea{min-height:90px}
    input:disabled,textarea:disabled,select:disabled{background:#f1f5f9;color:#64748b}
    button{border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer}button:hover{filter:brightness(.96)}button.secondary{background:#e2e8f0;color:#0f172a}button.danger{background:var(--danger)}button.blue{background:var(--blue)}button:disabled{opacity:.5;cursor:not-allowed}
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.nav button{background:#e2e8f0;color:#0f172a}.nav button.active{background:var(--text);color:#fff}
    .row{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-6{grid-column:span 6}.col-4{grid-column:span 4}.col-3{grid-column:span 3}.col-2{grid-column:span 2}
    @media(max-width:800px){.col-2,.col-3,.col-4,.col-6,.col-8{grid-column:span 12}.wrap{padding:14px}.title{font-size:28px}}
    table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{font-size:13px;color:var(--muted)}
    .table-wrap{overflow-x:auto}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e2e8f0;margin:2px;font-size:12px;font-weight:800}.pill.blue{background:#dbeafe;color:#1d4ed8}.pill.green{background:#dcfce7;color:#15803d}.pill.red{background:#fee2e2;color:#b91c1c}.pill.amber{background:#fef3c7;color:#92400e}
    .grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.stat b{font-size:22px}.checkrow{display:flex;flex-wrap:wrap;gap:10px}.checkrow label{font-weight:600;border:1px solid var(--line);padding:9px 12px;border-radius:12px;margin:0;background:#fff}.checkrow input{width:auto}.hr,hr{border:0;border-top:1px solid var(--line);margin:18px 0}.msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;z-index:9;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.2)}
    .audit-details{white-space:pre-wrap;margin:0;font-family:inherit;font-size:13px;line-height:1.35}.locked{color:#b45309;font-weight:800}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL='https://gahbfqpkgnbezkfqkziy.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_xRk6B66TkytVRztLnOq6cQ_Zzn4awMW';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const app=document.getElementById('app');
let me=null, profile=null, tab='dashboard';
const directions=['Софт','FPV','Класика','БЗВП','Online'];

function ym(d=new Date()){return d.toISOString().slice(0,7)+'-01'}
function monthEnd(m){const [y,mo]=m.slice(0,7).split('-').map(Number);return new Date(Date.UTC(y,mo,0)).toISOString().slice(0,10)}
function fmt(n){return (Number(n||0)).toLocaleString('uk-UA')+' грн'}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function msg(t){let el=document.createElement('div');el.className='msg';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),3600)}
function roleName(r){return r==='admin'?'Адмін':r==='leader'?'Старший групи':'Працівник'}

async function init(){const {data}=await sb.auth.getSession();me=data.session?.user||null;if(!me)return renderLogin();await loadProfile()}
async function loadProfile(){const {data,error}=await sb.from('users').select('*').eq('auth_id',me.id).maybeSingle();if(error){msg(error.message);return renderNoProfile()}profile=data;if(!profile)return renderNoProfile();renderApp()}
function renderLogin(){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">ЗП-VD</h1><p class="muted">Вхід через email та пароль. Пристрій запам’ятовується автоматично.</p><label>Email</label><input id="email" type="email" placeholder="name@example.com"><label>Пароль</label><input id="password" type="password" placeholder="Пароль"><div style="height:14px"></div><button onclick="login()">Увійти</button></div></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return msg(error.message);const {data}=await sb.auth.getUser();me=data.user;await loadProfile()}
async function logout(){await sb.auth.signOut();me=null;profile=null;tab='dashboard';renderLogin()}
function renderNoProfile(){app.innerHTML=`<div class="wrap"><div class="card login"><h1 class="title">Профіль не знайдено</h1><p>Ваш email авторизований, але профіль працівника ще не прив’язаний у таблиці <b>users</b>.</p><p class="muted">ID користувача Auth:</p><input readonly value="${me.id}"><p class="muted">Email:</p><input readonly value="${me.email||''}"><button onclick="logout()" class="secondary">Вийти</button></div></div>`}

function nav(){
  const items=[['dashboard','Головна'],['days','Робочі дні'],['profile','Мій профіль']];
  if(profile.role==='admin')items.push(['employees','Працівники'],['reports','Звіти'],['adjustments','Коригування'],['locks','Закриття місяця'],['audit','Журнал']);
  if(profile.role==='leader')items.push(['leader','Мій напрямок']);
  return `<div class="nav">${items.map(i=>`<button class="${tab===i[0]?'active':''}" onclick="tab='${i[0]}';renderApp()">${i[1]}</button>`).join('')}<button onclick="logout()" class="secondary">Вийти</button></div>`
}
async function renderApp(){
  app.innerHTML=`<div class="wrap"><div class="top"><div><h1 class="title">ЗП-VD</h1><div class="muted">${profile.full_name||''} ${profile.callsign?'('+profile.callsign+')':''} · ${roleName(profile.role)}</div></div></div>${nav()}<div id="screen" class="card">Завантаження...</div></div>`;
  if(tab==='dashboard')screenDashboard();
  if(tab==='days')screenDays();
  if(tab==='profile')screenProfile();
  if(tab==='employees')screenEmployees();
  if(tab==='reports')screenReports();
  if(tab==='adjustments')screenAdjustments();
  if(tab==='locks')screenLocks();
  if(tab==='audit')screenAudit();
  if(tab==='leader')screenLeader();
}
function screenEl(){return document.getElementById('screen')}

async function screenDashboard(){
  const m=ym();let q=sb.from('salary_summary').select('*').eq('salary_month',m); if(profile.role!=='admin')q=q.eq('user_id',profile.id);
  const {data,error}=await q; if(error)return screenEl().innerHTML=error.message;
  const rows=data||[]; const total=rows.reduce((s,r)=>s+Number(r.total_to_pay||0),0); const days=rows.reduce((s,r)=>s+Number(r.work_days_count||0),0);
  screenEl().innerHTML=`<h2>Головна</h2><div class="grid-cards"><div class="stat"><span class="muted">Місяць</span><br><b>${m.slice(0,7)}</b></div><div class="stat"><span class="muted">Днів</span><br><b>${days}</b></div><div class="stat"><span class="muted">До виплати</span><br><b>${fmt(total)}</b></div><div class="stat"><span class="muted">Роль</span><br><b>${roleName(profile.role)}</b></div></div>`
}

async function isMonthLocked(userId,dateStr){const month=dateStr.slice(0,7)+'-01'; const {data,error}=await sb.from('month_locks').select('id').eq('user_id',userId).eq('lock_month',month).maybeSingle(); if(error){msg(error.message);return true} return !!data}
async function screenDays(){
  screenEl().innerHTML=`<h2>Робочі дні</h2><div id="lock_warn"></div><div class="row"><div class="col-4"><label>Дата</label><input id="wd_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="col-8"><label>Напрямки</label><div class="checkrow">${directions.map(d=>`<label><input type="checkbox" name="dir" value="${d}"> ${d}</label>`).join('')}</div></div><div class="col-4"><label>Пальне</label><input id="fuel" type="number" value="0"></div><div class="col-4"><label>Амортизація</label><input id="amort" type="number" value="0"></div><div class="col-4"><label>Проживання</label><input id="acc" type="number" value="0"></div><div class="col-12"><label>Коментар</label><textarea id="comment"></textarea></div><div class="col-12"><button onclick="saveDay()">Зберегти день</button></div></div><hr><div id="mydays">Завантаження...</div>`;
  loadDays();
}
async function saveDay(){
  const locked=await isMonthLocked(profile.id,wd_date.value); if(locked)return msg('Цей місяць закрито. Редагування недоступне.');
  const ds=[...document.querySelectorAll('input[name=dir]:checked')].map(x=>x.value); if(!ds.length)return msg('Оберіть хоча б один напрямок');
  const rec={user_id:profile.id,work_date:wd_date.value,directions:ds,direction:ds[0],fuel:+fuel.value||0,amortization:+amort.value||0,accommodation:+acc.value||0,comment:comment.value||'',submitted_at:new Date().toISOString(),updated_at:new Date().toISOString()};
  const {error}=await sb.from('work_days').upsert(rec,{onConflict:'user_id,work_date'}); if(error)return msg(error.message);
  await logAction('Збережено робочий день',rec); msg('Збережено'); screenDays();
}
async function loadDays(){const {data,error}=await sb.from('work_days').select('*').eq('user_id',profile.id).order('work_date',{ascending:false}).limit(90); if(error)return document.getElementById('mydays').innerHTML=error.message; document.getElementById('mydays').innerHTML=tableDays(data||[],false)}
function tableDays(rows,showUser){if(!rows.length)return '<p class="muted">Записів немає</p>'; return `<div class="table-wrap"><table><thead><tr>${showUser?'<th>Працівник</th>':''}<th>Дата</th><th>Напрямки</th><th>Витрати</th><th>Подано</th><th>Змінено</th></tr></thead><tbody>${rows.map(r=>`<tr>${showUser?`<td>${r.users?.full_name||''}<br><span class="muted">${r.users?.callsign||''}</span></td>`:''}<td>${r.work_date}</td><td>${(r.directions||[r.direction]).filter(Boolean).map(d=>`<span class="pill blue">${d}</span>`).join('')}</td><td>${fmt((+r.fuel||0)+(+r.amortization||0)+(+r.accommodation||0))}</td><td>${r.created_at?new Date(r.created_at).toLocaleString('uk-UA'):''}</td><td>${r.updated_at?new Date(r.updated_at).toLocaleString('uk-UA'):''}</td></tr>`).join('')}</tbody></table></div>`}

function screenProfile(){screenEl().innerHTML=`<h2>Мій профіль</h2><div class="row"><div class="col-6"><label>ПІБ</label><input value="${profile.full_name||''}" disabled></div><div class="col-6"><label>Позивний</label><input value="${profile.callsign||''}" disabled></div><div class="col-4"><label>Телефон</label><input id="p_phone" value="${profile.phone||''}"></div><div class="col-4"><label>Email</label><input id="p_email" type="email" value="${profile.email||me.email||''}"></div><div class="col-4"><label>Дата народження</label><input id="p_birth" type="date" value="${profile.birth_date||''}"></div><div class="col-4"><label>Статус</label><input value="${profile.employment_type==='employee'?'Працевлаштований':'Фрілансер'}" disabled></div><div class="col-4"><label>Роль</label><input value="${roleName(profile.role)}" disabled></div><div class="col-4"><label>Стан</label><input value="${profile.status==='dismissed'?'Звільнений':'Активний'}" disabled></div><div class="col-12"><button onclick="saveProfile()">Зберегти профіль</button></div></div><hr><h3>Зміна пароля</h3><div class="row"><div class="col-6"><label>Новий пароль</label><input id="new_pass" type="password"></div><div class="col-6"><label>Повторіть пароль</label><input id="new_pass2" type="password"></div><div class="col-12"><button onclick="changePassword()">Змінити пароль</button></div></div>`}
async function saveProfile(){const updates={phone:p_phone.value||null,email:p_email.value||null,birth_date:p_birth.value||null}; const {error}=await sb.from('users').update(updates).eq('id',profile.id); if(error)return msg(error.message); Object.assign(profile,updates); await logAction('Оновлено профіль',updates); msg('Профіль оновлено'); screenProfile()}
async function changePassword(){const p1=new_pass.value,p2=new_pass2.value; if(!p1||!p2)return msg('Введіть новий пароль двічі'); if(p1!==p2)return msg('Паролі не співпадають'); if(p1.length<6)return msg('Пароль має бути мінімум 6 символів'); const {error}=await sb.auth.updateUser({password:p1}); if(error)return msg(error.message); await logAction('Змінено пароль','Користувач змінив пароль'); msg('Пароль змінено'); new_pass.value=''; new_pass2.value=''}

async function screenEmployees(){screenEl().innerHTML=`<h2>Працівники</h2><div class="row"><div class="col-3"><label>ПІБ</label><input id="e_full"></div><div class="col-3"><label>Позивний</label><input id="e_call"></div><div class="col-3"><label>Email</label><input id="e_email" type="email"></div><div class="col-3"><label>Пароль для входу</label><input id="e_password" type="text" placeholder="Напр. vd2026"></div><div class="col-3"><label>Телефон</label><input id="e_phone"></div><div class="col-3"><label>Дата народження</label><input id="e_birth" type="date"></div><div class="col-3"><label>Статус</label><select id="e_emp"><option value="employee">Працевлаштований</option><option value="freelancer">Фрілансер</option></select></div><div class="col-3"><label>Стан</label><select id="e_status"><option value="active">Активний</option><option value="dismissed">Звільнений</option></select></div><div class="col-3"><label>Роль</label><select id="e_role"><option value="user">Працівник</option><option value="leader">Старший групи</option><option value="admin">Адмін</option></select></div><div class="col-3"><label>Напрямок старшого</label><select id="e_leader"><option value="">—</option>${directions.map(d=>`<option>${d}</option>`).join('')}</select></div><div class="col-3"><label>Ставка за день</label><input id="e_daily_rate" type="number" value="2500"></div><div class="col-3"><label>Утримання працевлаштованого</label><input id="e_employee_deduction" type="number" value="48000"></div><div class="col-12"><button onclick="addEmployee()">Додати працівника</button></div></div><hr><div id="emps">Завантаження...</div>`;loadEmployees()}
async function addEmployee(){const rec={full_name:e_full.value.trim(),callsign:e_call.value.trim(),email:e_email.value.trim(),password:e_password.value.trim(),phone:e_phone.value||null,birth_date:e_birth.value||null,employment_type:e_emp.value,status:e_status.value,role:e_role.value,leader_direction:e_leader.value||null,daily_rate:+e_daily_rate.value||2500,employee_deduction:+e_employee_deduction.value||0}; if(!rec.full_name||!rec.email||!rec.password)return msg('Заповніть ПІБ, email і пароль'); const resp=await fetch('/api/create-employee',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)}); const data=await resp.json().catch(()=>({error:'Невідома помилка'})); if(!resp.ok)return msg(data.error||'Помилка створення'); if(data.auth_id){await sb.from('users').update({daily_rate:rec.daily_rate,employee_deduction:rec.employee_deduction}).eq('auth_id',data.auth_id)} await logAction('Створено працівника',{full_name:rec.full_name,callsign:rec.callsign,email:rec.email,role:rec.role}); msg('Працівника створено автоматично: Auth + профіль users'); screenEmployees()}
async function loadEmployees(){const {data,error}=await sb.from('users').select('*').order('full_name'); if(error)return document.getElementById('emps').innerHTML=error.message; document.getElementById('emps').innerHTML=`<div class="table-wrap"><table><thead><tr><th>ПІБ</th><th>Позивний</th><th>Email</th><th>Роль</th><th>Тип</th><th>Стан</th><th>Ставка/день</th><th>Утримання</th><th>Дія</th><th>Auth ID</th></tr></thead><tbody>${(data||[]).map(u=>`<tr><td>${u.full_name}</td><td>${u.callsign||''}</td><td>${u.email||''}</td><td>${roleName(u.role)}</td><td>${u.employment_type==='employee'?'Працевлаштований':'Фрілансер'}</td><td>${u.status==='active'?'Активний':'Звільнений'}</td><td><input id="rate_${u.id}" type="number" value="${u.daily_rate||2500}" style="min-width:110px"></td><td><input id="ded_${u.id}" type="number" value="${u.employee_deduction||48000}" style="min-width:130px"></td><td><button onclick="saveEmployeePaySettings('${u.id}')">Зберегти</button></td><td class="muted">${u.auth_id||'не прив’язано'}</td></tr>`).join('')}</tbody></table></div>`}
async function saveEmployeePaySettings(userId){const rate=+document.getElementById('rate_'+userId).value||0; const ded=+document.getElementById('ded_'+userId).value||0; const {error}=await sb.from('users').update({daily_rate:rate,employee_deduction:ded}).eq('id',userId); if(error)return msg(error.message); await logAction('Змінено зарплатні налаштування',{user_id:userId,daily_rate:rate,employee_deduction:ded}); msg('Налаштування зарплати збережено'); loadEmployees()}

async function screenReports(){const {data,error}=await sb.from('salary_summary').select('*').order('salary_month',{ascending:false}); screenEl().innerHTML='<h2>Звіти</h2><button onclick="exportSalaryExcel()">Експорт Excel</button><hr>'+ (error?error.message:`<div class="table-wrap"><table><thead><tr><th>Місяць</th><th>ПІБ</th><th>Днів</th><th>Ставка</th><th>Зарплата</th><th>Витрати</th><th>Коригування</th><th>Утримання</th><th>До виплати</th></tr></thead><tbody>${(data||[]).map(r=>`<tr><td>${r.salary_month}</td><td>${r.full_name}</td><td>${r.work_days_count}</td><td>${fmt(r.daily_rate||0)}</td><td>${fmt(r.base_salary)}</td><td>${fmt((+r.fuel_total||0)+(+r.amortization_total||0)+(+r.accommodation_total||0))}</td><td>${fmt(r.adjustments_total||0)}</td><td>${fmt(r.employee_deduction)}</td><td><b>${fmt(r.total_to_pay)}</b></td></tr>`).join('')}</tbody></table></div>`)}
async function exportSalaryExcel(){const {data,error}=await sb.from('salary_summary').select('*').order('salary_month',{ascending:false}); if(error)return msg(error.message); if(!data||!data.length)return msg('Немає даних для експорту'); const rows=[['Місяць','ПІБ','Позивний','Днів','Ставка/день','Зарплата','Пальне','Амортизація','Проживання','Утримання','Коригування','До виплати'],...data.map(r=>[r.salary_month,r.full_name,r.callsign||'',r.work_days_count||0,r.daily_rate||0,r.base_salary||0,r.fuel_total||0,r.amortization_total||0,r.accommodation_total||0,r.employee_deduction||0,r.adjustments_total||0,r.total_to_pay||0])]; const csv=rows.map(row=>row.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(';')).join('\n'); const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}); const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download='zp-vd-zvit.csv'; link.click()}

async function screenAdjustments(){const month=(window.currentAdjustmentMonth||ym().slice(0,7)); screenEl().innerHTML=`<h2>Коригування зарплати</h2><div class="row"><div class="col-3"><label>Місяць</label><input id="a_month" type="month" value="${month}" onchange="window.currentAdjustmentMonth=this.value;loadAdjustments()"></div><div class="col-3"><label>Працівник</label><select id="a_user"></select></div><div class="col-2"><label>Тип</label><select id="a_type"><option value="bonus">Премія</option><option value="fine">Штраф</option></select></div><div class="col-2"><label>Сума</label><input id="a_amount" type="number" value="0"></div><div class="col-12"><label>Коментар</label><input id="a_comment" placeholder="Причина коригування"></div><div class="col-12"><button onclick="addAdjustment()">Додати коригування</button></div></div><hr><div id="adj_list">Завантаження...</div>`; await fillAdjustmentUsers(); loadAdjustments()}
async function fillAdjustmentUsers(){const {data,error}=await sb.from('users').select('id,full_name,callsign,status').order('full_name'); if(error)return msg(error.message); document.getElementById('a_user').innerHTML=(data||[]).filter(u=>u.status!=='dismissed').map(u=>`<option value="${u.id}">${u.full_name} ${u.callsign?'('+u.callsign+')':''}</option>`).join('')}
function adjustmentMonth(){return (document.getElementById('a_month')?.value||window.currentAdjustmentMonth||ym().slice(0,7))+'-01'}
async function addAdjustment(){const rec={user_id:a_user.value,adjustment_month:adjustmentMonth(),type:a_type.value,amount:+a_amount.value||0,title:a_comment.value||(a_type.value==='bonus'?'Премія':'Штраф'),comment:a_comment.value||'',created_by:profile.id}; if(!rec.user_id)return msg('Оберіть працівника'); if(rec.amount<=0)return msg('Вкажіть суму більше 0'); const {error}=await sb.from('adjustments').insert(rec); if(error)return msg(error.message); await logAction('Додано коригування',{type:rec.type,amount:rec.amount,comment:rec.comment,user_id:rec.user_id,month:rec.adjustment_month}); msg('Коригування додано'); a_amount.value=0; a_comment.value=''; loadAdjustments()}
async function loadAdjustments(){const adjList=document.getElementById('adj_list'); if(!adjList)return; const month=adjustmentMonth(); const {data,error}=await sb.from('adjustments').select('*').eq('adjustment_month',month).order('created_at',{ascending:false}); if(error)return adjList.innerHTML=error.message; if(!data||!data.length)return adjList.innerHTML='<p class="muted">Коригувань за цей місяць немає.</p>'; const ids=[...new Set(data.map(a=>a.user_id).filter(Boolean))]; let users=[]; if(ids.length){const r=await sb.from('users').select('id,full_name,callsign').in('id',ids); if(r.error)return adjList.innerHTML=r.error.message; users=r.data||[]} const usersMap=Object.fromEntries(users.map(u=>[u.id,u])); adjList.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Працівник</th><th>Тип</th><th>Сума</th><th>Коментар</th><th>Дата</th><th></th></tr></thead><tbody>${data.map(a=>{const u=usersMap[a.user_id]||{};return `<tr><td>${u.full_name||''} ${u.callsign?'('+u.callsign+')':''}</td><td>${a.type==='bonus'?'<span class="pill green">Премія</span>':'<span class="pill red">Штраф</span>'}</td><td>${fmt(a.amount)}</td><td>${escapeHtml(a.comment||a.title||'')}</td><td>${a.created_at?new Date(a.created_at).toLocaleString('uk-UA'):''}</td><td><button class="danger" onclick="deleteAdjustment('${a.id}')">Видалити</button></td></tr>`}).join('')}</tbody></table></div>`}
async function deleteAdjustment(id){if(!confirm('Видалити це коригування?'))return; const {error}=await sb.from('adjustments').delete().eq('id',id); if(error)return msg(error.message); await logAction('Видалено коригування',id); msg('Видалено'); loadAdjustments()}

async function logAction(action,details){try{await sb.from('audit_log').insert({user_id:profile?.id||null,action,details:details??''})}catch(e){}}
function formatAuditDetails(details){
  if(details==null || details==='') return '';
  let d=details;
  if(typeof d==='string'){
    const t=d.trim();
    if(t==='[object Object]') return 'Деталі записані у старому форматі';
    try{d=JSON.parse(t)}catch(e){return escapeHtml(d)}
  }
  if(typeof d!=='object') return escapeHtml(String(d));
  const lines=[];
  if(d.work_date) lines.push('Дата роботи: '+d.work_date.split('-').reverse().join('.'));
  if(d.directions?.length) lines.push('Напрямки: '+d.directions.join(', '));
  else if(d.direction) lines.push('Напрямок: '+d.direction);
  if(d.fuel!==undefined) lines.push('Пальне: '+fmt(d.fuel));
  if(d.amortization!==undefined) lines.push('Амортизація: '+fmt(d.amortization));
  if(d.accommodation!==undefined) lines.push('Проживання: '+fmt(d.accommodation));
  if(d.amount!==undefined) lines.push('Сума: '+fmt(d.amount));
  if(d.type) lines.push('Тип: '+(d.type==='bonus'?'Премія':d.type==='fine'?'Штраф':d.type));
  if(d.month) lines.push('Місяць: '+String(d.month).slice(0,7));
  if(d.daily_rate!==undefined) lines.push('Ставка/день: '+fmt(d.daily_rate));
  if(d.employee_deduction!==undefined) lines.push('Утримання: '+fmt(d.employee_deduction));
  if(d.full_name) lines.push('ПІБ: '+d.full_name);
  if(d.callsign) lines.push('Позивний: '+d.callsign);
  if(d.email) lines.push('Email: '+d.email);
  if(d.comment) lines.push('Коментар: '+d.comment);
  if(lines.length) return escapeHtml(lines.join('\n'));
  return escapeHtml(JSON.stringify(d,null,2));
}
async function screenAudit(){
  screenEl().innerHTML='<h2>Журнал дій</h2><div id="audit_list">Завантаження...</div>';
  const {data,error}=await sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(250);
  const list=document.getElementById('audit_list');
  if(error)return list.innerHTML=error.message;
  if(!data||!data.length)return list.innerHTML='<p class="muted">Записів у журналі ще немає.</p>';
  const ids=[...new Set(data.map(x=>x.user_id).filter(Boolean))];
  let users=[]; if(ids.length){const r=await sb.from('users').select('id,full_name,callsign').in('id',ids); users=r.data||[]}
  const map=Object.fromEntries(users.map(u=>[u.id,u]));
  list.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Дата</th><th>Користувач</th><th>Дія</th><th>Деталі</th></tr></thead><tbody>${data.map(a=>{const u=map[a.user_id]||{};return `<tr><td>${a.created_at?new Date(a.created_at).toLocaleString('uk-UA'):''}</td><td>${u.full_name||''} ${u.callsign?'('+u.callsign+')':''}</td><td>${escapeHtml(a.action||'')}</td><td><pre class="audit-details">${formatAuditDetails(a.details)}</pre></td></tr>`}).join('')}</tbody></table></div>`;
}

async function screenLeader(){const dir=profile.leader_direction; if(!dir)return screenEl().innerHTML='<h2>Мій напрямок</h2><p>Вам не призначено напрямок.</p>'; const m=ym(); const {data,error}=await sb.from('work_days').select('*, users(full_name,callsign)').contains('directions',[dir]).gte('work_date',m).lte('work_date',monthEnd(m)).order('work_date',{ascending:false}).limit(200); screenEl().innerHTML=`<h2>Звіти по напрямку: ${dir}</h2>`+(error?error.message:tableDays(data||[],true))}
function selectedLockMonth(){return document.getElementById('lock_month').value+'-01'}
async function screenLocks(){const month=window.currentLockMonth||ym().slice(0,7); screenEl().innerHTML=`<h2>Закриття місяця</h2><label>Оберіть місяць</label><input id="lock_month" type="month" value="${month}" onchange="window.currentLockMonth=this.value;screenLocksLoad()"><div id="locks_area" style="margin-top:16px">Завантаження...</div>`; screenLocksLoad()}
async function screenLocksLoad(){const month=selectedLockMonth(); const {data:users,error:uErr}=await sb.from('users').select('id, full_name, callsign, status').order('full_name'); if(uErr)return document.getElementById('locks_area').innerHTML=uErr.message; const {data:locks,error:lErr}=await sb.from('month_locks').select('*').eq('lock_month',month); if(lErr)return document.getElementById('locks_area').innerHTML=lErr.message; const lockedIds=new Set((locks||[]).map(l=>l.user_id)); document.getElementById('locks_area').innerHTML=`<button onclick="closeMonthAll()">Закрити вибраний місяць всім активним</button> <button class="secondary" onclick="openMonthAll()">Відкрити всім</button><hr><h3>Закрити вибраним</h3><div class="checkrow">${(users||[]).map(u=>`<label><input type="checkbox" name="lock_user" value="${u.id}" ${lockedIds.has(u.id)?'checked':''}> ${u.full_name} ${u.callsign?'('+u.callsign+')':''} ${lockedIds.has(u.id)?'🔒':''}</label>`).join('')}</div><div style="height:14px"></div><button onclick="closeMonthSelected()">Закрити вибраним</button> <button class="secondary" onclick="openMonthSelected()">Відкрити вибраним</button><hr><h3>Закриті за місяць</h3>${(locks||[]).length?`<div class="table-wrap"><table><thead><tr><th>Працівник</th><th>Дата закриття</th></tr></thead><tbody>${(locks||[]).map(l=>{const u=(users||[]).find(x=>x.id===l.user_id);return `<tr><td>${u?u.full_name:l.user_id}</td><td>${l.locked_at?new Date(l.locked_at).toLocaleString('uk-UA'):''}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">За цей місяць ще нікого не закрито.</p>'}`}
async function closeMonthAll(){if(!confirm('Закрити вибраний місяць всім активним працівникам?'))return; const month=selectedLockMonth(); const {data:users,error:uErr}=await sb.from('users').select('id').eq('status','active'); if(uErr)return msg(uErr.message); const rows=(users||[]).map(u=>({salary_month:month,lock_month:month,user_id:u.id,locked_by:profile.id})); if(!rows.length)return msg('Активних працівників не знайдено'); const {error}=await sb.from('month_locks').upsert(rows,{onConflict:'lock_month,user_id'}); if(error)return msg(error.message); await logAction('Закрито місяць всім',month); msg('Місяць закрито всім активним працівникам'); screenLocksLoad()}
async function closeMonthSelected(){const ids=[...document.querySelectorAll('input[name=lock_user]:checked')].map(x=>x.value); if(!ids.length)return msg('Оберіть хоча б одного працівника'); const month=selectedLockMonth(); const rows=ids.map(id=>({salary_month:month,lock_month:month,user_id:id,locked_by:profile.id})); const {error}=await sb.from('month_locks').upsert(rows,{onConflict:'lock_month,user_id'}); if(error)return msg(error.message); await logAction('Закрито місяць вибраним',{month,count:ids.length}); msg('Місяць закрито вибраним працівникам'); screenLocksLoad()}
async function openMonthAll(){if(!confirm('Відкрити вибраний місяць всім працівникам?'))return; const month=selectedLockMonth(); const {error}=await sb.from('month_locks').delete().eq('lock_month',month); if(error)return msg(error.message); await logAction('Відкрито місяць всім',month); msg('Місяць відкрито всім'); screenLocksLoad()}
async function openMonthSelected(){const ids=[...document.querySelectorAll('input[name=lock_user]:checked')].map(x=>x.value); if(!ids.length)return msg('Оберіть хоча б одного працівника'); const month=selectedLockMonth(); const {error}=await sb.from('month_locks').delete().eq('lock_month',month).in('user_id',ids); if(error)return msg(error.message); await logAction('Відкрито місяць вибраним',{month,count:ids.length}); msg('Місяць відкрито вибраним'); screenLocksLoad()}

init();
